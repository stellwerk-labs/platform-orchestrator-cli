{
  "actions": [
    {
      "description": "Add only immutable legacy Rollouts paths and their missing components",
      "target": "$",
      "update": {
        "components": {
          "parameters": {
            "deploymentIdPathParam": {
              "description": "Deployment UUID belonging to the Rollout.",
              "in": "path",
              "name": "deploymentId",
              "required": true,
              "schema": {
                "format": "uuid",
                "type": "string"
              }
            },
            "planRevisionPathParam": {
              "description": "Immutable numbered plan revision.",
              "in": "path",
              "name": "planRevision",
              "required": true,
              "schema": {
                "minimum": 1,
                "type": "integer"
              }
            },
            "rolloutIdPathParam": {
              "description": "Progressive Rollout UUID.",
              "in": "path",
              "name": "rolloutId",
              "required": true,
              "schema": {
                "format": "uuid",
                "type": "string"
              }
            }
          },
          "schemas": {
            "ProgressiveRollout": {
              "properties": {
                "archived_at": {
                  "format": "date-time",
                  "type": "string"
                },
                "created_at": {
                  "format": "date-time",
                  "type": "string"
                },
                "created_by": {
                  "format": "uuid",
                  "type": "string"
                },
                "current_plan_revision": {
                  "minimum": 1,
                  "type": "integer"
                },
                "execution_started": {
                  "type": "boolean"
                },
                "id": {
                  "format": "uuid",
                  "type": "string"
                },
                "org_id": {
                  "type": "string"
                },
                "resource_version": {
                  "format": "int64",
                  "minimum": 1,
                  "type": "integer"
                },
                "spec": {
                  "$ref": "#/components/schemas/ProgressiveRolloutSpec"
                },
                "state": {
                  "$ref": "#/components/schemas/ProgressiveRolloutState"
                },
                "status": {
                  "$ref": "#/components/schemas/ProgressiveRolloutStatus"
                },
                "updated_at": {
                  "format": "date-time",
                  "type": "string"
                }
              },
              "required": [
                "id",
                "org_id",
                "spec",
                "state",
                "status",
                "resource_version",
                "execution_started",
                "created_by",
                "created_at",
                "updated_at"
              ],
              "type": "object"
            },
            "ProgressiveRolloutApproval": {
              "properties": {
                "actor": {
                  "format": "uuid",
                  "type": "string"
                },
                "coverages": {
                  "items": {
                    "$ref": "#/components/schemas/ProgressiveRolloutApprovalCoverage"
                  },
                  "type": "array"
                },
                "granted_at": {
                  "format": "date-time",
                  "type": "string"
                },
                "id": {
                  "format": "uuid",
                  "type": "string"
                },
                "intent_fingerprint": {
                  "type": "string"
                },
                "plan_revision": {
                  "type": "integer"
                },
                "reason": {
                  "type": "string"
                },
                "revoked_at": {
                  "format": "date-time",
                  "type": "string"
                },
                "rollout_id": {
                  "format": "uuid",
                  "type": "string"
                },
                "scope_id": {
                  "format": "uuid",
                  "type": "string"
                },
                "scope_type": {
                  "enum": [
                    "environment",
                    "project"
                  ],
                  "type": "string"
                }
              },
              "required": [
                "id",
                "rollout_id",
                "plan_revision",
                "scope_type",
                "scope_id",
                "reason",
                "intent_fingerprint",
                "coverages",
                "actor",
                "granted_at"
              ],
              "type": "object"
            },
            "ProgressiveRolloutApprovalBody": {
              "properties": {
                "plan_revision": {
                  "minimum": 1,
                  "type": "integer"
                },
                "reason": {
                  "description": "Mandatory human-readable reason retained with the immutable approval grant.",
                  "maxLength": 500,
                  "minLength": 1,
                  "type": "string"
                },
                "scope_id": {
                  "format": "uuid",
                  "type": "string"
                },
                "scope_type": {
                  "enum": [
                    "environment",
                    "project"
                  ],
                  "type": "string"
                }
              },
              "required": [
                "plan_revision",
                "scope_type",
                "scope_id",
                "reason"
              ],
              "type": "object"
            },
            "ProgressiveRolloutApprovalCoverage": {
              "properties": {
                "consumed_at": {
                  "format": "date-time",
                  "type": "string"
                },
                "environment_id": {
                  "format": "uuid",
                  "type": "string"
                },
                "invalidated_at": {
                  "format": "date-time",
                  "type": "string"
                },
                "invalidation_reason": {
                  "type": "string"
                },
                "pin_activation_boundaries": {
                  "additionalProperties": {
                    "type": "string"
                  },
                  "description": "Target Module ID to exact latest Pin activation event UUID, or an empty value when none existed.",
                  "type": "object"
                },
                "revoked_at": {
                  "format": "date-time",
                  "type": "string"
                }
              },
              "required": [
                "environment_id",
                "pin_activation_boundaries"
              ],
              "type": "object"
            },
            "ProgressiveRolloutClassification": {
              "enum": [
                "Pending",
                "Pinned",
                "AlreadyCompliant",
                "NotApplicable",
                "Conflict"
              ],
              "type": "string"
            },
            "ProgressiveRolloutCommandBody": {
              "properties": {
                "confirm_defective_versions": {
                  "default": false,
                  "description": "Explicit confirmation that an authorised Rollback may restore a Defective starting version.",
                  "type": "boolean"
                },
                "environment_id": {
                  "format": "uuid",
                  "type": "string"
                },
                "environment_ids": {
                  "description": "Optional explicit subset for deferred Pin actions; omission selects every eligible Environment.",
                  "items": {
                    "format": "uuid",
                    "type": "string"
                  },
                  "type": "array"
                },
                "expected_resource_version": {
                  "format": "int64",
                  "minimum": 1,
                  "type": "integer"
                },
                "reason": {
                  "description": "Mandatory human reason for audited commands such as bypass-bake.",
                  "maxLength": 500,
                  "minLength": 1,
                  "type": "string"
                },
                "wave_id": {
                  "type": "string"
                }
              },
              "required": [
                "expected_resource_version"
              ],
              "type": "object"
            },
            "ProgressiveRolloutConcurrency": {
              "properties": {
                "absolute": {
                  "minimum": 1,
                  "type": "integer"
                },
                "percentage": {
                  "exclusiveMinimum": true,
                  "format": "double",
                  "maximum": 100,
                  "minimum": 0,
                  "type": "number"
                }
              },
              "type": "object"
            },
            "ProgressiveRolloutConflict": {
              "properties": {
                "actual": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "created_at": {
                  "format": "date-time",
                  "type": "string"
                },
                "environment_id": {
                  "format": "uuid",
                  "type": "string"
                },
                "expected": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "id": {
                  "format": "uuid",
                  "type": "string"
                },
                "kind": {
                  "type": "string"
                },
                "module_id": {
                  "type": "string"
                },
                "observed_fingerprint": {
                  "type": "string"
                },
                "plan_revision": {
                  "type": "integer"
                },
                "resolution": {
                  "type": "string"
                },
                "resolved_at": {
                  "format": "date-time",
                  "type": "string"
                },
                "resolved_by": {
                  "format": "uuid",
                  "type": "string"
                },
                "rollout_id": {
                  "format": "uuid",
                  "type": "string"
                },
                "status": {
                  "enum": [
                    "open",
                    "approved",
                    "resolved",
                    "aborted"
                  ],
                  "type": "string"
                }
              },
              "required": [
                "id",
                "rollout_id",
                "plan_revision",
                "environment_id",
                "kind",
                "expected",
                "actual",
                "observed_fingerprint",
                "status",
                "created_at"
              ],
              "type": "object"
            },
            "ProgressiveRolloutConflictResolutionBody": {
              "additionalProperties": false,
              "properties": {
                "expected_resource_version": {
                  "format": "int64",
                  "minimum": 1,
                  "type": "integer"
                },
                "observed_fingerprint": {
                  "minLength": 1,
                  "type": "string"
                },
                "plan_revision": {
                  "minimum": 1,
                  "type": "integer"
                }
              },
              "required": [
                "plan_revision",
                "observed_fingerprint",
                "expected_resource_version"
              ],
              "type": "object"
            },
            "ProgressiveRolloutDetail": {
              "properties": {
                "approvals": {
                  "items": {
                    "$ref": "#/components/schemas/ProgressiveRolloutApproval"
                  },
                  "type": "array"
                },
                "conflicts": {
                  "items": {
                    "$ref": "#/components/schemas/ProgressiveRolloutConflict"
                  },
                  "type": "array"
                },
                "events": {
                  "items": {
                    "$ref": "#/components/schemas/ProgressiveRolloutEvent"
                  },
                  "type": "array"
                },
                "executions": {
                  "items": {
                    "$ref": "#/components/schemas/ProgressiveRolloutEnvironmentExecution"
                  },
                  "type": "array"
                },
                "metrics": {
                  "$ref": "#/components/schemas/ProgressiveRolloutMetrics"
                },
                "plan": {
                  "$ref": "#/components/schemas/ProgressiveRolloutPlan"
                },
                "rollout": {
                  "$ref": "#/components/schemas/ProgressiveRollout"
                }
              },
              "required": [
                "rollout",
                "executions",
                "approvals",
                "conflicts",
                "events",
                "metrics"
              ],
              "type": "object"
            },
            "ProgressiveRolloutDraftUpdate": {
              "properties": {
                "expected_resource_version": {
                  "format": "int64",
                  "minimum": 1,
                  "type": "integer"
                },
                "spec": {
                  "$ref": "#/components/schemas/ProgressiveRolloutSpec"
                }
              },
              "required": [
                "spec",
                "expected_resource_version"
              ],
              "type": "object"
            },
            "ProgressiveRolloutEnvironmentExecution": {
              "properties": {
                "actual_versions": {
                  "additionalProperties": {
                    "type": "string"
                  },
                  "type": "object"
                },
                "admission_base_deployment_id": {
                  "description": "Latest admitted attempt's actual predecessor. Forward retry planning may use a later base without changing the rollback base.",
                  "format": "uuid",
                  "type": "string"
                },
                "attempts": {
                  "minimum": 0,
                  "type": "integer"
                },
                "changed": {
                  "type": "boolean"
                },
                "completed_at": {
                  "format": "date-time",
                  "type": "string"
                },
                "deployment_id": {
                  "format": "uuid",
                  "type": "string"
                },
                "effective_base_deployment_id": {
                  "description": "Immutable first successful state-changing Deployment captured before this Rollout's first forward admission. This is the rollback base, not a later forward retry's admission base.",
                  "format": "uuid",
                  "type": "string"
                },
                "environment_id": {
                  "format": "uuid",
                  "type": "string"
                },
                "execution_diff": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "execution_fingerprint": {
                  "pattern": "^sha256:[a-f0-9]{64}$",
                  "type": "string"
                },
                "execution_graph": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "execution_manifest": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "first_forward_deployment_id": {
                  "description": "Data Plane-owned first forward Deployment identity for this operation and Environment.",
                  "format": "uuid",
                  "type": "string"
                },
                "last_error": {
                  "type": "string"
                },
                "pre_deployment_attempts": {
                  "minimum": 0,
                  "type": "integer"
                },
                "project_id": {
                  "type": "string"
                },
                "removal": {
                  "$ref": "#/components/schemas/ProgressiveRolloutEnvironmentRemoval"
                },
                "resource_version": {
                  "format": "int64",
                  "minimum": 1,
                  "type": "integer"
                },
                "retry_at": {
                  "format": "date-time",
                  "type": "string"
                },
                "retry_started_at": {
                  "format": "date-time",
                  "type": "string"
                },
                "rollback_available": {
                  "description": "Factual current-state eligibility to roll back this Environment to the Rollout's captured base. Authorization and authoritative Data Plane admission are still required.",
                  "type": "boolean"
                },
                "rollback_deployment_id": {
                  "format": "uuid",
                  "type": "string"
                },
                "rollback_retry_available": {
                  "description": "Factual current-state eligibility for an explicit retry of the latest failed rollback. Authorization and authoritative Data Plane admission are still required.",
                  "type": "boolean"
                },
                "rollback_retry_pending": {
                  "description": "An explicit rollback retry command is durably recorded but its new Deployment has not been admitted.",
                  "type": "boolean"
                },
                "started_at": {
                  "format": "date-time",
                  "type": "string"
                },
                "state": {
                  "$ref": "#/components/schemas/ProgressiveRolloutEnvironmentState"
                },
                "wave_id": {
                  "type": "string"
                }
              },
              "required": [
                "environment_id",
                "project_id",
                "wave_id",
                "state",
                "attempts",
                "pre_deployment_attempts",
                "changed",
                "actual_versions",
                "resource_version"
              ],
              "type": "object"
            },
            "ProgressiveRolloutEnvironmentRemoval": {
              "properties": {
                "actor": {
                  "format": "uuid",
                  "type": "string"
                },
                "deleted_at": {
                  "format": "date-time",
                  "type": "string"
                },
                "operation_id": {
                  "format": "uuid",
                  "type": "string"
                },
                "reason": {
                  "type": "string"
                }
              },
              "required": [
                "actor",
                "reason",
                "operation_id",
                "deleted_at"
              ],
              "type": "object"
            },
            "ProgressiveRolloutEnvironmentState": {
              "enum": [
                "Pending",
                "Pinned",
                "UnpinnedPending",
                "EnvironmentRemoved",
                "AlreadyCompliant",
                "NotApplicable",
                "Busy",
                "Unreconciled",
                "AwaitingApproval",
                "Blocked",
                "Conflict",
                "Running",
                "Succeeded",
                "Failed",
                "RollingBack",
                "RolledBack"
              ],
              "type": "string"
            },
            "ProgressiveRolloutEnvironmentTombstone": {
              "properties": {
                "deleted_at": {
                  "format": "date-time",
                  "type": "string"
                },
                "deleted_by": {
                  "format": "uuid",
                  "type": "string"
                },
                "deletion_operation_id": {
                  "format": "uuid",
                  "type": "string"
                },
                "deletion_reason": {
                  "type": "string"
                },
                "environment_display_name": {
                  "type": "string"
                },
                "environment_id": {
                  "format": "uuid",
                  "type": "string"
                },
                "environment_slug": {
                  "type": "string"
                },
                "project_id": {
                  "type": "string"
                },
                "project_uuid": {
                  "format": "uuid",
                  "type": "string"
                },
                "wave_id": {
                  "type": "string"
                }
              },
              "required": [
                "environment_id",
                "environment_slug",
                "project_id",
                "project_uuid",
                "wave_id"
              ],
              "type": "object"
            },
            "ProgressiveRolloutEvent": {
              "properties": {
                "actor": {
                  "format": "uuid",
                  "type": "string"
                },
                "created_at": {
                  "format": "date-time",
                  "type": "string"
                },
                "payload": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "plan_revision": {
                  "type": "integer"
                },
                "rollout_id": {
                  "format": "uuid",
                  "type": "string"
                },
                "sequence": {
                  "format": "int64",
                  "type": "integer"
                },
                "type": {
                  "type": "string"
                }
              },
              "required": [
                "sequence",
                "rollout_id",
                "type",
                "payload",
                "created_at"
              ],
              "type": "object"
            },
            "ProgressiveRolloutMetrics": {
              "properties": {
                "approval_wait_seconds": {
                  "format": "int64",
                  "minimum": 0,
                  "type": "integer"
                },
                "bake_bypass_count": {
                  "minimum": 0,
                  "type": "integer"
                },
                "bake_duration_seconds": {
                  "format": "int64",
                  "minimum": 0,
                  "type": "integer"
                },
                "blocked_environments": {
                  "minimum": 0,
                  "type": "integer"
                },
                "continue_unpinned_count": {
                  "minimum": 0,
                  "type": "integer"
                },
                "duration_seconds": {
                  "format": "int64",
                  "minimum": 0,
                  "type": "integer"
                },
                "environment_removed_count": {
                  "minimum": 0,
                  "type": "integer"
                },
                "failure_rate": {
                  "format": "double",
                  "maximum": 1,
                  "minimum": 0,
                  "type": "number"
                },
                "pin_override_count": {
                  "minimum": 0,
                  "type": "integer"
                },
                "pinned_environments": {
                  "minimum": 0,
                  "type": "integer"
                },
                "rollback_count": {
                  "minimum": 0,
                  "type": "integer"
                },
                "success_rate": {
                  "format": "double",
                  "maximum": 1,
                  "minimum": 0,
                  "type": "number"
                },
                "superseded_count": {
                  "maximum": 1,
                  "minimum": 0,
                  "type": "integer"
                },
                "unpinned_pending_environments": {
                  "minimum": 0,
                  "type": "integer"
                },
                "waves": {
                  "items": {
                    "$ref": "#/components/schemas/ProgressiveRolloutWaveMetrics"
                  },
                  "type": "array"
                }
              },
              "required": [
                "duration_seconds",
                "success_rate",
                "failure_rate",
                "blocked_environments",
                "pinned_environments",
                "unpinned_pending_environments",
                "environment_removed_count",
                "approval_wait_seconds",
                "bake_duration_seconds",
                "bake_bypass_count",
                "pin_override_count",
                "continue_unpinned_count",
                "superseded_count",
                "rollback_count",
                "waves"
              ],
              "type": "object"
            },
            "ProgressiveRolloutModuleChange": {
              "properties": {
                "from": {
                  "minLength": 1,
                  "type": "string"
                },
                "module_id": {
                  "minLength": 1,
                  "type": "string"
                },
                "target_digest": {
                  "description": "Exact immutable external artifact digest. Empty for inline source.",
                  "type": "string"
                },
                "target_status": {
                  "$ref": "#/components/schemas/ModuleVersionSemanticStatus"
                },
                "target_version": {
                  "minLength": 5,
                  "type": "string"
                }
              },
              "required": [
                "module_id",
                "from",
                "target_version",
                "target_digest",
                "target_status"
              ],
              "type": "object"
            },
            "ProgressiveRolloutModuleSnapshot": {
              "properties": {
                "digest": {
                  "type": "string"
                },
                "status": {
                  "$ref": "#/components/schemas/ModuleVersionSemanticStatus"
                },
                "version": {
                  "type": "string"
                }
              },
              "required": [
                "version",
                "digest"
              ],
              "type": "object"
            },
            "ProgressiveRolloutPage": {
              "properties": {
                "items": {
                  "items": {
                    "$ref": "#/components/schemas/ProgressiveRollout"
                  },
                  "type": "array"
                },
                "next_page_token": {
                  "type": "string"
                },
                "view_counts": {
                  "$ref": "#/components/schemas/ProgressiveRolloutViewCounts"
                }
              },
              "required": [
                "items"
              ],
              "type": "object"
            },
            "ProgressiveRolloutPinNoteSnapshot": {
              "properties": {
                "actor": {
                  "format": "uuid",
                  "type": "string"
                },
                "actor_type": {
                  "type": "string"
                },
                "created_at": {
                  "format": "date-time",
                  "type": "string"
                },
                "id": {
                  "format": "uuid",
                  "type": "string"
                },
                "note": {
                  "type": "string"
                }
              },
              "required": [
                "id",
                "actor",
                "actor_type",
                "note",
                "created_at"
              ],
              "type": "object"
            },
            "ProgressiveRolloutPinSnapshot": {
              "properties": {
                "activation_event_id": {
                  "format": "uuid",
                  "type": "string"
                },
                "created_at": {
                  "format": "date-time",
                  "type": "string"
                },
                "created_by": {
                  "format": "uuid",
                  "type": "string"
                },
                "created_by_type": {
                  "type": "string"
                },
                "creation_reason": {
                  "type": "string"
                },
                "id": {
                  "format": "uuid",
                  "type": "string"
                },
                "module_id": {
                  "type": "string"
                },
                "notes": {
                  "items": {
                    "$ref": "#/components/schemas/ProgressiveRolloutPinNoteSnapshot"
                  },
                  "type": "array"
                },
                "override_actor": {
                  "format": "uuid",
                  "type": "string"
                },
                "override_deployment_id": {
                  "format": "uuid",
                  "type": "string"
                },
                "override_operation_id": {
                  "format": "uuid",
                  "type": "string"
                },
                "override_reason": {
                  "type": "string"
                },
                "scope_id": {
                  "format": "uuid",
                  "type": "string"
                },
                "scope_type": {
                  "enum": [
                    "environment"
                  ],
                  "type": "string"
                },
                "status": {
                  "$ref": "#/components/schemas/ModuleVersionPinStatus"
                },
                "version": {
                  "type": "string"
                }
              },
              "required": [
                "id",
                "module_id",
                "version",
                "activation_event_id",
                "created_at"
              ],
              "type": "object"
            },
            "ProgressiveRolloutPlan": {
              "properties": {
                "changes": {
                  "items": {
                    "$ref": "#/components/schemas/ProgressiveRolloutPlanModuleChange"
                  },
                  "type": "array"
                },
                "created_at": {
                  "format": "date-time",
                  "type": "string"
                },
                "default_promotion": {
                  "enum": [
                    "none",
                    "atStart",
                    "onSuccess"
                  ],
                  "type": "string"
                },
                "environments": {
                  "items": {
                    "$ref": "#/components/schemas/ProgressiveRolloutPlannedEnvironment"
                  },
                  "type": "array"
                },
                "fingerprint": {
                  "type": "string"
                },
                "promotions": {
                  "items": {
                    "$ref": "#/components/schemas/ProgressiveRolloutPromotion"
                  },
                  "type": "array"
                },
                "revision": {
                  "minimum": 0,
                  "type": "integer"
                },
