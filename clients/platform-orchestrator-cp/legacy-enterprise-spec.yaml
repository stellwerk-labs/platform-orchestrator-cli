    ProgressiveRolloutDraftUpdate:
      type: object
      required: [spec, expected_resource_version]
      properties:
        spec: {$ref: '#/components/schemas/ProgressiveRolloutSpec'}
        expected_resource_version: {type: integer, format: int64, minimum: 1}

    ProgressiveRolloutPrepareBody:
      type: object
      required: [expected_resource_version, candidate_fingerprint]
      properties:
        expected_resource_version: {type: integer, format: int64, minimum: 1}
        candidate_fingerprint: {type: string, minLength: 1}
        accepted_conflict_fingerprints:
          type: array
          items: {type: string}
          x-go-type-skip-optional-pointer: true

    ProgressiveRolloutCommandBody:
      type: object
      required: [expected_resource_version]
      properties:
        expected_resource_version: {type: integer, format: int64, minimum: 1}
        wave_id: {type: string}
        environment_id: {type: string, format: uuid}
        environment_ids:
          type: array
          items: {type: string, format: uuid}
          description: Optional explicit subset for deferred Pin actions; omission selects every eligible Environment.
        confirm_defective_versions:
          type: boolean
          default: false
          description: Explicit confirmation that an authorised Rollback may restore a Defective starting version.
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Mandatory human reason for audited commands such as bypass-bake.

    ProgressiveRolloutApprovalBody:
      type: object
      required: [plan_revision, scope_type, scope_id, reason]
      properties:
        plan_revision: {type: integer, minimum: 1}
        scope_type: {type: string, enum: [environment, project]}
        scope_id: {type: string, format: uuid}
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Mandatory human-readable reason retained with the immutable approval grant.

    ProgressiveRolloutApproval:
      type: object
      required: [id, rollout_id, plan_revision, scope_type, scope_id, reason, intent_fingerprint, coverages, actor, granted_at]
      properties:
        id: {type: string, format: uuid}
        rollout_id: {type: string, format: uuid}
        plan_revision: {type: integer}
        scope_type: {type: string, enum: [environment, project]}
        scope_id: {type: string, format: uuid}
        reason: {type: string}
        intent_fingerprint: {type: string}
        coverages:
          type: array
          items: {$ref: '#/components/schemas/ProgressiveRolloutApprovalCoverage'}
        actor: {type: string, format: uuid}
        granted_at: {type: string, format: date-time}
        revoked_at: {type: string, format: date-time}

    ProgressiveRolloutApprovalCoverage:
      type: object
      required: [environment_id, pin_activation_boundaries]
      properties:
        environment_id: {type: string, format: uuid}
        pin_activation_boundaries:
          type: object
          additionalProperties: {type: string}
          description: Target Module ID to exact latest Pin activation event UUID, or an empty value when none existed.
        consumed_at: {type: string, format: date-time}
        revoked_at: {type: string, format: date-time}
        invalidated_at: {type: string, format: date-time}
        invalidation_reason: {type: string}

    ProgressiveRolloutConflict:
      type: object
      required: [id, rollout_id, plan_revision, environment_id, kind, expected, actual, observed_fingerprint, status, created_at]
      properties:
        id: {type: string, format: uuid}
        rollout_id: {type: string, format: uuid}
        plan_revision: {type: integer}
        environment_id: {type: string, format: uuid}
        module_id: {type: string}
        kind: {type: string}
        expected: {type: object, additionalProperties: true}
        actual: {type: object, additionalProperties: true}
        observed_fingerprint: {type: string}
        status: {type: string, enum: [open, approved, resolved, aborted]}
        resolution: {type: string}
        resolved_by: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        resolved_at: {type: string, format: date-time}

    ProgressiveRolloutConflictResolutionBody:
      type: object
      additionalProperties: false
      required: [plan_revision, observed_fingerprint, expected_resource_version]
      properties:
        plan_revision: {type: integer, minimum: 1}
        observed_fingerprint: {type: string, minLength: 1}
        expected_resource_version: {type: integer, format: int64, minimum: 1}

    ProgressiveRolloutEvent:
      type: object
      required: [sequence, rollout_id, type, payload, created_at]
      properties:
        sequence: {type: integer, format: int64}
        rollout_id: {type: string, format: uuid}
        plan_revision: {type: integer}
        type: {type: string}
        actor: {type: string, format: uuid}
        payload: {type: object, additionalProperties: true}
        created_at: {type: string, format: date-time}

    InternalModuleCatalogue:
      type: object
      description: A collation of all the applicable modules, and providers for an environment. A module is applicable if there is at least one rule for it that matches the requested environment.
      required:
        - modules
        - providers
      properties:
        modules:
          type: array
          items:
            $ref: '#/components/schemas/InternalModuleCatalogueModule'
        providers:
          type: array
          items:
            $ref: '#/components/schemas/ModuleProvider'

    InternalModuleCatalogueModuleRule:
      type: object
      description: A rule within a module
      required:
        - rule_id
        - resource_class
      properties:
        rule_id:
          type: string
          format: uuid
        resource_class:
          $ref: '#/components/schemas/ResourceClass'
        resource_id:
          $ref: '#/components/schemas/ResourceId'
        project_id:
          description: The optional project id that this rule matches.
          type: string
          example: my-app
        env_type_id:
          description: The optional env type id that this rule matches.
          type: string
          example: dev
        env_id:
          description: The optional environment id that this rule matches.
          type: string
          example: my-env

    InternalModuleCatalogueModule:
      type: object
      description: A module within a catalogue
      allOf:
        - $ref: '#/components/schemas/Module'
        - required:
            - rules
            - artifact_digest
            - semantic_status
            - module_uuid
            - version_uuid
            - semantic_version
            - verification_status
          properties:
            rules:
              type: array
              items:
                $ref: '#/components/schemas/InternalModuleCatalogueModuleRule'
            artifact_digest:
              type: string
            semantic_status:
              $ref: '#/components/schemas/ModuleVersionSemanticStatus'
            module_uuid:
              type: string
              format: uuid
            version_uuid:
              type: string
              format: uuid
            semantic_version:
              type: string
              description: Canonical SemVer for managed versions; empty only for migrated v0 versions.
            verification_status:
              $ref: '#/components/schemas/ModuleVerificationStatus'

    InternalModuleCatalogueGenerateBody:
      type: object
      description: The request contents to generate a module catalogue
      properties:
        pinned_module_versions:
          description: The normal response body only includes the latest versions for modules. However if there are pinned resources, we need to request the pinned versions as well which may no longer have rules associated with them.
          type: array
          items:
            description: The module id and version separated by a '@'.
            type: string
            example: my-module@01234567-89ab-cdef-0123-456789abcdef
          x-go-type-skip-optional-pointer: true
        pinned_providers:
          description: The normal response body only includes the latest versions for modules. However if there are pinned resources, we need to request providers retained by the previous graph.
          type: array
          items:
            description: The provider type and id separated by a '.'.
            type: string
            example: aws.default
          x-go-type-skip-optional-pointer: true
        are_rules_ignored:
          description: When running a destroy deployment, only pinned module versions are required and rule evaluation is skipped.
          type: boolean
          example: false
          x-go-type-skip-optional-pointer: true

    ModuleOperationReservation:
      type: object
      required: [id, module_uuid, namespace, operation_id, related_resource_id, reason, resource_version, acquired_by, acquired_at]
      properties:
        id: {type: string, format: uuid}
        module_uuid: {type: string, format: uuid}
        namespace: {type: string, pattern: '^[a-z][a-z0-9.-]*$'}
        operation_id: {type: string, format: uuid}
        related_resource_id: {type: string}
        reason: {type: string}
        resource_version: {type: integer, format: int64, minimum: 1}
        acquired_by: {type: string, format: uuid}
        acquired_at: {type: string, format: date-time}
        released_by: {type: string, format: uuid}
        released_at: {type: string, format: date-time}
        release_reason: {type: string}

    ModuleOperationReservationAcquireBody:
      type: object
      required: [namespace, operation_id, related_resource_id, reason]
      properties:
        namespace: {type: string, pattern: '^[a-z][a-z0-9.-]*$'}
        operation_id: {type: string, format: uuid}
        related_resource_id: {type: string, minLength: 1}
        reason: {type: string, minLength: 1}

    ModuleExtensionContribution:
      type: object
      required: [id, module_uuid, namespace, external_resource_id, kind, lifecycle_state, label, payload, created_by, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        module_uuid: {type: string, format: uuid}
        version_uuid: {type: string, format: uuid}
        environment_uuid: {type: string, format: uuid}
        namespace: {type: string, pattern: '^[a-z][a-z0-9.-]*$'}
        external_resource_id: {type: string}
        kind: {type: string, enum: [related_resource, contextual_action]}
        lifecycle_state: {type: string, enum: [draft, active, terminal]}
        label: {type: string}
        target_url: {type: string}
        payload: {type: object, additionalProperties: true}
        created_by: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    ModuleExtensionContributionUpsertBody:
      type: object
      required: [namespace, external_resource_id, kind, lifecycle_state, label, payload]
      properties:
        version_uuid: {type: string, format: uuid}
        environment_uuid: {type: string, format: uuid}
        namespace: {type: string, pattern: '^[a-z][a-z0-9.-]*$'}
        external_resource_id: {type: string, minLength: 1}
        kind: {type: string, enum: [related_resource, contextual_action]}
        lifecycle_state: {type: string, enum: [draft, active, terminal]}
        label: {type: string, minLength: 1}
        target_url: {type: string}
        payload: {type: object, additionalProperties: true}

    EnvironmentDeletionImpact:
      type: object
      required: [environment_uuid, blocked, blockers, pins, related_resources]
      properties:
        environment_uuid: {type: string, format: uuid}
        blocked: {type: boolean}
        blockers:
          type: array
          items: {type: string}
        pins:
          type: array
          items: {$ref: '#/components/schemas/EnvironmentModuleVersionPin'}
        related_resources:
          type: array
          items: {$ref: '#/components/schemas/ModuleExtensionContribution'}
