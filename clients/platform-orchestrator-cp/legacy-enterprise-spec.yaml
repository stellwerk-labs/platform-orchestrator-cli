components:
  securitySchemes:
    userIdHeader:
      type: apiKey
      in: header
      name: From
  parameters:
    orgIdPathParam:
      name: orgId
      in: path
      description: The Organization ID
      example: 'sample-org'
      required: true
      schema:
        type: string
    rolloutIdPathParam:
      name: rolloutId
      in: path
      description: Progressive Rollout UUID.
      required: true
      schema: {type: string, format: uuid}
    deploymentIdPathParam:
      name: deploymentId
      in: path
      description: Deployment UUID belonging to the Rollout.
      required: true
      schema: {type: string, format: uuid}
    planRevisionPathParam:
      name: planRevision
      in: path
      description: Immutable numbered plan revision.
      required: true
      schema: {type: integer, minimum: 1}
    idempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable caller-generated key used to deduplicate command retries.
      schema: {type: string, minLength: 8, maxLength: 200}
    projectIdPathParam:
      name: projectId
      in: path
      description: The Project ID
      example: 'sample-project'
      required: true
      schema:
        type: string
    projectUuidPathParam:
      name: projectUuid
      in: path
      description: The Project UUID
      example: '01234567-89ab-cdef-0123-456789abcdef'
      required: true
      schema:
        type: string
        format: uuid
    envIdPathParam:
      name: envId
      in: path
      description: The Environment ID
      example: 'sample-env'
      required: true
      schema:
        type: string
    envUuidPathParam:
      name: envUuid
      in: path
      description: The Environment UUID
      example: '01234567-89ab-cdef-0123-456789abcdef'
      required: true
      schema:
        type: string
        format: uuid
    envTypeIdPathParam:
      name: envTypeId
      in: path
      description: The Environment Type ID
      example: 'development'
      required: true
      schema:
        type: string
    resourceTypeIdPathParam:
      name: typeId
      in: path
      description: The Resource Type
      example: 's3'
      required: true
      schema:
        type: string
    providerIdPathParam:
      name: providerId
      in: path
      description: The Module Provider ID
      example: 'my-aws-provider'
      required: true
      schema:
        type: string
    providerTypePathParam:
      name: providerType
      in: path
      description: The Module Provider Type
      example: 'aws'
      required: true
      schema:
        type: string
    moduleIdPathParam:
      name: moduleId
      in: path
      description: A Module ID
      example: 'my-s3-module'
      required: true
      schema:
        type: string
    moduleVersionIdPathParam:
      name: moduleVersionId
      in: path
      description: A Module Version ID
      example: 2.4.0
      required: true
      schema:
        type: string
    ruleIdPathParam:
      name: ruleId
      in: path
      description: A Module Rule ID
      example: 01234567-89ab-cdef-0123-456789abcdef
      required: true
      schema:
        type: string
        format: uuid
    runnerIdPathParam:
      name: runnerId
      in: path
      description: A Runner ID
      example: my-k8s-runner
      required: true
      schema:
        type: string
    perPageQueryParam:
      name: per_page
      in: query
      description: The maximum number of items to return in a page of results
      required: false
      example: 50
      schema:
        type: integer
    pageTokenQueryParam:
      name: page
      in: query
      description: The page token to request from
      required: false
      example: 'AAAAAAAAAA=='
      schema:
        type: string
    dryRunQueryParam:
      name: dry_run
      in: query
      description: If true, the request will not make any changes to the system, but will return what would have been done.
      required: false
      schema:
        type: boolean
        default: false
    resourceTypeIdQueryParam:
      name: type_id
      in: query
      description: Filter by resource type id.
      example: 's3'
      schema:
        type: string
      required: false
    includeNonDeveloperAccessibleQueryParam:
      name: include_non_developer_accessible
      in: query
      description: If true, the list will include resources that are not accessible to developers.
      required: false
      schema:
        type: boolean
        default: false
    forceQueryParam:
      name: force
      in: query
      description: If true, will perform force deletion, without destroying underlying infrastructure.
      required: false
      schema:
        type: boolean
        default: false

  responses:
    400BadRequest:
      description: The request was invalid. More detail can be found in the error body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    401Unauthorized:
      description: The client didn't provide valid authentication credentials.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    403Forbidden:
      description: Server understands the request but refuses to authorize it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    404NotFound:
      description: The request was valid, but the target resource or relation does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    409Conflict:
      description: The request conflicts with existing state in the system.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    PluginAvailabilityState:
      type: string
      enum: [available, not_installed, not_enabled, not_entitled, incompatible, unavailable]
      x-enum-varnames: [PluginAvailabilityStateAvailable, PluginAvailabilityStateNotInstalled, PluginAvailabilityStateNotEnabled, PluginAvailabilityStateNotEntitled, PluginAvailabilityStateIncompatible, PluginAvailabilityStateUnavailable]

    PluginCapability:
      type: object
      required: [id, display_name, state, capabilities]
      properties:
        id: {type: string, description: Immutable reverse-DNS plugin identity.}
        display_name: {type: string}
        version: {type: string, description: Immutable installed plugin artifact version when installed.}
        state: {$ref: '#/components/schemas/PluginAvailabilityState'}
        capabilities:
          type: array
          items: {type: string}
        admin_action: {type: string, description: Scope-safe remediation guidance for an administrator.}

    Error:
      description: A standard error response
      properties:
        error:
          description: |
            A short code representing the class of error. This code can be used for tracking and observability or to
            find appropriate troubleshooting documentation.
          type: string
          example: API-000
        message:
          description: A human-readable explanation of the error.
          type: string
          example: 'Something happened!'
        details:
          description: An optional payload of metadata associated with the error.
          additionalProperties: true
          type: object
      required:
        - error
        - message
      type: object

    Organization:
      type: object
      description: The internal state of an organization known by the control plane.
      required:
        - id
        - uuid
        - created_at
        - created_by
        - plan
        - status
      properties:
        id:
          description: The unique identifier of the org
          example: my-org123
          type: string
        uuid:
          description: Unique uid for the org to identify a unique lifecycle
          example: 00000000-0000-0000-0000-000000000000
          type: string
          format: uuid
        created_at:
          description: The date and time when the org state was created.
          example: '2023-01-01T00:00:00Z'
          type: string
          format: date-time
        created_by:
          description: The user id that created the org for the first time.
          example: 00000000-0000-0000-0000-000000000000
          type: string
          format: uuid
        updated_at:
          description: The date and time when the org was last updated.
          example: '2023-01-01T00:00:00Z'
          type: string
          format: date-time
        status:
          description: The current status of the org.
          type: string
          enum:
            - active
            - deleting
            - delete_failed
            - deleted
          example: active
        plan:
          description: The plan of the org.
          example: custom
          type: string

    InternalOrganization:
      allOf:
        - $ref: '#/components/schemas/Organization'
        - properties:
            source:
              description: The source of the org state. This is used to identify the source of the org state, such as a git repository.
              type: string
              enum:
                - internal
                - public
              default: internal
              example: internal
          required:
            - source

    InternalOrganizationPage:
      type: object
      description: A page of organization state returned from the list api.
      required:
        - items
      properties:
        items:
          type: array
          description: The items in this page
          items:
            $ref: '#/components/schemas/InternalOrganization'
        next_page_token:
          type: string
          description: The page token to use to request the next page of items

    InternalOrganizationCreateBody:
      type: object
      description: A request to create a new organization state in the control plane.
      properties:
        id:
          description: The unique identifier of the org. It will be auto-generated if not provided.
          type: string
          example: my-org123
          minLength: 2
          maxLength: 50
          pattern: ^[a-z](?:-?[a-z0-9]+)+$
          x-pattern-error: id must be lowercase alphanumeric including hyphens
        id_prefix:
          description: An id prefix for the org. If will be a prefix to the auto-generated id.
          type: string
          example: workshop-
          minLength: 1
          maxLength: 15
