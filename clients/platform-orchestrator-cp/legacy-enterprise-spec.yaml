openapi: 3.0.0

info:
  title: ''
  version: ''

paths:

  /orgs/{orgId}/plugins/{pluginId}:
    get:
      operationId: getPluginCapability
      summary: Discover an installed plugin and its availability for this organization.
      tags: [Plugin]
      security: [{userIdHeader: []}]
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - name: pluginId
          in: path
          required: true
          description: Immutable, reverse-DNS plugin identity.
          schema: {type: string, pattern: '^[a-z0-9]+(?:[.-][a-z0-9]+)+$'}
      responses:
        '200':
          description: The plugin capability state. An unknown plugin is represented as not_installed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginCapability'}
        '403': {$ref: '#/components/responses/403Forbidden'}
        '404': {$ref: '#/components/responses/404NotFound'}
  /internal/orgs:
    get:
      operationId: listInternalOrganizations
      tags:
        - Organizations
        - internal
      summary: List internal state for Organizations
      security:
        - userIdHeader: []
      parameters:
        - $ref: '#/components/parameters/perPageQueryParam'
        - $ref: '#/components/parameters/pageTokenQueryParam'
      responses:
        '200':
          description: Successful list response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalOrganizationPage'
    post:
      operationId: createInternalOrganization
      tags:
        - Organizations
        - internal
      summary: Create the internal state for an Organization
      security:
        - userIdHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalOrganizationCreateBody'
      responses:
        '201':
          description: Successful create response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalOrganization'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '409':
          $ref: '#/components/responses/409Conflict'

  /internal/orgs/{orgId}:
    get:
      operationId: getInternalOrganization
      tags:
        - Organizations
        - internal
      summary: Get internal state for Organization
      security:
        - userIdHeader: []
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
      responses:
        '200':
          description: Successful get response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalOrganization'
        '404':
          $ref: '#/components/responses/404NotFound'

  /internal/orgs/{orgId}/projects/{projectUuid}:
    get:
      operationId: getInternalProjectByUuid
      tags:
        - Project
        - internal
      summary: Get a Project by UUID
      security:
        - userIdHeader: []
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - $ref: '#/components/parameters/projectUuidPathParam'
      responses:
        '200':
          description: Successful get response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          $ref: '#/components/responses/404NotFound'

  /internal/orgs/{orgId}/projects/{projectUuid}/envs:
    get:
      operationId: listInternalEnvironmentsByProjectUuid
      tags:
        - Environment
        - internal
      summary: Get the list of Environments by Project UUID
      security:
        - userIdHeader: []
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - $ref: '#/components/parameters/projectUuidPathParam'
        - $ref: '#/components/parameters/perPageQueryParam'
        - $ref: '#/components/parameters/pageTokenQueryParam'
      responses:
        '200':
          description: Successful get response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentPage'
        '404':
          $ref: '#/components/responses/404NotFound'

  /internal/orgs/{orgId}/envs/{envUuid}:
    get:
      operationId: getInternalEnvironmentByUuid
      tags:
        - Environment
        - internal
      summary: Get an Environment by UUID
      security:
        - userIdHeader: []
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - $ref: '#/components/parameters/envUuidPathParam'
      responses:
        '200':
          description: Successful get response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
        '404':
          $ref: '#/components/responses/404NotFound'

  /internal/resource-types:
    get:
      operationId: internalListResourceTypes
      summary: List built-in resource types
      tags:
        - ResourceType
        - internal
      security:
        - userIdHeader: []
      parameters:
        - $ref: '#/components/parameters/perPageQueryParam'
        - $ref: '#/components/parameters/pageTokenQueryParam'
      responses:
        '200':
          description: Successful list response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceTypePage'
    post:
      operationId: internalCreateResourceType
      summary: Create a new built-in resource type
      tags:
        - ResourceType
        - internal
      security:
        - userIdHeader: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceTypeCreateBody'
      responses:
        '201':
          description: Successful create response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceType'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '409':
          $ref: '#/components/responses/409Conflict'
  /internal/resource-types/{typeId}:
    delete:
      operationId: internalDeleteResourceType
      summary: Delete a built-in resource type
      tags:
        - ResourceType
        - internal
      security:
        - userIdHeader: []
      parameters:
        - $ref: '#/components/parameters/resourceTypeIdPathParam'
      responses:
        '204':
          description: Successful delete response.
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409Conflict'
    patch:
      operationId: internalUpdateResourceType
      summary: Reject mutation of an immutable built-in resource type contract
      tags:
        - ResourceType
        - internal
      security:
        - userIdHeader: []
      parameters:
        - $ref: '#/components/parameters/resourceTypeIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceTypeUpdateBody'
      responses:
        '200':
          description: Successful update response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceType'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409Conflict'

  /internal/orgs/{orgId}/runners/{runnerId}:
    get:
      operationId: getInternalRunner
      tags:
        - Runner
        - internal
      summary: Get runner in the org with secret configuration as secret path
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - $ref: '#/components/parameters/runnerIdPathParam'
      responses:
        '200':
          description: Successful get response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalRunner'
        '404':
          $ref: '#/components/responses/404NotFound'

  /orgs:
    post:
      operationId: createOrganization
      summary: Create a new organization with a random name and suffix.
      tags:
        - Organization
      security:
        - userIdHeader: []
      responses:
        '201':
          description: Successful create response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '409':
          $ref: '#/components/responses/409Conflict'

  /orgs/{orgId}:
    get:
      operationId: getOrganization
      summary: Get the details of the identified organization.
      tags:
        - Organization
      security:
        - userIdHeader: []
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
      responses:
        '200':
          description: Successful list response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '404':
          $ref: '#/components/responses/404NotFound'

  /orgs/{orgId}/env-types:
    get:
      operationId: listEnvironmentTypes
      summary: List environment types in the organization
      tags:
        - EnvironmentType
      security:
        - userIdHeader: []
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - $ref: '#/components/parameters/perPageQueryParam'
        - $ref: '#/components/parameters/pageTokenQueryParam'
      responses:
        '200':
          description: Successful list response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentTypePage'
        '404':
          $ref: '#/components/responses/404NotFound'
    post:
      operationId: createEnvironmentType
      summary: Create a new environment type in the organization
      tags:
        - EnvironmentType
      security:
        - userIdHeader: []
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvironmentTypeCreateBody'
      responses:
        '201':
          description: Successful create response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentType'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '409':
          $ref: '#/components/responses/409Conflict'
  /orgs/{orgId}/env-types/{envTypeId}:
    get:
      operationId: getEnvironmentType
      summary: Get an environment type in the org
      tags:
        - EnvironmentType
      security:
        - userIdHeader: []
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - $ref: '#/components/parameters/envTypeIdPathParam'
      responses:
        '200':
          description: Successful get response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentType'
        '404':
          $ref: '#/components/responses/404NotFound'
    delete:
      operationId: deleteEnvironmentType
      summary: Delete an environment type
      tags:
        - EnvironmentType
      security:
        - userIdHeader: []
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - $ref: '#/components/parameters/envTypeIdPathParam'
      responses:
        '204':
          description: Successful delete response.
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409Conflict'
    patch:
      operationId: updateEnvironmentType
      summary: Update an environment type in the org
      tags:
        - EnvironmentType
      security:
        - userIdHeader: []
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - $ref: '#/components/parameters/envTypeIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvironmentTypeUpdateBody'
      responses:
        '200':
          description: Successful update response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentType'
        '404':
          $ref: '#/components/responses/404NotFound'

  /orgs/{orgId}/projects:
    get:
      operationId: listProjects
      summary: List projects
      tags:
        - Project
      security:
        - userIdHeader: []
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - $ref: '#/components/parameters/perPageQueryParam'
        - $ref: '#/components/parameters/pageTokenQueryParam'
      responses:
        '200':
          description: Successful list response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'
        '404':
          $ref: '#/components/responses/404NotFound'
    post:
      operationId: createProject
      summary: Create a new project
      tags:
        - Project
      security:
        - userIdHeader: []
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateBody'
      responses:
        '201':
          description: Successful create response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '409':
          $ref: '#/components/responses/409Conflict'
  /orgs/{orgId}/projects/{projectId}:
    delete:
      operationId: deleteProject
      summary: Delete an project
      tags:
        - Project
      security:
        - userIdHeader: []
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - $ref: '#/components/parameters/projectIdPathParam'
        - name: deleteRules
          in: query
          description: Whether to delete all rules associated with the project
          schema:
            type: boolean
          required: false

      responses:
        '204':
          description: The project is fully deleted.
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409Conflict'
    get:
      operationId: getProject
      summary: Get an project
      tags:
        - Project
      security:
        - userIdHeader: []
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - $ref: '#/components/parameters/projectIdPathParam'
      responses:
        '200':
          description: Successful get response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          $ref: '#/components/responses/404NotFound'
    patch:
      operationId: updateProject
      summary: Update a project
      tags:
        - Project
      security:
        - userIdHeader: []
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - $ref: '#/components/parameters/projectIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdateBody'
      responses:
        '200':
          description: Successful update response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          $ref: '#/components/responses/404NotFound'
  /orgs/{orgId}/projects/{projectId}/envs:
    get:
      operationId: listEnvironments
      summary: List environments in an project
      tags:
        - Environment
      security:
        - userIdHeader: []
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - $ref: '#/components/parameters/projectIdPathParam'
        - $ref: '#/components/parameters/perPageQueryParam'
        - $ref: '#/components/parameters/pageTokenQueryParam'
        - name: byEnvTypeId
          in: query
          description: Filter the list by environment types
          schema:
            type: array
            items:
              type: string
          example: development
          required: false
      responses:
        '200':
          description: Successful list response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentPage'
        '404':
          $ref: '#/components/responses/404NotFound'
    post:
      operationId: createEnvironment
      summary: Create a new project environment
      tags:
        - Environment
      security:
        - userIdHeader: []
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - $ref: '#/components/parameters/projectIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvironmentCreateBody'
      responses:
        '201':
          description: Successful create response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '409':
          $ref: '#/components/responses/409Conflict'

  /orgs/{orgId}/projects/{projectId}/envs/{envId}:
    delete:
      operationId: deleteEnvironment
      summary: Delete a project environment.
      description: Delete an active project environment by issuing a destroy deployment. If the destroy fails, the environment will show status 'destroy_failed' and a new delete request can be made to try again.
      tags:
        - Environment
      security:
        - userIdHeader: []
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - $ref: '#/components/parameters/projectIdPathParam'
        - $ref: '#/components/parameters/envIdPathParam'
        - $ref: '#/components/parameters/forceQueryParam'
        - name: deleteRules
          in: query
          description: Whether to delete all rules associated with the environment
          schema:
            type: boolean
          required: false
      responses:
        '202':
          description: The environment is waiting for a destroy deployment to succeed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
        '204':
          description: The environment could be deleted without waiting for a destroy deployment.
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409Conflict'
    get:
      operationId: getEnvironment
      summary: Get a project environment
      tags:
        - Environment
      security:
        - userIdHeader: []
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - $ref: '#/components/parameters/projectIdPathParam'
        - $ref: '#/components/parameters/envIdPathParam'
      responses:
        '200':
          description: Successful get response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
        '404':
          $ref: '#/components/responses/404NotFound'
    patch:
      operationId: updateEnvironment
      summary: Update a project environment
      tags:
        - Environment
      security:
        - userIdHeader: []
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - $ref: '#/components/parameters/projectIdPathParam'
        - $ref: '#/components/parameters/envIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvironmentUpdateBody'
      responses:
        '200':
          description: Successful update response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
        '404':
          $ref: '#/components/responses/404NotFound'

  /orgs/{orgId}/projects/{projectId}/envs/{envId}/deletion-impact:
    get:
      operationId: getEnvironmentDeletionImpact
      summary: Preview retained Module Pins and add-on resources affected by Environment deletion.
      tags:
        - Environment
      security:
        - userIdHeader: []
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - $ref: '#/components/parameters/projectIdPathParam'
        - $ref: '#/components/parameters/envIdPathParam'
      responses:
        '200':
          description: Exact current deletion impact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentDeletionImpact'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'

  /orgs/{orgId}/envs:
    get:
      operationId: listEnvironmentsInOrg
      summary: List environments in an organization
      tags:
        - Environment
      security:
        - userIdHeader: []
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - $ref: '#/components/parameters/perPageQueryParam'
        - $ref: '#/components/parameters/pageTokenQueryParam'
        - name: byEnvTypeId
          in: query
          description: Filter the list by environment types
          schema:
            type: array
            items:
              type: string
          example: development
          required: false
      responses:
        '200':
          description: Successful list response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentPage'
        '404':
          $ref: '#/components/responses/404NotFound'

  /internal/orgs/{orgId}/projects/{projectId}/envs/{envId}/actions/force-delete:
    post:
      operationId: internalForceDeleteEnvironment
      summary: Force delete the environment without a successful destroy deployment.
      description: |
        This is an escape hatch that may be used by privileged users to destroy an environment that cannot be fully destroyed or is facing errors that cannot be worked around.
        This may leave infrastructure or state behind that must be cleaned up manually outside of the Orchestrator.
      tags:
        - internal
        - Environment
      security:
        - userIdHeader: []
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - $ref: '#/components/parameters/projectIdPathParam'
        - $ref: '#/components/parameters/envIdPathParam'
        - name: deleteRules
          in: query
          description: Whether to delete all rules associated with the environment
          schema:
            type: boolean
          required: false
      responses:
        '204':
          description: The environment was deleted.
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409Conflict'

  /internal/orgs/{orgId}/projects/{projectId}/envs/{envId}:
    patch:
      operationId: internalUpdateEnvironment
      summary: An internal API for updating fields on an environment
      tags:
        - Environment
        - internal
      security:
        - userIdHeader: []
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - $ref: '#/components/parameters/projectIdPathParam'
        - $ref: '#/components/parameters/envIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvironmentInternalUpdateBody'
      responses:
        '200':
          description: The update was accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409Conflict'

  /orgs/{orgId}/projects/{projectId}/envs/{envId}/actions/refresh_runner:
    post:
      operationId: updateRunnerInAnEnvironment
      summary: Refresh the runner for a project environment. If this runs with dryRun=true, it will not update the runner, but return the id of the runner that would be set.
      tags:
        - Environment
      security:
        - userIdHeader: []
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - $ref: '#/components/parameters/projectIdPathParam'
        - $ref: '#/components/parameters/envIdPathParam'
        - $ref: '#/components/parameters/dryRunQueryParam'
      responses:
        '200':
          description: The id of the runner that would be or was set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshRunnerActionResult'

        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409Conflict'

  /orgs/{orgId}/projects/{projectId}/envs/{envId}/available-resource-types:
    get:
      operationId: listAvailableResourceTypes
      summary: List available resource types for an environment in project
      tags:
        - ResourceType
      security:
        - userIdHeader: []
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - $ref: '#/components/parameters/projectIdPathParam'
        - $ref: '#/components/parameters/envIdPathParam'
        - $ref: '#/components/parameters/perPageQueryParam'
        - $ref: '#/components/parameters/pageTokenQueryParam'
        - $ref: '#/components/parameters/resourceTypeIdQueryParam'
        - $ref: '#/components/parameters/includeNonDeveloperAccessibleQueryParam'
      responses:
        '200':
          description: Successful list response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableResourceTypePage'
        '404':
          $ref: '#/components/responses/404NotFound'
  /orgs/{orgId}/resource-types:
    get:
      operationId: listResourceTypes
      summary: List available resource types
      tags:
        - ResourceType
      security:
        - userIdHeader: []
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - $ref: '#/components/parameters/perPageQueryParam'
        - $ref: '#/components/parameters/pageTokenQueryParam'
      responses:
        '200':
          description: Successful list response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceTypePage'
        '404':
          $ref: '#/components/responses/404NotFound'
    post:
      operationId: createResourceType
      summary: Create a new resource type
      tags:
        - ResourceType
      security:
        - userIdHeader: []
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceTypeCreateBody'
      responses:
        '201':
          description: Successful create response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceType'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '409':
          $ref: '#/components/responses/409Conflict'
  /orgs/{orgId}/resource-types/{typeId}:
    delete:
      operationId: deleteResourceType
      summary: Delete a resource type
      tags:
