          items:
            $ref: '#/components/schemas/RunnerSummary'
        next_page_token:
          type: string
          description: The page token to use to request the next page of items.

    RunnerSummary:
      type: object
      description: A summary of configuration a runner.
      required:
        - org_id
        - id
        - created_at
        - updated_at
      properties:
        org_id:
          description: The Organization ID.
          type: string
          example: my-org
        id:
          description: The unique identifier for the runner under the organization.
          type: string
          example: my-k8s-runner
        description:
          description: An optional text description for this runner.
          type: string
          example: Runner to execute Terraform in our production cluster
        created_at:
          description: The date and time when the runner was created.
          example: '2023-01-01T00:00:00Z'
          type: string
          format: date-time
        updated_at:
          description: The date and time when the runner was updated.
          example: '2023-01-01T00:00:00Z'
          type: string
          format: date-time
        runner_configuration:
          $ref: '#/components/schemas/RunnerConfigurationSummary'
        state_storage_configuration:
          $ref: '#/components/schemas/StateStorageConfigurationSummary'

    Runner:
      type: object
      description: A summary of configuration a runner.
      allOf:
        - $ref: '#/components/schemas/RunnerSummary'
        - required:
            - org_id
            - id
            - runner_configuration
            - state_storage_configuration
            - created_at
          properties:
            runner_configuration:
              $ref: '#/components/schemas/RunnerConfiguration'
            state_storage_configuration:
              $ref: '#/components/schemas/StateStorageConfiguration'

    RunnerConfiguration:
      description: The data needed to configure the runner.
      oneOf:
        - $ref: '#/components/schemas/K8sRunnerConfiguration'
        - $ref: '#/components/schemas/K8sGkeRunnerConfiguration'
        - $ref: '#/components/schemas/K8sEksRunnerConfiguration'
        - $ref: '#/components/schemas/K8sAgentRunnerConfiguration'
        - $ref: '#/components/schemas/ServerlessEcsRunnerConfiguration'
      discriminator:
        propertyName: type
        mapping:
          kubernetes: '#/components/schemas/K8sRunnerConfiguration'
          kubernetes-gke: '#/components/schemas/K8sGkeRunnerConfiguration'
          kubernetes-eks: '#/components/schemas/K8sEksRunnerConfiguration'
          kubernetes-agent: '#/components/schemas/K8sAgentRunnerConfiguration'
          serverless-ecs: '#/components/schemas/ServerlessEcsRunnerConfiguration'

    RunnerConfigurationUpdate:
      description: The data needed to update the runner configuration.
      oneOf:
        - $ref: '#/components/schemas/K8sRunnerConfigurationUpdateBody'
        - $ref: '#/components/schemas/K8sGkeRunnerConfigurationUpdateBody'
        - $ref: '#/components/schemas/K8sEksRunnerConfigurationUpdateBody'
        - $ref: '#/components/schemas/K8sAgentRunnerConfigurationUpdateBody'
        - $ref: '#/components/schemas/ServerlessEcsRunnerConfigurationUpdateBody'
      discriminator:
        propertyName: type
        mapping:
          kubernetes: '#/components/schemas/K8sRunnerConfigurationUpdateBody'
          kubernetes-gke: '#/components/schemas/K8sGkeRunnerConfigurationUpdateBody'
          kubernetes-eks: '#/components/schemas/K8sEksRunnerConfigurationUpdateBody'
          kubernetes-agent: '#/components/schemas/K8sAgentRunnerConfigurationUpdateBody'
          serverless-ecs: '#/components/schemas/ServerlessEcsRunnerConfigurationUpdateBody'

    InternalRunner:
      type: object
      description: A summary of configuration a runner.
      allOf:
        - $ref: '#/components/schemas/Runner'
        - properties:
            runner_configuration_secret:
              $ref: '#/components/schemas/ConfigurationSecret'

    ConfigurationSecret:
      type: object
      description: Secret path and version of a secret stored in the internal store.
      x-go-type-skip-optional-pointer: true
      properties:
        path:
          type: string
          example: /orgs/test-org/runners/default
          description: Path where the secret is stored
        version:
          type: integer
          example: 2
          description: The version of the secret
      required:
        - path
        - version

    K8sRunnerJobConfig:
      description: Properties of the Kubernetes Runner Job.
      type: object
      properties:
        namespace:
          type: string
          description: Namespace where the Job runs.
        service_account:
          type: string
          description: Service Account the Job runs with.
        pod_template:
          description: |
            The Pod Template Spec manifest which defines the runner job pod in the target cluster. It will be merged with the default Job Pod Template Spec.
          type: object
          additionalProperties: true
      required:
        - namespace
        - service_account

    K8sRunnerGkeCluster:
      description: Configuration to access a GKE cluster.
      type: object
      properties:
        name:
          description: Name of the cluster.
          type: string
        project_id:
          title: GCP Project ID.
          type: string
        proxy_url:
          description: Cluster Proxy URL.
          type: string
        location:
          description: GCP cluster Location.
          type: string
        internal_ip:
          description: Uses the private endpoint address of the cluster if the private endpoint is enabled.
          default: false
          type: boolean
        auth:
          $ref: '#/components/schemas/K8sRunnerGcpTemporaryAuth'
      required:
        - name
        - project_id
        - location
        - auth

    K8sRunnerGcpTemporaryAuth:
      description: Configuration to obtain temporary access token to access a GKE cluster.
      x-go-type-skip-optional-pointer: true
      type: object
      properties:
        gcp_audience:
          type: string
          description: The URL of the workload identity pool provider used as an audience for OIDC token.
        gcp_service_account:
          type: string
          description: The Google service account to impersonate.
      required:
        - gcp_audience
        - gcp_service_account

    K8sRunnerEksCluster:
      description: Configuration to access an EKS cluster.
      type: object
      properties:
        name:
          description: Name of the EKS cluster.
          type: string
        region:
          description: AWS region where the EKS cluster is located.
          type: string
        auth:
          $ref: '#/components/schemas/AwsTemporaryAuth'
      required:
        - name
        - region
        - auth

    AwsTemporaryAuth:
      description: Configuration to obtain temporary AWS security credentials by assuming an IAM role.
      type: object
      properties:
        role_arn:
          description: The ARN of the role to assume.
          type: string
          pattern: ^arn:aws:iam::[0-9]{12}:role\/[a-zA-Z_0-9+=,.@\-_/]+$
          x-pattern-error: role_arn is not a valid IAM Role ARN
        session_name:
          description: (Optional) Session name to be used when assuming the role. If not provided, a default session name will be "{org_id}-{runner_id}".
          type: string
          pattern: ^[a-zA-Z0-9+=,.@\-_/]+$
          minLength: 3
          maxLength: 64
          x-pattern-error: session_name must contain only valid characters (letters, digits, and +=,.@-_/)
        sts_region:
          description: (Optional) The AWS region identifier for the Security Token Service (STS) endpoint. If not provided, the cluster region will be used.
          type: string
          pattern: ^[a-z]{2}-[a-z]+-\d$
          x-pattern-error: sts_region is not a valid AWS STS region
      required:
        - role_arn

    K8sRunnerK8sCluster:
      description: Configuration to obtain access token to a generic K8s cluster with auth
      type: object
      properties:
        cluster_data:
          $ref: '#/components/schemas/K8sRunnerK8sClusterClusterData'
        auth:
          $ref: '#/components/schemas/K8sRunnerK8sClusterAuth'
      required:
        - cluster_data
        - auth

    K8sRunnerK8sClusterAuth:
      x-go-type-skip-optional-pointer: true
      description: Configuration to obtain access to a k8s cluster.
      type: object
      properties:
        client_certificate_data:
          description: 'Kubeconfig Field: user.client-certificate-data'
          type: string
        client_key_data:
          description: 'Kubeconfig Field: user.client-key-data'
          type: string
        service_account_token:
          description: Service account token.
          type: string

    K8sRunnerK8sClusterClusterData:
      description: Cluster data to access Kubernetes cluster.
      type: object
      x-go-type-skip-optional-pointer: true
      properties:
        certificate_authority_data:
          description: 'Kubeconfig Field: cluster.certificate-authority-data'
          type: string
        proxy_url:
          description: 'Kubeconfig Field: cluster.proxy-url'
          type: string
        server:
          description: 'Kubeconfig Field: cluster.server'
          type: string
      required:
        - certificate_authority_data
        - server

    K8sAgentRunnerKey:
      description: A public ed25519 key in PEM format. The caller must hold the matching private key.
      type: string
      example: |
        -----BEGIN PUBLIC KEY-----
        MCowBQYDK2VwAyEAc5dgCx4ano39JT0XgTsHnts3jej+5xl7ZAwSIrKpef0=
        -----END PUBLIC KEY-----
      pattern: ^-----BEGIN PUBLIC KEY-----\n[^\n]+\n-----END PUBLIC KEY-----(\n)?$
      x-pattern-error: 'key: does not look like an ed25519 public key in PEM format'
      minLength: 1
      maxLength: 200

    StateStorageConfiguration:
      description: Configuration for the Terraform Backend used by the runner.
      oneOf:
        - $ref: '#/components/schemas/K8sStorageConfiguration'
        - $ref: '#/components/schemas/S3StorageConfiguration'
        - $ref: '#/components/schemas/GCSStorageConfiguration'
        - $ref: '#/components/schemas/AzureRMStorageConfiguration'
      discriminator:
        propertyName: type
        mapping:
          kubernetes: '#/components/schemas/K8sStorageConfiguration'
          s3: '#/components/schemas/S3StorageConfiguration'
          gcs: '#/components/schemas/GCSStorageConfiguration'
          azurerm: '#/components/schemas/AzureRMStorageConfiguration'

    StateStorageConfigurationSummary:
      description: Summary of the state storage configuration.
      properties:
        type:
          $ref: '#/components/schemas/StateStorageType'
      required:
        - type

    K8sStorageConfiguration:
      description: Configuration to use the Kubernetes Backend as backend of this runner. The in-cluster mode is used.
      type: object
      properties:
        namespace:
          description: Where the secrets with the state should be created.
          type: string
        type:
          $ref: '#/components/schemas/StateStorageType'
      required:
        - namespace
        - type

    S3StorageConfiguration:
      description: |-
        Configuration to use an AWS S3 bucket as state storage backend of this runner. Authentication and other settings
        can be set via environment variables and defaults. See <https://developer.hashicorp.com/terraform/language/backend/s3#state-storage>
        for more details.
      type: object
      properties:
        type:
          $ref: '#/components/schemas/StateStorageType'
        bucket:
          type: string
          description: Name of the S3 Bucket.
          pattern: ^[a-z0-9][a-z0-9\-]*[a-z0-9]$
          x-pattern-error: state storage bucket is not a valid S3 Bucket name.
          example: example-bucket
        path_prefix:
          type: string
          description: A prefix path for the state file. The environment uuid will be used as a unique key within this.
          pattern: ^[a-zA-Z0-9._-]+(?:\/[a-zA-Z0-9._-]+)*\/?$
          x-pattern-error: state storage path_prefix is not a valid S3 prefix path.
          example: path/to/state/directory
      required:
        - type
        - bucket

    GCSStorageConfiguration:
      description: |-
        Configuration to use a Google Cloud Storage (GCS) bucket as state storage backend of this runner. Authentication and other settings
        can be set via environment variables and defaults. See <https://developer.hashicorp.com/terraform/language/backend/gcs#state-storage>
        for more details.
      type: object
      properties:
        type:
          $ref: '#/components/schemas/StateStorageType'
        bucket:
          type: string
          description: Name of the GCS Bucket.
          pattern: ^[a-z0-9][a-z0-9\-]*[a-z0-9]$
          x-pattern-error: state storage bucket is not a valid GCS Bucket name.
          example: example-bucket
        path_prefix:
          type: string
          description: A prefix path for the state file. The environment uuid will be used as a unique key within this.
          pattern: ^[a-zA-Z0-9._-]+(?:\/[a-zA-Z0-9._-]+)*\/?$
          x-pattern-error: state storage path_prefix is not a valid GCS prefix path.
          example: path/to/state/directory
      required:
        - type
        - bucket

    AzureRMStorageConfiguration:
      description: |-
        Configuration to use an AzureRM Storage Account as state storage backend of this runner. Authentication and other settings
        can be set via environment variables and defaults. See <https://developer.hashicorp.com/terraform/language/backend/azurerm#state-storage>
        for more details.
      type: object
      properties:
        type:
          $ref: '#/components/schemas/StateStorageType'
        resource_group_name:
          type: string
          description: Name of the Azure Resource Group.
          example: rg-terraform-state
        storage_account_name:
          type: string
          description: Name of the Azure Storage Account.
          example: sttfstatepro001
        container_name:
          type: string
          description: Name of the Azure Storage Container.
          example: tfstates
        path_prefix:
          type: string
          description: A prefix path for the state file. The environment uuid will be used as a unique key within this.
          pattern: ^[a-zA-Z0-9._-]+(?:\/[a-zA-Z0-9._-]+)*\/?$
          x-pattern-error: state storage path_prefix is not a valid AzureRM path.
          example: path/to/state/directory
      required:
        - type
        - storage_account_name
        - container_name

    RunnerCreateBody:
      type: object
      description: A request to create a new runner.
      required:
        - id
        - runner_configuration
        - state_storage_configuration
      properties:
        id:
          description: The unique identifier for the runner under the organization.
          type: string
          example: my-k8s-runner
          pattern: ^[a-z][a-z0-9_-]+$
          x-pattern-error: id must be a valid identifier
        description:
          description: An optional text description for this runner.
          type: string
          example: Runner to execute Terraform in our production cluster
        runner_configuration:
          $ref: '#/components/schemas/RunnerConfiguration'
        state_storage_configuration:
          $ref: '#/components/schemas/StateStorageConfiguration'

    RunnerConfigurationSummary:
      description: A summary of the runner configuration.
      type: object
      properties:
        type:
          $ref: '#/components/schemas/RunnerType'
      required:
        - type

    K8sRunnerConfiguration:
      description: Runner configuration for a Kubernetes cluster.
      type: object
      properties:
        type:
          $ref: '#/components/schemas/RunnerType'
        job:
          $ref: '#/components/schemas/K8sRunnerJobConfig'
        cluster:
          $ref: '#/components/schemas/K8sRunnerK8sCluster'
      required:
        - type
        - job
        - cluster

    K8sGkeRunnerConfiguration:
      description: Runner configuration for a GKE cluster.
      type: object
      properties:
        type:
          $ref: '#/components/schemas/RunnerType'
        job:
          $ref: '#/components/schemas/K8sRunnerJobConfig'
        cluster:
          $ref: '#/components/schemas/K8sRunnerGkeCluster'
      required:
        - type
        - job
        - cluster

    K8sEksRunnerConfiguration:
      description: Runner configuration for an EKS cluster.
      type: object
      properties:
        type:
          $ref: '#/components/schemas/RunnerType'
        job:
          $ref: '#/components/schemas/K8sRunnerJobConfig'
        cluster:
          $ref: '#/components/schemas/K8sRunnerEksCluster'
      required:
        - type
        - job
        - cluster

    K8sAgentRunnerConfiguration:
      description: Runner configuration for a Kubernetes Agent.
      type: object
      properties:
        type:
          $ref: '#/components/schemas/RunnerType'
        job:
          $ref: '#/components/schemas/K8sRunnerJobConfig'
        key:
          $ref: '#/components/schemas/K8sAgentRunnerKey'
      required:
        - type
        - job
        - key

    ServerlessEcsRunnerConfiguration:
      description: Runner configuration for executing on AWS ECS Fargate.
      type: object
      properties:
        type:
          $ref: '#/components/schemas/RunnerType'
        auth:
          $ref: '#/components/schemas/AwsTemporaryAuth'
        job:
          $ref: '#/components/schemas/ServerlessEcsRunnerJob'
      required:
        - type
        - auth
        - job

    ServerlessEcsRunnerJob:
      description: Job details for the AWS ECS Runner
      required:
        - region
        - cluster
        - subnets
        - execution_role_arn
      properties:
        region:
          description: AWS Region to run the ECS job in.
          type: string
          pattern: ^[a-z]{2}-[a-z]+-\d$
          x-pattern-error: job region is not a valid AWS Region.
          example: us-west-2
          minLength: 1
          maxLength: 24
        cluster:
          description: ECS Fargate cluster name
          type: string
          example: my-cluster
          minLength: 1
          maxLength: 255
        subnets:
          description: The IDs of the AWS subnets that the runner must be connected to. At least one is required.
          type: array
          items:
            type: string
            example: 'subnet-12345'
            minLength: 1
            maxLength: 24
          minItems: 1
          maxItems: 16
        security_groups:
          description: An optional list of IDs for the AWS security groups that the runner should be associated with.
          type: array
          items:
            type: string
            example: 'runner-security-group'
            minLength: 1
            maxLength: 255
          maxItems: 5
          x-go-type-skip-optional-pointer: true
        is_public_ip_enabled:
          description: |
            Whether to assign a public ip to the ECS task. This is required if the target subnets use Internet Gateways
            instead of NAT Gateways to reach public networks. Defaults to false.
          type: boolean
          example: true
          x-go-type-skip-optional-pointer: true
        execution_role_arn:
          description: The ARN of the role used to pull images, retrieve secrets and parameters, and execute the Runner.
          type: string
          pattern: ^arn:aws:iam::\d{12}:role\/[a-zA-Z_0-9+=,.@\-_/]+$
          x-pattern-error: job execution_role_arn is not a valid IAM Role ARN
          example: arn:aws:iam::123456789012:role/ECSExecutionRole
        image:
          description: Container image to use for the runner. If not specified, a default runner image will be used.
          type: string
          pattern: ^[a-zA-Z0-9._:/-]+(?:@[a-z0-9]+:[a-fA-F0-9]+)?$
          x-pattern-error: image must be a valid container image
          example: ghcr.io/stellwerk-labs/platform-orchestrator-runner:v1.0.0
          maxLength: 255
        task_role_arn:
          description: An optional ARN for the role available inside the Runner.
          type: string
          pattern: ^arn:aws:iam::\d{12}:role\/[a-zA-Z_0-9+=,.@\-_/]+$
