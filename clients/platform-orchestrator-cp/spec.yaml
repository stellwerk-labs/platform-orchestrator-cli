  /orgs/{orgId}/modules/{moduleId}:
    get:
      operationId: getModule
      tags:
        - Modules
      summary: Get an existing module in the org
      security:
        - userIdHeader: []
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - $ref: '#/components/parameters/moduleIdPathParam'
      responses:
        '200':
          description: Successful get response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Module'
        '404':
          $ref: '#/components/responses/404NotFound'
    patch:
      operationId: updateModule
      tags:
        - Modules
      summary: Publish a new immutable Proposed version for an existing Module
      description: >-
        Compatibility authoring endpoint, not an in-place mutation or Default update.
        Requires a new semantic_version. Prefer publishModuleVersion and explicit lifecycle commands.
      security:
        - userIdHeader: []
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - $ref: '#/components/parameters/moduleIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModuleUpdateBody'
      responses:
        '200':
          description: Successful update response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Module'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409Conflict'
    delete:
      operationId: deleteModule
      tags:
        - Modules
      summary: Delete an unused empty Module catalogue entry
      description: >-
        Requires module.archive. Published versions are never deleted. A 409 response with
        error module_history_retained directs clients to reasoned catalogue archival.
        Other 409 responses represent usage or deletion blockers and must not be treated as success.
      security:
        - userIdHeader: []
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - $ref: '#/components/parameters/moduleIdPathParam'
      responses:
        '204':
          description: Successful delete response.
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409Conflict'
