              schema:
                $ref: '#/components/schemas/Module'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409Conflict'
    delete:
      operationId: deleteModule
      tags:
        - Modules
      summary: Delete an unused empty Module catalogue entry
      description: >-
        Requires module.archive. Published versions are never deleted. A 409 response with
        error module_history_retained directs clients to reasoned catalogue archival.
        Other 409 responses represent usage or deletion blockers and must not be treated as success.
      security:
        - userIdHeader: []
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - $ref: '#/components/parameters/moduleIdPathParam'
      responses:
        '204':
          description: Successful delete response.
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409Conflict'
