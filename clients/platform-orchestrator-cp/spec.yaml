components:
  securitySchemes:
    userIdHeader:
      type: apiKey
      in: header
      name: From
  parameters:
    orgIdPathParam:
      name: orgId
      in: path
      description: The Organization ID
      example: 'sample-org'
      required: true
      schema:
        type: string
    idempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable caller-generated key used to deduplicate command retries.
      schema: {type: string, minLength: 8, maxLength: 200}
    projectIdPathParam:
      name: projectId
      in: path
      description: The Project ID
      example: 'sample-project'
      required: true
      schema:
        type: string
    projectUuidPathParam:
      name: projectUuid
      in: path
      description: The Project UUID
      example: '01234567-89ab-cdef-0123-456789abcdef'
      required: true
      schema:
        type: string
        format: uuid
    envIdPathParam:
      name: envId
      in: path
      description: The Environment ID
      example: 'sample-env'
      required: true
      schema:
        type: string
    envUuidPathParam:
      name: envUuid
      in: path
      description: The Environment UUID
      example: '01234567-89ab-cdef-0123-456789abcdef'
      required: true
      schema:
        type: string
        format: uuid
    envTypeIdPathParam:
      name: envTypeId
      in: path
      description: The Environment Type ID
      example: 'development'
      required: true
      schema:
        type: string
    resourceTypeIdPathParam:
      name: typeId
      in: path
      description: The Resource Type
      example: 's3'
      required: true
      schema:
        type: string
    providerIdPathParam:
      name: providerId
      in: path
      description: The Module Provider ID
      example: 'my-aws-provider'
      required: true
      schema:
        type: string
    providerTypePathParam:
      name: providerType
      in: path
      description: The Module Provider Type
      example: 'aws'
      required: true
      schema:
        type: string
    moduleIdPathParam:
      name: moduleId
      in: path
      description: A Module ID
      example: 'my-s3-module'
      required: true
      schema:
        type: string
    moduleVersionIdPathParam:
      name: moduleVersionId
      in: path
      description: A Module Version ID
      example: 2.4.0
      required: true
      schema:
        type: string
    ruleIdPathParam:
      name: ruleId
      in: path
      description: A Module Rule ID
      example: 01234567-89ab-cdef-0123-456789abcdef
      required: true
      schema:
        type: string
        format: uuid
    runnerIdPathParam:
      name: runnerId
      in: path
      description: A Runner ID
      example: my-k8s-runner
      required: true
      schema:
        type: string
    perPageQueryParam:
      name: per_page
      in: query
      description: The maximum number of items to return in a page of results
      required: false
      example: 50
      schema:
        type: integer
    pageTokenQueryParam:
      name: page
      in: query
      description: The page token to request from
      required: false
      example: 'AAAAAAAAAA=='
      schema:
        type: string
    dryRunQueryParam:
      name: dry_run
      in: query
      description: If true, the request will not make any changes to the system, but will return what would have been done.
      required: false
      schema:
        type: boolean
        default: false
    resourceTypeIdQueryParam:
      name: type_id
      in: query
      description: Filter by resource type id.
      example: 's3'
      schema:
        type: string
      required: false
    includeNonDeveloperAccessibleQueryParam:
      name: include_non_developer_accessible
      in: query
      description: If true, the list will include resources that are not accessible to developers.
      required: false
      schema:
        type: boolean
        default: false
    forceQueryParam:
      name: force
      in: query
      description: If true, will perform force deletion, without destroying underlying infrastructure.
      required: false
      schema:
        type: boolean
        default: false
  responses:
    503ServiceUnavailable:
      description: The installed plugin cannot currently serve this request.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    400BadRequest:
      description: The request was invalid. More detail can be found in the error body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    401Unauthorized:
      description: The client didn't provide valid authentication credentials.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    403Forbidden:
      description: Server understands the request but refuses to authorize it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    404NotFound:
      description: The request was valid, but the target resource or relation does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    409Conflict:
      description: The request conflicts with existing state in the system.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    PluginDeploymentSubmitRequest:
      type: object
      additionalProperties: false
      required: [grant_fence, request_id, environment_uuid, mode]
      properties:
        grant_fence: {type: integer, format: int64, minimum: 1}
        request_id: {type: string, minLength: 1, maxLength: 128, pattern: '^[a-zA-Z0-9_-]+$'}
        environment_uuid: {type: string, format: uuid}
        first_forward_deployment_id:
          description: Optional assertion of the immutable first forward Deployment in this operation and Environment. Data Plane owns the lineage; omission cannot reset an existing rollback base.
          type: string
          format: uuid
        mode:
          type: string
          enum: [deploy, rollback]
          x-enum-varnames: [PluginDeploymentSubmitModeDeploy, PluginDeploymentSubmitModeRollback]
        plan:
          type: object
          additionalProperties: false
          required: [snapshot_id, fingerprint, module_versions]
          properties:
            snapshot_id: {type: string, format: uuid}
            fingerprint: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
            module_versions:
              type: object
              minProperties: 1
              maxProperties: 1000
              additionalProperties: {type: string, format: uuid}
        rollback:
          type: object
          additionalProperties: false
          required: [forward_deployment_id]
          properties:
            forward_deployment_id: {type: string, format: uuid}
            retry_of_rollback_deployment_id:
              description: Explicit retry of this operation's own authoritatively failed rollback Deployment. It must remain the current Environment head and target the same immutable rollback base. Does not permit automatic infrastructure retries.
              type: string
              format: uuid
        approval:
          type: object
          additionalProperties: false
          required: [actor_id, scope]
          properties:
            actor_id: {type: string, format: uuid}
            scope:
              type: string
              enum: [environment, project]
              x-enum-varnames: [PluginDeploymentApprovalScopeEnvironment, PluginDeploymentApprovalScopeProject]
        approved_pin_boundaries:
          description: Omit only for an approval-free operation. Otherwise include every target Module UUID and the approval's latest Pin activation UUID, or the nil UUID if no Pin activation ever existed. Requires approval actor and scope.
          type: object
          maxProperties: 1000
          additionalProperties: {type: string, format: uuid}
    DeploymentAdmissionRequest:
      type: object
      additionalProperties: false
      required: [actor_id, project_uuid, environment_uuid, request_digest, mode, module_versions]
      properties:
        actor_id: {type: string, format: uuid}
        project_uuid: {type: string, format: uuid}
        environment_uuid: {type: string, format: uuid}
        request_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
        mode:
          type: string
          enum: [deploy, rollback, destroy]
          x-enum-varnames: [AdmissionModeDeploy, AdmissionModeRollback, AdmissionModeDestroy]
        module_versions:
          description: Exact resolved Module UUID to Version UUID graph admitted for execution.
          type: object
          maxProperties: 1000
          additionalProperties: {type: string, format: uuid}
        carry_forward_module_versions:
          description: Exact subset of module_versions retained from the Environment's effective base. This evidence permits an archived Module to carry forward only its already-active Version.
          type: object
          maxProperties: 1000
          additionalProperties: {type: string, format: uuid}
        confirmed_restricted_version_uuids:
          description: Exact Defective target Version UUIDs used by this compiled Deployment and explicitly confirmed by the authorised caller.
          type: array
          maxItems: 1000
          uniqueItems: true
          items: {type: string, format: uuid}
    DeploymentAdmissionReceipt:
      type: object
      additionalProperties: false
      required: [admission_id, project_uuid, environment_uuid, request_digest, epoch, state, mode]
      properties:
        admission_id: {type: string, format: uuid}
        project_uuid: {type: string, format: uuid}
        environment_uuid: {type: string, format: uuid}
        request_digest: {type: string}
        epoch: {type: integer, format: int64, minimum: 1}
        mode: {type: string}
        state:
          type: string
          enum: [active, settled]
          x-enum-varnames: [AdmissionStateActive, AdmissionStateSettled]
        outcome: {type: string}
    PluginPinOperationRequest:
      type: object
      additionalProperties: false
      required: [action, grant_fence, request_id, reason, targets]
      properties:
        action:
          type: string
          enum: [begin, reconcile, restore, cancel]
          x-enum-varnames: [PluginPinBegin, PluginPinReconcile, PluginPinRestore, PluginPinCancel]
        grant_fence: {type: integer, format: int64, minimum: 1}
        request_id: {type: string, minLength: 1, maxLength: 128}
        reason: {type: string, minLength: 1, maxLength: 4096}
        proof: {$ref: '#/components/schemas/PluginDelegationProof'}
        targets:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required: [pin_id, expected_resource_version]
            properties:
              pin_id: {type: string, format: uuid}
              expected_resource_version: {type: integer, format: int64, minimum: 1}
              target_version_uuid: {type: string, format: uuid, description: Required only for begin.}
              deployment_id: {type: string, format: uuid, description: Required only for reconcile or restore.}
    PluginPinOperationReceipt:
      type: object
      additionalProperties: false
      required: [operation_id, request_id, action, pins]
      properties:
        operation_id: {type: string, format: uuid}
        request_id: {type: string}
        action: {type: string, enum: [begin, reconcile, restore, cancel]}
        pins:
          type: array
          minItems: 1
          maxItems: 1000
          items: {$ref: '#/components/schemas/EnvironmentModuleVersionPin'}
    PluginDeploymentReadRequest:
      type: object
      additionalProperties: false
      required: [kind, environments]
      properties:
        proof: {$ref: '#/components/schemas/PluginDelegationProof'}
        operation_id: {type: string, format: uuid, description: Background inspection uses this immutable grant and grant_fence instead of a user proof. Current actor authorization is always rechecked.}
        grant_fence: {type: integer, format: int64, minimum: 1}
        request_id: {type: string, minLength: 1, maxLength: 128, description: Required for background inspection. Preserve across retries of the same logical inspection.}
        kind:
          type: string
          enum: [readiness, plan, deployment, dispatch]
          x-enum-varnames: [PluginDeploymentReadRequestKindReadiness, PluginDeploymentReadRequestKindPlan, PluginDeploymentReadRequestKindDeployment, PluginDeploymentReadRequestKindDispatch]
        environments:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required: [project_id, env_id]
            properties:
              project_id: {type: string, minLength: 1, maxLength: 200}
              env_id: {type: string, minLength: 1, maxLength: 200}
        module_versions:
          description: For plan only. Module slug or UUID to exact immutable Version UUID. Core supplies the corresponding version coordinate and artifact digest.
          type: object
          maxProperties: 1000
          additionalProperties: {type: string, format: uuid}
        deployment_id: {type: string, format: uuid, description: Required for deployment inspection of exactly one Environment.}
        dispatch_id: {type: string, minLength: 1, maxLength: 128, description: "Required for receipt inspection after a lost dispatch response. This is a read, never a retry of execution."}
    ModuleVersionLifecycle:
      type: object
      required: [module_id, module_uuid, version, version_uuid, artifact_digest, status, created_at]
      properties:
        module_id: {type: string}
        module_uuid: {type: string, format: uuid}
        version: {type: string}
        version_uuid: {type: string, format: uuid}
        artifact_digest: {type: string, description: Optional external artifact claim. Empty for inline source or when omitted at publication.}
        status: {$ref: '#/components/schemas/ModuleVersionSemanticStatus'}
        created_at: {type: string, format: date-time}
    PluginResourceEvent:
      type: object
      required: [event_id, type, occurred_at]
      properties:
        event_id: {type: string, format: uuid}
        type: {type: string}
        occurred_at: {type: string, format: date-time}
        environment_uuid: {type: string, format: uuid}
        project_uuid: {type: string, format: uuid}
        module_uuid: {type: string, format: uuid}
        version_uuid: {type: string, format: uuid}
        pin_id: {type: string, format: uuid}
        activation_event_id: {type: string, format: uuid}
        operation_id: {type: string, format: uuid}
        actor_id: {type: string, format: uuid}
        from_status: {type: string}
        to_status: {type: string}
        transition: {type: string}
        reason: {type: string}
    PluginInventorySelector:
      type: object
      additionalProperties: false
      properties:
        environment_ids: {type: array, maxItems: 10000, uniqueItems: true, items: {type: string, format: uuid}}
        project_ids: {type: array, maxItems: 1000, uniqueItems: true, items: {type: string, minLength: 1}}
        environment_types: {type: array, maxItems: 1000, uniqueItems: true, items: {type: string, minLength: 1}}
        labels: {type: object, maxProperties: 50, additionalProperties: {type: string}}
    PluginInventoryRequest:
      type: object
      additionalProperties: false
      required: [proof, selector, module_ids]
      properties:
        proof: {$ref: '#/components/schemas/PluginDelegationProof'}
        selector: {$ref: '#/components/schemas/PluginInventorySelector'}
        module_ids: {type: array, maxItems: 1000, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 200}}
    PluginInventory:
      type: object
      required: [environments, environment_types, modules, versions, pins, pin_events]
      properties:
        environments: {type: array, items: {$ref: '#/components/schemas/Environment'}}
        environment_types: {type: array, items: {$ref: '#/components/schemas/EnvironmentType'}}
        modules: {type: array, items: {$ref: '#/components/schemas/ModuleCatalogueEntry'}}
        versions: {type: array, items: {$ref: '#/components/schemas/CoreModuleVersion'}}
        pins: {type: array, items: {$ref: '#/components/schemas/EnvironmentModuleVersionPin'}}
        pin_events: {type: array, items: {$ref: '#/components/schemas/ModuleVersionPinEvent'}}
    PluginContributionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/PluginContribution'}
    PluginContribution:
      type: object
      required: [id, display_name, state, mode, operations]
      properties:
        id: {type: string}
        display_name: {type: string}
        version: {type: string}
        state: {$ref: '#/components/schemas/PluginAvailabilityState'}
        mode: {type: string, enum: [full, read_only, safety_only, hidden]}
        entitlement: {$ref: '#/components/schemas/PluginEntitlementStatus'}
        ui:
          type: object
          required: [sdk_version, origin, entrypoint, route_prefix, navigation_label]
          properties:
            sdk_version: {type: string, enum: ['1']}
            origin: {type: string, format: uri}
            entrypoint: {type: string}
            route_prefix: {type: string}
            navigation_label: {type: string}
            contextual_actions:
              type: array
              maxItems: 100
              description: Declarative navigation into the plugin, not Core authorization or executable UI code. Present only in full mode with the required operation advertised.
              items:
                type: object
                additionalProperties: false
                required: [id, resource_type, label, required_operation_id, route, when]
                properties:
                  id: {type: string}
                  resource_type: {type: string, enum: [module_version]}
                  label: {type: string, minLength: 1, maxLength: 100}
                  required_operation_id: {type: string}
                  primary: {type: boolean}
                  route:
                    type: object
                    additionalProperties: false
                    required: [path]
                    properties:
                      path: {type: string, pattern: '^[a-z0-9](?:[a-z0-9/-]*[a-z0-9])?$'}
                      query:
                        type: object
                        additionalProperties: {type: string, enum: ['$module_id', '$semantic_version', '$version_uuid']}
                  when:
                    type: object
                    additionalProperties: false
                    required: [lifecycle_status, semantic_version_required]
                    properties:
                      lifecycle_status:
                        type: array
                        minItems: 1
                        uniqueItems: true
                        items: {$ref: '#/components/schemas/ModuleVersionSemanticStatus'}
                      semantic_version_required: {type: boolean}
            core_operations:
              description: Named Console SDK operations executed with the user's independent Core permissions, never forwarded to the plugin.
              type: array
              items:
                type: object
                required: [id, method, mutating]
                properties:
                  id: {type: string, pattern: '^(core|iam)\.'}
                  method: {type: string, enum: [GET, POST]}
                  mutating: {type: boolean}
        operations:
          type: array
          items:
            type: object
            required: [id, method, mutating]
            properties:
              id: {type: string}
              method: {type: string}
              mutating: {type: boolean}
              required_feature: {type: string, description: "Declared licence feature required by this operation, if any."}
    PluginModuleOperationRequest:
      type: object
      additionalProperties: false
      required: [action, grant_fence, expected_fence, request_id, reason, targets]
      properties:
        action: {type: string, enum: [reserve, release, promote, restore]}
        grant_fence: {type: integer, format: int64, minimum: 1}
        expected_fence: {type: integer, format: int64, minimum: 0}
        request_id: {type: string, minLength: 1, maxLength: 128}
        reason: {type: string, minLength: 1, maxLength: 4096}
        targets:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required: [module_uuid, version_uuid, expected_resource_version]
            properties:
              module_uuid: {type: string, format: uuid}
              version_uuid: {type: string, format: uuid}
              expected_default_uuid: {type: string, format: uuid, nullable: true}
              expected_resource_version:
                type: integer
                format: int64
                description: Required CAS revision for promotion. For a grant-bound restore, Core derives the locked captured-baseline revision and the client may send zero; exact Default lineage and grant fences still apply.
    PluginModuleOperationReceipt:
      type: object
      required: [org_id, plugin_id, operation_id, request_id, action, fence, state, module_uuids]
      properties:
        org_id: {type: string}
        plugin_id: {type: string}
        operation_id: {type: string, format: uuid}
        request_id: {type: string}
        action: {type: string}
        fence: {type: integer, format: int64}
        state: {type: string, enum: [active, released]}
        module_uuids: {type: array, items: {type: string, format: uuid}}
    PluginOperationIntent:
      type: object
      additionalProperties: false
      required: [fingerprint, modules, target_versions, environments, actions]
      properties:
        fingerprint: {type: string, pattern: '^[a-f0-9]{64}$'}
        modules:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items: {type: string, format: uuid}
        target_versions:
          description: Exact Module UUID to immutable target Version UUID binding, with exactly one entry for every frozen Module.
          type: object
          additionalProperties: {type: string, format: uuid}
        environments:
          type: array
          maxItems: 10000
          items:
            type: object
            additionalProperties: false
            required: [project_id, environment_id]
            properties:
              project_id: {type: string, format: uuid}
              environment_id: {type: string, format: uuid}
        actions:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 128}
    PluginDelegationProof:
      type: object
      additionalProperties: false
      required: [operation_id, idempotency_key, assertion]
      properties:
        operation_id: {type: string}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
        assertion: {type: string, maxLength: 16384}
        body:
          description: Base64-encoded exact original request bytes. Decoding and re-encoding JSON would invalidate the signature.
          type: string
          format: byte
        path_parameters: {type: object, additionalProperties: {type: string}}
        query:
          type: object
          additionalProperties: {type: array, items: {type: string}}
    PluginAuthorizationCheckRequest:
      type: object
      additionalProperties: false
      required: [permission, resources]
      properties:
        permission: {type: string, minLength: 1, maxLength: 255}
        resources:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required: [type, id]
            properties:
              type: {type: string, enum: [organization, project, environment]}
              id: {type: string, minLength: 1, maxLength: 255}
        proof: {$ref: '#/components/schemas/PluginDelegationProof'}
        operation_id: {type: string, format: uuid}
        grant_fence: {type: integer, format: int64, minimum: 1}
        subject_id:
          description: Optional subject to revalidate inside a persisted grant. Forbidden with fresh proof authority.
          type: string
          format: uuid
    PluginAuthorizationCheckResult:
      type: object
      additionalProperties: false
      required: [allowed]
      properties:
        allowed: {type: boolean}
    PluginOperationAuthorizationRequest:
      type: object
      additionalProperties: false
      required: [action, expected_revision, reason, proof]
      properties:
        action: {type: string, enum: [prepare, activate, suspend, release]}
        expected_revision: {type: integer, format: int64, minimum: 0}
        reason: {type: string, minLength: 1, maxLength: 4096}
        proof: {$ref: '#/components/schemas/PluginDelegationProof'}
        intent: {$ref: '#/components/schemas/PluginOperationIntent'}
    PluginOperationGrant:
      type: object
      additionalProperties: false
      required: [org_id, plugin_id, operation_id, actor_id, source_operation, intent, baseline_defaults, revision, state]
      properties:
        org_id: {type: string}
        plugin_id: {type: string}
        operation_id: {type: string, format: uuid}
        actor_id: {type: string, format: uuid}
        source_operation: {type: string}
        availability:
          description: Current plugin availability, returned by the service-only grant read. Not part of the frozen grant and never an execution credential.
          allOf:
            - {$ref: '#/components/schemas/PluginAvailabilityState'}
        entitlement:
          description: Current non-secret licence preflight for scheduler safety. Every Core effect independently reauthorizes in its own transaction.
          allOf:
            - {$ref: '#/components/schemas/PluginEntitlementStatus'}
        intent: {$ref: '#/components/schemas/PluginOperationIntent'}
        baseline_defaults:
          description: Core-captured Default Version UUIDs at preparation, null when a Module had no Default. Restoration cannot select arbitrary historical versions.
          type: object
          additionalProperties: {type: string, format: uuid, nullable: true}
        revision: {type: integer, format: int64, minimum: 1}
        state: {type: string, enum: [prepared, active, suspended, released]}
    PluginDispatchCheck:
      type: object
      additionalProperties: false
      required: [fence, action, dispatch_id, project_uuid, environment_uuid, request_digest]
      properties:
        fence: {type: integer, format: int64, minimum: 1}
        action: {type: string, enum: [external-deployment.admit, external-deployment.rollback]}
        dispatch_id: {type: string, minLength: 1, maxLength: 128}
        project_uuid: {type: string, format: uuid}
        environment_uuid: {type: string, format: uuid}
        request_digest: {type: string, pattern: '^[a-f0-9]{64}$'}
    PluginDispatchAuthorization:
      type: object
      additionalProperties: false
      required: [org_id, plugin_id, operation_id, fence, action, dispatch_id, project_uuid, environment_uuid, request_digest, actor_id]
      properties:
        org_id: {type: string}
        plugin_id: {type: string}
        operation_id: {type: string, format: uuid}
        fence: {type: integer, format: int64}
        action: {type: string}
        dispatch_id: {type: string}
        project_uuid: {type: string, format: uuid}
        environment_uuid: {type: string, format: uuid}
        request_digest: {type: string}
        actor_id: {type: string, format: uuid}
    PluginInvocation:
      type: object
      additionalProperties: false
      required: [operation_id]
      properties:
        operation_id: {type: string}
        path_parameters: {type: object, additionalProperties: {type: string}}
        query: {type: object, additionalProperties: {type: array, items: {type: string}}}
        body:
          x-go-type: json.RawMessage
        idempotency_key: {type: string, maxLength: 128}
    PluginInvocationResult:
      type: object
      required: [status, body]
      properties:
        status: {type: integer}
        body:
          x-go-type: json.RawMessage
    PluginAvailabilityState:
      type: string
      enum: [available, not_installed, not_enabled, not_entitled, incompatible, unavailable]
