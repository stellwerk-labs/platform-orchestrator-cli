  /orgs/{orgId}/plugins/{pluginId}/authorization-checks:
    post:
      operationId: checkPluginAuthorization
      summary: Evaluate one configured plugin-local capability using current IAM state.
      description: The configured plugin service may evaluate only operator-declared capabilities in its own namespace. A request is authorized by either an exact fresh gateway proof or a current persisted operation fence. Core derives the actor from that authority, resolves all resource membership in the path organization, and returns no identity metadata.
      tags: [Plugin]
