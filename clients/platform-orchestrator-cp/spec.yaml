      operationId: getModule
      tags:
        - Modules
      summary: Get an existing module in the org
      security:
        - userIdHeader: []
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - $ref: '#/components/parameters/moduleIdPathParam'
      responses:
        '200':
          description: Successful get response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Module'
        '404':
          $ref: '#/components/responses/404NotFound'
    patch:
      operationId: updateModule
      tags:
        - Modules
      summary: Publish a new immutable Proposed version for an existing Module
      description: >-
        Compatibility authoring endpoint, not an in-place mutation or Default update.
        Requires a new semantic_version. Prefer publishModuleVersion and explicit lifecycle commands.
      security:
        - userIdHeader: []
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - $ref: '#/components/parameters/moduleIdPathParam'
      requestBody:
        required: true
        content:
