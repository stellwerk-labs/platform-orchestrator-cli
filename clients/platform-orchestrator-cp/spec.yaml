  /orgs/{orgId}/module-rules:
    get:
      operationId: listModuleRulesInOrg
      tags:
        - Rules
      summary: List module rules in the org
      security:
        - userIdHeader: []
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - $ref: '#/components/parameters/perPageQueryParam'
        - $ref: '#/components/parameters/pageTokenQueryParam'
        - name: byResourceType
          in: query
          schema:
            type: string
          description: Filter the list by the given resource type
        - name: byModuleId
          in: query
          schema:
            type: string
          description: Filter the list by the given module id
        - name: byProjectId
          in: query
          schema:
            type: string
          description: Filter the list by the given project id
        - name: byEnvId
          in: query
          schema:
            type: string
          description: Filter the list by the given environment type id. It must be used together with byProjectId.
      responses:
        '200':
          description: Successful list response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulePage'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '404':
          $ref: '#/components/responses/404NotFound'
    post:
      operationId: createModuleRuleInOrg
      tags:
        - Rules
