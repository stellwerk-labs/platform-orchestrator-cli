openapi: 3.0.0
info:
  title: Stellwerk Control Plane API
  version: unreleased
paths:
  /orgs/{orgId}/plugins/{pluginId}/entitlement:
    get:
      operationId: getPluginEntitlement
      summary: Read this installation's current offline licence decision as its configured service.
      description: Only the exact configured plugin service identity may read this non-secret preflight, including before an operation grant exists. It exposes no issuer keys, signed documents or Core resource data. This decision never grants IAM authority and is not an execution credential; every Core effect reauthorizes independently. Missing licence and disabled states are returned explicitly so recovery can stop forward work safely.
      tags: [Plugin]
      security: [{userIdHeader: []}]
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - {name: pluginId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Current scoped plugin availability and entitlement projection, never signed evidence.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginCapability'}
        '403': {$ref: '#/components/responses/403Forbidden'}
        '404': {$ref: '#/components/responses/404NotFound'}
        '503': {$ref: '#/components/responses/503ServiceUnavailable'}
  /orgs/{orgId}/deployment-admissions/{admissionId}:
    post:
      operationId: authorizeDeploymentAdmission
      summary: Protect one ordinary Data Plane admission against concurrent Pin changes.
      description: Restricted to the operator-bound authenticated Data Plane service. Rechecks the original actor's deployment permission and exact immutable scope. Persists a guard before DP commits a Deployment. No plugin capability grants access. A settled identity can never authorize another Deployment.
      tags: [Deployment admissions]
      security: [{userIdHeader: []}]
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - {name: admissionId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeploymentAdmissionRequest'}
      responses:
        '200':
          description: Exact active guard. Execution still belongs exclusively to the Data Plane.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeploymentAdmissionReceipt'}
        '400': {$ref: '#/components/responses/400BadRequest'}
        '403': {$ref: '#/components/responses/403Forbidden'}
        '404': {$ref: '#/components/responses/404NotFound'}
        '409': {$ref: '#/components/responses/409Conflict'}
        '503': {$ref: '#/components/responses/503ServiceUnavailable'}
  /orgs/{orgId}/deployment-admissions/{admissionId}/seal-absence:
    post:
      operationId: sealDeploymentAdmissionAbsence
      summary: Permanently close an uncommitted admission, including a delayed authorize request.
      description: Restricted to the operator-bound Data Plane service. DP must first persist exact intent and an absent tombstone under its admission-key lock, proving no Deployment committed. Core stores an immutable absent receipt even if authorize has not arrived, or settles the exact existing active guard. A late authorize can never reopen this identity. Recovery does not recheck the original actor's permission or require a live Environment. Changed intent or a different terminal outcome conflicts. Timeout or a not-found read alone is never absence evidence.
      tags: [Deployment admissions]
      security: [{userIdHeader: []}]
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - {name: admissionId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeploymentAdmissionRequest'}
      responses:
        '200':
          description: Exact permanent absent receipt. This never creates execution authority.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeploymentAdmissionReceipt'}
        '400': {$ref: '#/components/responses/400BadRequest'}
        '403': {$ref: '#/components/responses/403Forbidden'}
        '404': {$ref: '#/components/responses/404NotFound'}
        '409': {$ref: '#/components/responses/409Conflict'}
  /orgs/{orgId}/deployment-admissions/{admissionId}/settle:
    post:
      operationId: settleDeploymentAdmission
      summary: Settle an exact ordinary admission from the authenticated Data Plane's durable outcome.
      description: Only the operator-bound DP service can report authoritative terminal receipt evidence. An absent outcome requires a sealed DP tombstone under the admission-key lock after transaction rollback; timeout is never evidence. The original actor need not retain permissions for safety reconciliation. Scope, request digest and completion are immutable.
      tags: [Deployment admissions]
      security: [{userIdHeader: []}]
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - {name: admissionId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [project_uuid, environment_uuid, request_digest, outcome]
              properties:
                project_uuid: {type: string, format: uuid}
                environment_uuid: {type: string, format: uuid}
                request_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
                outcome:
                  type: string
                  enum: [succeeded, failed, cancelled, terminated, absent]
                  x-enum-varnames: [AdmissionOutcomeSucceeded, AdmissionOutcomeFailed, AdmissionOutcomeCancelled, AdmissionOutcomeTerminated, AdmissionOutcomeAbsent]
      responses:
        '200':
          description: Exact immutable completion receipt.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeploymentAdmissionReceipt'}
        '400': {$ref: '#/components/responses/400BadRequest'}
        '403': {$ref: '#/components/responses/403Forbidden'}
        '404': {$ref: '#/components/responses/404NotFound'}
        '409': {$ref: '#/components/responses/409Conflict'}
  /orgs/{orgId}/plugins/{pluginId}/projects/{projectUuid}/envs/{environmentUuid}/deployments/{deploymentId}/{materialKind}:
    get:
      operationId: getPluginDeploymentMaterial
      summary: Retrieve plugin-owned Deployment material using the caller's independent Orchestrator permission.
      description: Requires current ordinary deployment_read authorization. Plugin capabilities and operation grants never authorize this endpoint. Core signs an exact immutable-scope Data Plane request; DP decrypts retained material without exposing a private key. Plugin service and admission-checker principals are explicitly denied. Historical retrieval does not depend on a live Environment or the plugin's entitlement. No material is sent through the plugin backend or invocation envelope.
      tags: [Plugin]
      security: [{userIdHeader: []}]
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - {name: pluginId, in: path, required: true, schema: {type: string}}
        - {name: projectUuid, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: environmentUuid, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: deploymentId, in: path, required: true, schema: {type: string, format: uuid}}
        - name: materialKind
          in: path
          required: true
          schema:
            type: string
            enum: [logs, outputs]
            x-enum-varnames: [PluginDeploymentMaterialLogs, PluginDeploymentMaterialOutputs]
      responses:
        '200':
          description: Original decrypted bytes, bounded to 16 MiB and returned as an attachment. Outputs retain the original JSON bytes without reserialization.
          headers:
            Content-Disposition: {schema: {type: string}}
            Cache-Control: {schema: {type: string}}
            X-Content-Type-Options: {schema: {type: string}}
          content:
            text/plain:
              schema: {type: string}
        '400': {$ref: '#/components/responses/400BadRequest'}
        '403': {$ref: '#/components/responses/403Forbidden'}
        '404': {$ref: '#/components/responses/404NotFound'}
        '409': {$ref: '#/components/responses/409Conflict'}
        '413':
          description: Material exceeds the bounded download size.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/503ServiceUnavailable'}
  /orgs/{orgId}/plugins/{pluginId}/operations/{operationId}/deployments:
    post:
      operationId: submitPluginDeployment
      summary: Admit one exact planned Deployment through the normal Data Plane path.
      description: Requires the configured plugin service, a current active operation fence and current scoped actor authorization. Core records the exact dispatch before contacting the Data Plane. Only a DP-owned immutable plan snapshot or the same operation's forward Deployment may be referenced. An uncertain response must be reconciled, never replaced with a new dispatch identity.
      tags: [Plugin]
      security: [{userIdHeader: []}]
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - {name: pluginId, in: path, required: true, schema: {type: string}}
        - {name: operationId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PluginDeploymentSubmitRequest'}
      responses:
        '200':
          description: Exact upstream status and JSON response. A non-success upstream status is not successful admission.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginInvocationResult'}
        '400': {$ref: '#/components/responses/400BadRequest'}
        '403': {$ref: '#/components/responses/403Forbidden'}
        '404': {$ref: '#/components/responses/404NotFound'}
        '409': {$ref: '#/components/responses/409Conflict'}
        '503': {$ref: '#/components/responses/503ServiceUnavailable'}
  /orgs/{orgId}/plugins/{pluginId}/operations/{operationId}/deployments/{dispatchId}/reconcile:
    post:
      operationId: reconcilePluginDeployment
      summary: Recover an exact dispatch and settle its protection only from authoritative Data Plane evidence.
      description: Does not submit Data Plane work. An original_request can recover an intent missing from Core, preserving its original fence and exact request identity separately from the current grant_fence. Active recovery revalidates normal admission authority before recording the intent. With withdraw=true, Core records or withdraws the exact non-admitting intent before waiting on the Data Plane receipt lock. Only then can authoritative absence settle an unstarted dispatch. Terminal outcomes can be recovered after suspension or entitlement expiry with current scoped authorization.
      tags: [Plugin]
      security: [{userIdHeader: []}]
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - {name: pluginId, in: path, required: true, schema: {type: string}}
        - {name: operationId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: dispatchId, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [grant_fence, withdraw]
              properties:
                grant_fence: {type: integer, format: int64, minimum: 1}
                withdraw: {type: boolean}
                original_request:
                  description: The retained original submit request, unchanged. Required only when Core has not recorded the dispatch; if supplied for a recorded dispatch it must match its immutable intent.
                  $ref: '#/components/schemas/PluginDeploymentSubmitRequest'
      responses:
        '200':
          description: Exact upstream receipt or absence, with its status. Protection remains until terminal or withdrawn-and-absent evidence is proven.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginInvocationResult'}
        '400': {$ref: '#/components/responses/400BadRequest'}
        '403': {$ref: '#/components/responses/403Forbidden'}
        '404': {$ref: '#/components/responses/404NotFound'}
        '409': {$ref: '#/components/responses/409Conflict'}
        '503': {$ref: '#/components/responses/503ServiceUnavailable'}
  /orgs/{orgId}/plugins/{pluginId}/operations/{operationId}/pins:
    post:
      operationId: applyPluginPinOperation
      summary: Apply an atomic, operation-bound Pin override or reconciliation.
      description: Begin requires a fresh explicit user command and a dedicated override capability. Reconciliation and restoration use authoritative DP receipts, not plugin assertions. This service port cannot Unpin or permanently discard protection.
      tags: [Plugin]
      security: [{userIdHeader: []}]
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - {name: pluginId, in: path, required: true, schema: {type: string}}
        - {name: operationId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PluginPinOperationRequest'}
      responses:
        '200':
          description: Atomic Pin result, retained for exact actor-bound retries.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/EnvironmentModuleVersionPin'}}
        '400': {$ref: '#/components/responses/400BadRequest'}
        '403': {$ref: '#/components/responses/403Forbidden'}
        '404': {$ref: '#/components/responses/404NotFound'}
        '409': {$ref: '#/components/responses/409Conflict'}
        '503': {$ref: '#/components/responses/503ServiceUnavailable'}
  /orgs/{orgId}/plugins/{pluginId}/operations/{operationId}/pins/receipts/{requestId}:
    get:
      operationId: getPluginPinOperationReceipt
      summary: Recover a committed Pin command result without replaying a user proof.
      description: Requires the configured plugin service, the current operation fence and the current controller's scoped permission for the recorded action. Returns the exact historical result, not live Pin state. Works after suspension or entitlement expiry; never renews authority or performs a transition. A missing receipt does not prove that a request cannot still arrive, and does not authorize a new begin command.
      tags: [Plugin]
      security: [{userIdHeader: []}]
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - {name: pluginId, in: path, required: true, schema: {type: string}}
        - {name: operationId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: requestId, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._-]+$'}}
        - {name: grant_fence, in: query, required: true, schema: {type: integer, format: int64, minimum: 1}}
      responses:
        '200':
          description: Exact committed command identity, action and Pin result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginPinOperationReceipt'}
        '400': {$ref: '#/components/responses/400BadRequest'}
        '403': {$ref: '#/components/responses/403Forbidden'}
        '404': {$ref: '#/components/responses/404NotFound'}
        '409': {$ref: '#/components/responses/409Conflict'}
        '503': {$ref: '#/components/responses/503ServiceUnavailable'}
  /orgs/{orgId}/plugins/{pluginId}/deployment-reads:
    post:
      operationId: readPluginDeploymentData
      summary: Authorize and forward a closed Deployment inspection or planning request.
      description: Core resolves immutable ownership, checks the delegated actor and declared service port, and signs an exact request to its fixed Data Plane. Only metadata and safe plan projections are returned. This endpoint cannot admit or execute a Deployment, or retrieve logs, outputs or secret values.
      tags: [Plugin]
      security: [{userIdHeader: []}]
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - {name: pluginId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PluginDeploymentReadRequest'}
      responses:
        '200':
          description: Exact Data Plane response and status for external-deployment.readiness, external-deployment.plan or external-deployment.read. The Data Plane OpenAPI schemas define each body; non-success upstream status remains a failure, not a successful empty result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginInvocationResult'}
        '400': {$ref: '#/components/responses/400BadRequest'}
        '403': {$ref: '#/components/responses/403Forbidden'}
        '404': {$ref: '#/components/responses/404NotFound'}
        '503': {$ref: '#/components/responses/503ServiceUnavailable'}
  /orgs/{orgId}/module-versions/proposed:
    get:
      operationId: listProposedModuleVersions
      summary: List Proposed versions of active Modules.
      tags: [Modules]
      security: [{userIdHeader: []}]
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
      responses:
        '200':
          description: Proposed Module Version metadata, independent of add-on availability.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/ModuleVersionLifecycle'}}
        '403': {$ref: '#/components/responses/403Forbidden'}
        '404': {$ref: '#/components/responses/404NotFound'}
  /orgs/{orgId}/plugins/{pluginId}/inventory:
    post:
      operationId: readPluginInventory
      summary: Read an authorized, bounded and consistent snapshot of Core metadata.
      description: Requires the configured plugin service identity and a request-bound user delegation for the declared inventory.read port. Contains no Module source, provider configuration or Deployment material.
      tags: [Plugin]
      security: [{userIdHeader: []}]
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - {name: pluginId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PluginInventoryRequest'}
      responses:
        '200':
          description: Repeatable-read metadata snapshot. Deployment readiness and effective-base data remain owned by the Data Plane.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginInventory'}
        '400': {$ref: '#/components/responses/400BadRequest'}
        '403': {$ref: '#/components/responses/403Forbidden'}
        '404': {$ref: '#/components/responses/404NotFound'}
        '503': {$ref: '#/components/responses/503ServiceUnavailable'}
  /orgs/{orgId}/plugins/{pluginId}/authorization-checks:
    post:
      operationId: checkPluginAuthorization
      summary: Evaluate one configured plugin-local capability using current IAM state.
      description: The configured plugin service may evaluate only operator-declared capabilities in its own namespace. A request is authorized by either an exact fresh gateway proof or a current persisted operation fence. Core derives the actor from that authority, resolves all resource membership in the path organization, and returns no identity metadata.
      tags: [Plugin]
      security: [{userIdHeader: []}]
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - {name: pluginId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PluginAuthorizationCheckRequest'}
      responses:
        '200':
          description: Current IAM decision. A denial discloses no subject metadata.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginAuthorizationCheckResult'}
        '400': {$ref: '#/components/responses/400BadRequest'}
        '403': {$ref: '#/components/responses/403Forbidden'}
        '404': {$ref: '#/components/responses/404NotFound'}
        '409': {$ref: '#/components/responses/409Conflict'}
        '503': {$ref: '#/components/responses/503ServiceUnavailable'}
  /orgs/{orgId}/plugins/{pluginId}/operations/{operationId}:
    get:
      operationId: getPluginOperationGrant
      summary: Recover persisted operation bounds using the configured plugin service identity.
      description: Read-only recovery does not renew or activate the grant and grants no authority to execute it.
      tags: [Plugin]
      security: [{userIdHeader: []}]
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - {name: pluginId, in: path, required: true, schema: {type: string}}
        - {name: operationId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Current immutable operation bounds and fencing generation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginOperationGrant'}
        '403': {$ref: '#/components/responses/403Forbidden'}
        '404': {$ref: '#/components/responses/404NotFound'}
  /orgs/{orgId}/plugins/{pluginId}/operations/{operationId}/resource-events:
    get:
      operationId: readPluginResourceEvents
      tags: [Plugin]
      security: [{userIdHeader: []}]
      description: Read durable Core resource metadata within a frozen operation. Only the configured plugin service may call; current controller authorization is required, including during safety recovery. Cursors are opaque and scoped to this operation.
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - {name: pluginId, in: path, required: true, schema: {type: string}}
        - {name: operationId, in: path, required: true, schema: {type: string, format: uuid}}
        - name: after
          in: query
          schema: {type: string, maxLength: 2048}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 100}
      responses:
        '200':
          description: Commit-ordered metadata and the next durable cursor. No definitions, notes, logs or outputs.
          content:
            application/json:
              schema:
                type: object
                required: [events, next_cursor, organization_timezone]
                properties:
                  events:
                    type: array
                    items: {$ref: '#/components/schemas/PluginResourceEvent'}
                  next_cursor: {type: string}
                  organization_timezone: {type: string}
        '400': {$ref: '#/components/responses/400BadRequest'}
        '403': {$ref: '#/components/responses/403Forbidden'}
        '404': {$ref: '#/components/responses/404NotFound'}
        '409': {$ref: '#/components/responses/409Conflict'}
  /orgs/{orgId}/plugins/{pluginId}/operations/{operationId}/events:
    post:
      operationId: publishPluginEvent
      tags: [Plugin]
      security: [{userIdHeader: []}]
      description: Idempotently publish an event through the Core transactional outbox. The event type is plugin.<immutable-plugin-id>.<local-name>, with one non-dotted local name such as rollout-completed, preventing impersonation of Core or nested plugin namespaces. Broker delivery uses io.platform-orchestrator.<event-type> in the existing platform stream without changing the CloudEvent type or payload. Delivery is at least once; consumers deduplicate by event_id. Never include secret values or deployment material.
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - {name: pluginId, in: path, required: true, schema: {type: string}}
        - {name: operationId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [event_id, grant_fence, type, occurred_at, data]
              properties:
                event_id: {type: string, format: uuid}
                grant_fence: {type: integer, format: int64, minimum: 1}
                type: {type: string, minLength: 1, maxLength: 200}
                occurred_at: {type: string, format: date-time}
                data: {type: object, additionalProperties: true}
      responses:
        '204': {description: "Publication durably accepted, or the exact receipt replayed."}
        '400': {$ref: '#/components/responses/400BadRequest'}
        '403': {$ref: '#/components/responses/403Forbidden'}
        '404': {$ref: '#/components/responses/404NotFound'}
        '409': {$ref: '#/components/responses/409Conflict'}
  /orgs/{orgId}/plugins/{pluginId}/operations/{operationId}/control:
    post:
      operationId: controlPluginOperationGrant
      summary: Suspend or release existing delegated operation authority without replaying a human request.
      description: Configured plugin service only. The existing frozen intent and operator policy must both delegate the requested action. Core derives the current controller from its grant and rechecks scoped IAM. Only suspend and release are allowed; this route never prepares, expands or reactivates authority. Exact request ID, fence, action and reason are idempotent. Safety control remains available after disablement or entitlement expiry; incompatible and unavailable installations fail closed. Releasing a grant does not remove Deployment barriers or pending Pin protection.
      tags: [Plugin]
      security: [{userIdHeader: []}]
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - {name: pluginId, in: path, required: true, schema: {type: string}}
        - {name: operationId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [grant_fence, request_id, action, reason]
              properties:
                grant_fence: {type: integer, format: int64, minimum: 1}
                request_id: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._-]+$'}
                reason: {type: string, minLength: 1, maxLength: 1000}
                action:
                  type: string
                  enum: [suspend, release]
                  x-enum-varnames: [PluginGrantControlSuspend, PluginGrantControlRelease]
      responses:
        '200':
          description: Exact resulting operation grant, with a rotated fencing generation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginOperationGrant'}
        '400': {$ref: '#/components/responses/400BadRequest'}
        '403': {$ref: '#/components/responses/403Forbidden'}
        '404': {$ref: '#/components/responses/404NotFound'}
        '409': {$ref: '#/components/responses/409Conflict'}
        '503': {$ref: '#/components/responses/503ServiceUnavailable'}
  /orgs/{orgId}/plugins/{pluginId}/operations/{operationId}/modules:
    post:
      operationId: applyPluginModuleOperation
      summary: Atomically reserve, release, promote or restore the exact frozen Module set.
      tags: [Plugin]
      security: [{userIdHeader: []}]
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - {name: pluginId, in: path, required: true, schema: {type: string}}
        - {name: operationId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PluginModuleOperationRequest'}
      responses:
        '200':
          description: Durable atomic operation receipt. Replay still requires current authorization.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginModuleOperationReceipt'}
        '400': {$ref: '#/components/responses/400BadRequest'}
        '403': {$ref: '#/components/responses/403Forbidden'}
        '404': {$ref: '#/components/responses/404NotFound'}
        '409': {$ref: '#/components/responses/409Conflict'}
        '503': {$ref: '#/components/responses/503ServiceUnavailable'}
  /orgs/{orgId}/plugins/{pluginId}/operations/{operationId}/authorize:
    post:
      operationId: authorizePluginOperation
      summary: Persist or control a bounded operation using the configured service identity and original delegated command.
      tags: [Plugin]
      security: [{userIdHeader: []}]
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - {name: pluginId, in: path, required: true, schema: {type: string}}
        - {name: operationId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PluginOperationAuthorizationRequest'}
      responses:
        '200':
