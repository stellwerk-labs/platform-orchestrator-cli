        cluster:
          $ref: '#/components/schemas/K8sRunnerEksCluster'
        type:
          $ref: '#/components/schemas/RunnerType'
      required:
        - type
    K8sAgentRunnerConfigurationUpdateBody:
      description: Object to update an existing runner configuration for a Kubernetes Agent.
