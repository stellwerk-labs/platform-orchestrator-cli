openapi: 3.0.0
info:
  title: Stellwerk Control Plane API
  version: unreleased
paths:
  /plugin-packages:
    get:
      operationId: listPluginPackages
      summary: List the plugin packages known to the Plugin Manager.
      description: Platform-scoped. Requires the platform permission plugin_manager_read, held only by the operators configured in IAM; organization roles and plugin workloads never qualify. Returns 404 plugin_host_disabled while the plugin host is off.
      tags: [Plugin Manager]
      security: [{userIdHeader: []}]
      responses:
        '200':
          description: Every package at one Plugin Manager revision.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginPackagePage'}
        '403': {$ref: '#/components/responses/403Forbidden'}
        '404': {$ref: '#/components/responses/404NotFound'}
    post:
      operationId: pushPluginPackage
      summary: Register an immutable plugin package.
      description: Requires plugin_manager_write. Core validates the registration manifest; the digest names the package manifest that the plugin runtime verifies. Pushing the same digest with the same manifest again changes nothing. Every write is idempotent by key, requires the expected Plugin Manager revision and a reason, and writes one audit event in the same transaction.
      tags: [Plugin Manager]
      security: [{userIdHeader: []}]
      parameters:
        - $ref: '#/components/parameters/idempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PluginPackagePush'}
      responses:
        '201':
          description: The package as of the revision after the command.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginPackage'}
        '400': {$ref: '#/components/responses/400BadRequest'}
        '403': {$ref: '#/components/responses/403Forbidden'}
        '404': {$ref: '#/components/responses/404NotFound'}
        '409': {$ref: '#/components/responses/409Conflict'}
  /plugin-installations:
    get:
      operationId: listPluginInstallations
      summary: List the plugin installations and their organization enablements.
      description: Requires plugin_manager_read. Returns 404 plugin_host_disabled while the plugin host is off.
      tags: [Plugin Manager]
      security: [{userIdHeader: []}]
      responses:
        '200':
          description: Every installation at one Plugin Manager revision.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginInstallationPage'}
        '403': {$ref: '#/components/responses/403Forbidden'}
        '404': {$ref: '#/components/responses/404NotFound'}
    post:
      operationId: createPluginInstallation
      summary: Install a registered package.
      description: Requires plugin_manager_write. Core assigns the immutable installation UUID that entitlement grants bind to; replaying the command returns the same UUID. A plugin has at most one installation.
      tags: [Plugin Manager]
      security: [{userIdHeader: []}]
      parameters:
        - $ref: '#/components/parameters/idempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PluginInstallationCreate'}
      responses:
        '201':
          description: The installation, in state installed, as of the revision after the command.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginInstallation'}
        '400': {$ref: '#/components/responses/400BadRequest'}
        '403': {$ref: '#/components/responses/403Forbidden'}
        '404': {$ref: '#/components/responses/404NotFound'}
        '409': {$ref: '#/components/responses/409Conflict'}
  /plugin-installations/{installationId}:
    get:
      operationId: getPluginInstallation
      summary: Read one plugin installation and its organization enablements.
      description: Requires plugin_manager_read. Returns 404 plugin_host_disabled while the plugin host is off.
      tags: [Plugin Manager]
      security: [{userIdHeader: []}]
      parameters:
        - $ref: '#/components/parameters/installationIdPathParam'
      responses:
        '200':
          description: The installation at the current Plugin Manager revision.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginInstallation'}
        '403': {$ref: '#/components/responses/403Forbidden'}
        '404': {$ref: '#/components/responses/404NotFound'}
    delete:
      operationId: purgePluginInstallation
      summary: Purge an uninstalled installation.
      description: Requires plugin_manager_write. Retires the installation UUID for good; licence grants bound to it never match again, and the plugin can then be installed under a new UUID. Refused with 409 plugin_installation_state unless the installation is uninstalled. Purging a purged installation changes nothing. Core does not own plugin data; delete it through the plugin runtime before or after the purge.
      tags: [Plugin Manager]
      security: [{userIdHeader: []}]
      parameters:
        - $ref: '#/components/parameters/installationIdPathParam'
        - $ref: '#/components/parameters/idempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PluginManagerCommand'}
      responses:
        '200':
          description: The purged installation as of the revision after the command.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginInstallation'}
        '400': {$ref: '#/components/responses/400BadRequest'}
        '403': {$ref: '#/components/responses/403Forbidden'}
        '404': {$ref: '#/components/responses/404NotFound'}
        '409': {$ref: '#/components/responses/409Conflict'}
  /plugin-installations/{installationId}/upgrade:
    post:
      operationId: upgradePluginInstallation
      summary: Request the package an installation serves next.
      description: Requires plugin_manager_write. The package must be a later version of the same plugin that does not lower the migration generation and that Core can serve with the installation's origins, identities, approval policies and default approval policies (400 plugin_upgrade_invalid otherwise). Core keeps serving the current package, its registrations and every effect bound to it while the plugin runtime rolls; the next activate that reads the target digest and migration generation from the running plugin switches package and registrations atomically. The installation UUID and its licence binding never change. Requesting the served package withdraws a pending upgrade; requesting the pending target again changes nothing.
      tags: [Plugin Manager]
      security: [{userIdHeader: []}]
      parameters:
        - $ref: '#/components/parameters/installationIdPathParam'
        - $ref: '#/components/parameters/idempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PluginInstallationUpgrade'}
      responses:
        '200':
          description: The installation, with the pending upgrade, as of the revision after the command.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginInstallation'}
        '400': {$ref: '#/components/responses/400BadRequest'}
        '403': {$ref: '#/components/responses/403Forbidden'}
        '404': {$ref: '#/components/responses/404NotFound'}
        '409': {$ref: '#/components/responses/409Conflict'}
  /plugin-installations/{installationId}/identity:
    put:
      operationId: setPluginInstallationIdentity
      summary: Record the plugin service user and admission checker of an installation.
      description: Requires plugin_manager_write. Identities are recorded before activation and exist exactly when the package declares service grants. Both are IAM platform principals, which belong to no organization and hold no role. IAM must hold a workload binding of exactly the installation's plugin ID, installation UUID and the service user; otherwise Core answers 409 plugin_workload_binding_missing. A binding of a service user of an organization is refused with 409 plugin_service_user_not_platform_principal. The admission checker must be a platform principal with a static token and no workload binding; otherwise Core answers 409 plugin_admission_checker_not_platform_principal. Core asks IAM on every request, also on a replay, and records nothing when IAM refuses. Recording the same identities again changes nothing.
      tags: [Plugin Manager]
      security: [{userIdHeader: []}]
      parameters:
        - $ref: '#/components/parameters/installationIdPathParam'
        - $ref: '#/components/parameters/idempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PluginInstallationIdentity'}
      responses:
        '200':
          description: The installation as of the revision after the command.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginInstallation'}
        '400': {$ref: '#/components/responses/400BadRequest'}
        '403': {$ref: '#/components/responses/403Forbidden'}
        '404': {$ref: '#/components/responses/404NotFound'}
        '409': {$ref: '#/components/responses/409Conflict'}
  /plugin-installations/{installationId}/actions/{installationAction}:
    post:
      operationId: transitionPluginInstallation
      summary: Activate, disable, enable, uninstall or reinstall an installation.
      description: 'Requires plugin_manager_write. activate reads the running plugin''s status at /.well-known/stellwerk/plugin-status on the backend origin and serves the package registrations of an installed installation, or switches to the package of a pending upgrade, only when the plugin reports exactly the installation UUID, package digest and migration generation Core recorded; otherwise it changes nothing and answers 409 with the diagnostic plugin_status_unreachable, plugin_status_invalid, plugin_installation_mismatch, plugin_package_digest_mismatch or plugin_migration_generation_mismatch, which the installation also shows until a later read succeeds. disable keeps an active installation safety-only for every organization; enable returns it to active. uninstall removes the registrations and organization enablements, disabled ones included, returns the organization mode to selected and keeps the UUID, its licence binding and the plugin data; it is refused with 409 plugin_work_unsettled while Core holds operation grants, dispatches or Module reservations of the plugin, and has no force option. reinstall returns an uninstalled installation, with its UUID, to installed. An activation that would serve a UI route prefix another installation serves, also when it completes an upgrade, is refused with 409 plugin_registration_conflict and changes nothing. After an activation Core registers the capability declarations of the served package in IAM for every enabled organization. A step whose target state already holds changes nothing. Every Control Plane replica serves the change within its refresh interval, without a restart.'
      tags: [Plugin Manager]
      security: [{userIdHeader: []}]
      parameters:
        - $ref: '#/components/parameters/installationIdPathParam'
        - name: installationAction
          in: path
          required: true
          schema:
            type: string
            enum: [activate, disable, enable, uninstall, reinstall]
            x-enum-varnames: [PluginInstallationActionActivate, PluginInstallationActionDisable, PluginInstallationActionEnable, PluginInstallationActionUninstall, PluginInstallationActionReinstall]
        - $ref: '#/components/parameters/idempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PluginManagerCommand'}
      responses:
        '200':
          description: The installation as of the revision after the command.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginInstallation'}
        '400': {$ref: '#/components/responses/400BadRequest'}
        '403': {$ref: '#/components/responses/403Forbidden'}
        '404': {$ref: '#/components/responses/404NotFound'}
        '409': {$ref: '#/components/responses/409Conflict'}
  /plugin-installations/{installationId}/organization-mode:
    put:
      operationId: setPluginOrganizationMode
      summary: Choose whether an installation serves selected organizations or all of them.
      description: 'Requires plugin_manager_write. With mode selected the operator enables each organization. With mode all Core enables, in this command, every active organization that has no enablement of the plugin, and later every new organization inside that organization''s creation transaction, each enabled with default_timezone and default_approval_policies; afterwards Core registers the capability declarations of the served package in IAM for those organizations. Core never changes an existing enablement: a disabled enablement is the organization''s opt-out and stays disabled across mode switches and restarts, and removing an enablement is refused with 409 plugin_serves_all_organizations while the mode is all. Switching back to selected keeps every enablement as it is; organizations created afterwards are no longer enabled. The defaults apply only to enablements Core creates from then on. Mode all needs an active or disabled installation (409 plugin_installation_state otherwise); uninstall returns the installation to selected. When the installation-wide grant limits the enabled organizations (organization_limit), a switch that would enable more is refused as a whole with 409 plugin_organization_limit, and an organization created while the limit is reached is still created, without an enablement. Such an organization, and one created while the plugin host was off, is listed in pending_organizations; setting mode all again enables it. Setting the mode and defaults that already hold, with nothing pending, changes nothing.'
      tags: [Plugin Manager]
      security: [{userIdHeader: []}]
      parameters:
        - $ref: '#/components/parameters/installationIdPathParam'
        - $ref: '#/components/parameters/idempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PluginOrganizationModePut'}
      responses:
        '200':
          description: The installation as of the revision after the command.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginInstallation'}
        '400': {$ref: '#/components/responses/400BadRequest'}
        '403': {$ref: '#/components/responses/403Forbidden'}
        '404': {$ref: '#/components/responses/404NotFound'}
        '409': {$ref: '#/components/responses/409Conflict'}
  /plugin-installations/{installationId}/organizations/{orgId}:
    put:
      operationId: putPluginEnablement
      summary: Enable or disable an active installation for an organization.
      description: Requires plugin_manager_write. One installation serves every organization it is enabled for, each with its own state, timezone and deployment approval policies; changing one organization's enablement leaves the others as they are. The installation's identities belong to no organization, so enabling, changing and removing an enablement never ask IAM about them. Right after the command Core registers the capability declarations of the served package in IAM for the organization; the response shows that registration as of the command, a later read shows its result, and the enablement stands whatever IAM answers. A disabled enablement keeps the plugin safety-only in that organization and keeps its capabilities in IAM. When the installation-wide grant limits the enabled organizations, enabling one beyond the limit is refused with 409 plugin_organization_limit; disabled enablements do not count, and an organization with a grant of its own counts like every other. Enabling a resource event subscriber starts the organization's resource event journal in the same transaction. Every Core effect re-verifies the enablement in its own transaction.
      tags: [Plugin Manager]
      security: [{userIdHeader: []}]
      parameters:
        - $ref: '#/components/parameters/installationIdPathParam'
        - $ref: '#/components/parameters/orgIdPathParam'
        - $ref: '#/components/parameters/idempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PluginEnablementPut'}
      responses:
        '200':
          description: The installation as of the revision after the command.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginInstallation'}
        '400': {$ref: '#/components/responses/400BadRequest'}
        '403': {$ref: '#/components/responses/403Forbidden'}
        '404': {$ref: '#/components/responses/404NotFound'}
        '409': {$ref: '#/components/responses/409Conflict'}
    delete:
      operationId: removePluginEnablement
      summary: Remove an installation's enablement for an organization.
      description: Requires plugin_manager_write. The organization's resource event journal pauses in the same transaction when no subscriber remains; cursors issued before a later resume expire with plugin_resource_cursor_expired. Removing an absent enablement changes nothing. While the installation serves all organizations, removing an enablement is refused with 409 plugin_serves_all_organizations; disable it to opt the organization out.
      tags: [Plugin Manager]
      security: [{userIdHeader: []}]
      parameters:
        - $ref: '#/components/parameters/installationIdPathParam'
        - $ref: '#/components/parameters/orgIdPathParam'
        - $ref: '#/components/parameters/idempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PluginManagerCommand'}
      responses:
        '200':
          description: The installation as of the revision after the command.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginInstallation'}
        '400': {$ref: '#/components/responses/400BadRequest'}
        '403': {$ref: '#/components/responses/403Forbidden'}
        '404': {$ref: '#/components/responses/404NotFound'}
        '409': {$ref: '#/components/responses/409Conflict'}
  /plugin-entitlement-bundles:
    post:
      operationId: importPluginEntitlementBundle
      summary: Import signed entitlement grants and revocations.
      description: Requires plugin_manager_write. Each document must verify against the configured issuer trust. An organization grant must match exactly the installation UUID, plugin and organization of an enablement; an installation-wide grant (no organization) must match the installation UUID and plugin of an installed, active or disabled installation, also before any organization is enabled, and covers every organization without a grant of its own, including organizations created later. A higher sequence replaces the current grant of the same binding (plugin, installation and organization, or plugin and installation). A rejected document is reported and never blocks the others. Imports take effect without a restart.
      tags: [Plugin Manager]
      security: [{userIdHeader: []}]
      parameters:
        - $ref: '#/components/parameters/idempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PluginEntitlementBundleImportRequest'}
      responses:
        '200':
          description: What the bundle import changed and why documents were skipped.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginEntitlementBundleImport'}
        '400': {$ref: '#/components/responses/400BadRequest'}
        '403': {$ref: '#/components/responses/403Forbidden'}
        '404': {$ref: '#/components/responses/404NotFound'}
        '409': {$ref: '#/components/responses/409Conflict'}
  /plugin-audit-events:
    get:
      operationId: listPluginAuditEvents
      summary: Read the append-only Plugin Manager audit trail.
      description: Requires plugin_manager_read. One event per committed change, in commit order, with actor, reason, and the state before and after.
      tags: [Plugin Manager]
      security: [{userIdHeader: []}]
      parameters:
        - name: after
          in: query
          description: Return events after this event ID.
          schema: {type: integer, format: int64, minimum: 0, default: 0}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 100}
      responses:
        '200':
          description: One page of audit events.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginAuditEventPage'}
        '400': {$ref: '#/components/responses/400BadRequest'}
        '403': {$ref: '#/components/responses/403Forbidden'}
        '404': {$ref: '#/components/responses/404NotFound'}
  /orgs/{orgId}/plugins/{pluginId}/entitlement:
    get:
      operationId: getPluginEntitlement
      summary: Read this installation's current offline licence decision as its configured service.
      description: Only the exact configured plugin service identity may read this non-secret preflight, including before an operation grant exists. It exposes no issuer keys, signed documents or Core resource data. This decision never grants IAM authority and is not an execution credential; every Core effect reauthorizes independently. Missing licence and disabled states are returned explicitly so recovery can stop forward work safely.
      tags: [Plugin]
      security: [{userIdHeader: []}]
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - {name: pluginId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Current scoped plugin availability and entitlement projection, never signed evidence.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginCapability'}
        '403': {$ref: '#/components/responses/403Forbidden'}
        '404': {$ref: '#/components/responses/404NotFound'}
        '503': {$ref: '#/components/responses/503ServiceUnavailable'}
  /orgs/{orgId}/deployment-admissions/{admissionId}:
    post:
      operationId: authorizeDeploymentAdmission
      summary: Protect one ordinary Data Plane admission against concurrent Pin changes.
      description: Restricted to the Data Plane's admission identity, one IAM platform principal with a static token for every organization, which Core looks up in IAM on every call; another identity is refused with 403 deployment_admission_service_forbidden, and 503 authorization_unavailable means IAM could not answer. Rechecks the original actor's deployment permission and exact immutable scope. Persists a guard before DP commits a Deployment. No plugin capability grants access. A settled identity can never authorize another Deployment.
      tags: [Deployment admissions]
      security: [{userIdHeader: []}]
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - {name: admissionId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeploymentAdmissionRequest'}
      responses:
        '200':
          description: Exact active guard. Execution still belongs exclusively to the Data Plane.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeploymentAdmissionReceipt'}
        '400': {$ref: '#/components/responses/400BadRequest'}
        '403': {$ref: '#/components/responses/403Forbidden'}
        '404': {$ref: '#/components/responses/404NotFound'}
        '409': {$ref: '#/components/responses/409Conflict'}
        '503': {$ref: '#/components/responses/503ServiceUnavailable'}
  /orgs/{orgId}/deployment-admissions/{admissionId}/seal-absence:
    post:
      operationId: sealDeploymentAdmissionAbsence
      summary: Permanently close an uncommitted admission, including a delayed authorize request.
      description: Restricted to the Data Plane's admission identity. DP must first persist exact intent and an absent tombstone under its admission-key lock, proving no Deployment committed. Core stores an immutable absent receipt even if authorize has not arrived, or settles the exact existing active guard. A late authorize can never reopen this identity. Recovery does not recheck the original actor's permission or require a live Environment. Changed intent or a different terminal outcome conflicts. Timeout or a not-found read alone is never absence evidence.
      tags: [Deployment admissions]
      security: [{userIdHeader: []}]
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - {name: admissionId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeploymentAdmissionRequest'}
      responses:
        '200':
          description: Exact permanent absent receipt. This never creates execution authority.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeploymentAdmissionReceipt'}
        '400': {$ref: '#/components/responses/400BadRequest'}
        '403': {$ref: '#/components/responses/403Forbidden'}
        '404': {$ref: '#/components/responses/404NotFound'}
        '409': {$ref: '#/components/responses/409Conflict'}
  /orgs/{orgId}/deployment-admissions/{admissionId}/settle:
    post:
      operationId: settleDeploymentAdmission
      summary: Settle an exact ordinary admission from the authenticated Data Plane's durable outcome.
      description: Only the Data Plane's admission identity can report authoritative terminal receipt evidence. An absent outcome requires a sealed DP tombstone under the admission-key lock after transaction rollback; timeout is never evidence. The original actor need not retain permissions for safety reconciliation. Scope, request digest and completion are immutable.
      tags: [Deployment admissions]
      security: [{userIdHeader: []}]
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - {name: admissionId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [project_uuid, environment_uuid, request_digest, outcome]
              properties:
                project_uuid: {type: string, format: uuid}
                environment_uuid: {type: string, format: uuid}
                request_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
                outcome:
                  type: string
                  enum: [succeeded, failed, cancelled, terminated, absent]
                  x-enum-varnames: [AdmissionOutcomeSucceeded, AdmissionOutcomeFailed, AdmissionOutcomeCancelled, AdmissionOutcomeTerminated, AdmissionOutcomeAbsent]
      responses:
        '200':
          description: Exact immutable completion receipt.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeploymentAdmissionReceipt'}
        '400': {$ref: '#/components/responses/400BadRequest'}
        '403': {$ref: '#/components/responses/403Forbidden'}
        '404': {$ref: '#/components/responses/404NotFound'}
        '409': {$ref: '#/components/responses/409Conflict'}
  /orgs/{orgId}/plugins/{pluginId}/projects/{projectUuid}/envs/{environmentUuid}/deployments/{deploymentId}/{materialKind}:
    get:
      operationId: getPluginDeploymentMaterial
      summary: Retrieve plugin-owned Deployment material using the caller's independent Orchestrator permission.
      description: Requires current ordinary deployment_read authorization. Plugin capabilities and operation grants never authorize this endpoint. Core signs an exact immutable-scope Data Plane request; DP decrypts retained material without exposing a private key. Plugin service and admission-checker principals are explicitly denied. Historical retrieval does not depend on a live Environment or the plugin's entitlement. No material is sent through the plugin backend or invocation envelope.
      tags: [Plugin]
      security: [{userIdHeader: []}]
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - {name: pluginId, in: path, required: true, schema: {type: string}}
        - {name: projectUuid, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: environmentUuid, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: deploymentId, in: path, required: true, schema: {type: string, format: uuid}}
        - name: materialKind
          in: path
          required: true
          schema:
            type: string
            enum: [logs, outputs]
            x-enum-varnames: [PluginDeploymentMaterialLogs, PluginDeploymentMaterialOutputs]
      responses:
        '200':
          description: Original decrypted bytes, bounded to 16 MiB and returned as an attachment. Outputs retain the original JSON bytes without reserialization.
          headers:
            Content-Disposition: {schema: {type: string}}
            Cache-Control: {schema: {type: string}}
            X-Content-Type-Options: {schema: {type: string}}
          content:
            text/plain:
              schema: {type: string}
        '400': {$ref: '#/components/responses/400BadRequest'}
        '403': {$ref: '#/components/responses/403Forbidden'}
        '404': {$ref: '#/components/responses/404NotFound'}
        '409': {$ref: '#/components/responses/409Conflict'}
        '413':
          description: Material exceeds the bounded download size.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/503ServiceUnavailable'}
  /orgs/{orgId}/plugins/{pluginId}/operations/{operationId}/deployments:
    post:
      operationId: submitPluginDeployment
      summary: Admit one exact planned Deployment through the normal Data Plane path.
      description: Requires the configured plugin service, a current active operation fence and current scoped actor authorization. Core records the exact dispatch before contacting the Data Plane. Only a DP-owned immutable plan snapshot or the same operation's forward Deployment may be referenced. An uncertain response must be reconciled, never replaced with a new dispatch identity.
      tags: [Plugin]
      security: [{userIdHeader: []}]
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - {name: pluginId, in: path, required: true, schema: {type: string}}
        - {name: operationId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PluginDeploymentSubmitRequest'}
      responses:
        '200':
          description: Exact upstream status and JSON response. A non-success upstream status is not successful admission.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginInvocationResult'}
        '400': {$ref: '#/components/responses/400BadRequest'}
        '403': {$ref: '#/components/responses/403Forbidden'}
        '404': {$ref: '#/components/responses/404NotFound'}
        '409': {$ref: '#/components/responses/409Conflict'}
        '503': {$ref: '#/components/responses/503ServiceUnavailable'}
  /orgs/{orgId}/plugins/{pluginId}/operations/{operationId}/deployments/{dispatchId}/reconcile:
    post:
      operationId: reconcilePluginDeployment
      summary: Recover an exact dispatch and settle its protection only from authoritative Data Plane evidence.
      description: Does not submit Data Plane work. An original_request can recover an intent missing from Core, preserving its original fence and exact request identity separately from the current grant_fence. Active recovery revalidates normal admission authority before recording the intent. With withdraw=true, Core records or withdraws the exact non-admitting intent before waiting on the Data Plane receipt lock. Only then can authoritative absence settle an unstarted dispatch. Terminal outcomes can be recovered after suspension or entitlement expiry with current scoped authorization.
      tags: [Plugin]
      security: [{userIdHeader: []}]
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - {name: pluginId, in: path, required: true, schema: {type: string}}
        - {name: operationId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: dispatchId, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [grant_fence, withdraw]
              properties:
                grant_fence: {type: integer, format: int64, minimum: 1}
                withdraw: {type: boolean}
                original_request:
                  description: The retained original submit request, unchanged. Required only when Core has not recorded the dispatch; if supplied for a recorded dispatch it must match its immutable intent.
                  allOf:
                    - $ref: '#/components/schemas/PluginDeploymentSubmitRequest'
      responses:
        '200':
          description: Exact upstream receipt or absence, with its status. Protection remains until terminal or withdrawn-and-absent evidence is proven.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginInvocationResult'}
        '400': {$ref: '#/components/responses/400BadRequest'}
        '403': {$ref: '#/components/responses/403Forbidden'}
        '404': {$ref: '#/components/responses/404NotFound'}
        '409': {$ref: '#/components/responses/409Conflict'}
        '503': {$ref: '#/components/responses/503ServiceUnavailable'}
  /orgs/{orgId}/plugins/{pluginId}/operations/{operationId}/pins:
    post:
      operationId: applyPluginPinOperation
      summary: Apply an atomic, operation-bound Pin override or reconciliation.
      description: Begin requires a fresh explicit user command and a dedicated override capability. Reconciliation and restoration use authoritative DP receipts, not plugin assertions. This service port cannot Unpin or permanently discard protection.
      tags: [Plugin]
      security: [{userIdHeader: []}]
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - {name: pluginId, in: path, required: true, schema: {type: string}}
        - {name: operationId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PluginPinOperationRequest'}
      responses:
        '200':
          description: Atomic Pin result, retained for exact actor-bound retries.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/EnvironmentModuleVersionPin'}}
        '400': {$ref: '#/components/responses/400BadRequest'}
        '403': {$ref: '#/components/responses/403Forbidden'}
        '404': {$ref: '#/components/responses/404NotFound'}
        '409': {$ref: '#/components/responses/409Conflict'}
        '503': {$ref: '#/components/responses/503ServiceUnavailable'}
  /orgs/{orgId}/plugins/{pluginId}/operations/{operationId}/pins/receipts/{requestId}:
    get:
      operationId: getPluginPinOperationReceipt
      summary: Recover a committed Pin command result without replaying a user proof.
      description: Requires the configured plugin service, the current operation fence and the current controller's scoped permission for the recorded action. Returns the exact historical result, not live Pin state. Works after suspension or entitlement expiry; never renews authority or performs a transition. A missing receipt does not prove that a request cannot still arrive, and does not authorize a new begin command.
      tags: [Plugin]
      security: [{userIdHeader: []}]
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - {name: pluginId, in: path, required: true, schema: {type: string}}
        - {name: operationId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: requestId, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._-]+$'}}
        - {name: grant_fence, in: query, required: true, schema: {type: integer, format: int64, minimum: 1}}
      responses:
        '200':
          description: Exact committed command identity, action and Pin result.
          content:
