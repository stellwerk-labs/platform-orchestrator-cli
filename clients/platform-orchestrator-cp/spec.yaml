    InternalModuleCatalogue:
      type: object
      description: A collation of all the applicable modules, and providers for an environment. A module is applicable if there is at least one rule for it that matches the requested environment.
      required:
        - modules
        - providers
      properties:
        modules:
          type: array
          items:
            $ref: '#/components/schemas/InternalModuleCatalogueModule'
        providers:
          type: array
          items:
            $ref: '#/components/schemas/ModuleProvider'
    InternalModuleCatalogueModuleRule:
      type: object
      description: A rule within a module
      required:
        - rule_id
        - resource_class
      properties:
        rule_id:
          type: string
          format: uuid
        resource_class:
          $ref: '#/components/schemas/ResourceClass'
        resource_id:
          $ref: '#/components/schemas/ResourceId'
        project_id:
          description: The optional project id that this rule matches.
          type: string
          example: my-app
        env_type_id:
          description: The optional env type id that this rule matches.
          type: string
          example: dev
        env_id:
          description: The optional environment id that this rule matches.
          type: string
          example: my-env
    InternalModuleCatalogueModule:
      type: object
      description: A module within a catalogue
      allOf:
        - $ref: '#/components/schemas/Module'
        - required:
            - rules
            - artifact_digest
            - semantic_status
            - module_uuid
            - version_uuid
            - semantic_version
            - migration_generation
            - verification_status
          properties:
            rules:
              type: array
              items:
                $ref: '#/components/schemas/InternalModuleCatalogueModuleRule'
            artifact_digest:
              type: string
            semantic_status:
              $ref: '#/components/schemas/ModuleVersionSemanticStatus'
            module_uuid:
              type: string
              format: uuid
            version_uuid:
              type: string
              format: uuid
            semantic_version:
              type: string
              description: Canonical SemVer for managed versions; empty only for migrated v0 versions.
            migration_generation:
              type: string
              enum: [v0, v1, managed]
              description: Authoritative persisted migration provenance. External digest claims are optional for both managed and migrated versions; v0 must not acquire invented metadata.
            verification_status:
              $ref: '#/components/schemas/ModuleVerificationStatus'
    InternalModuleCatalogueGenerateBody:
      type: object
      description: The request contents to generate a module catalogue
      properties:
        pinned_module_versions:
          description: The normal response body only includes the latest versions for modules. However if there are pinned resources, we need to request the pinned versions as well which may no longer have rules associated with them.
          type: array
          items:
            description: The module id and version separated by a '@'.
            type: string
            example: my-module@01234567-89ab-cdef-0123-456789abcdef
          x-go-type-skip-optional-pointer: true
        pinned_providers:
          description: The normal response body only includes the latest versions for modules. However if there are pinned resources, we need to request providers retained by the previous graph.
          type: array
          items:
            description: The provider type and id separated by a '.'.
            type: string
            example: aws.default
          x-go-type-skip-optional-pointer: true
        are_rules_ignored:
          description: When running a destroy deployment, only pinned module versions are required and rule evaluation is skipped.
          type: boolean
          example: false
          x-go-type-skip-optional-pointer: true
