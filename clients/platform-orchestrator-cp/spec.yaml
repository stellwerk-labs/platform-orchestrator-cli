          description: Current IAM decision. A denial discloses no subject metadata.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginAuthorizationCheckResult'}
        '400': {$ref: '#/components/responses/400BadRequest'}
        '403': {$ref: '#/components/responses/403Forbidden'}
        '404': {$ref: '#/components/responses/404NotFound'}
        '409': {$ref: '#/components/responses/409Conflict'}
        '503': {$ref: '#/components/responses/503ServiceUnavailable'}
  /orgs/{orgId}/plugins/{pluginId}/operations/{operationId}:
    get:
      operationId: getPluginOperationGrant
      summary: Recover persisted operation bounds using the configured plugin service identity.
      description: Read-only recovery does not renew or activate the grant and grants no authority to execute it.
      tags: [Plugin]
      security: [{userIdHeader: []}]
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - {name: pluginId, in: path, required: true, schema: {type: string}}
        - {name: operationId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Current immutable operation bounds and fencing generation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginOperationGrant'}
        '403': {$ref: '#/components/responses/403Forbidden'}
        '404': {$ref: '#/components/responses/404NotFound'}
  /orgs/{orgId}/plugins/{pluginId}/operations/{operationId}/resource-events:
    get:
      operationId: readPluginResourceEvents
      tags: [Plugin]
      security: [{userIdHeader: []}]
      description: Read durable Core resource metadata within a frozen operation. Only the configured plugin service may call; current controller authorization is required, including during safety recovery. Cursors are opaque and scoped to this operation. Presenting a cursor acknowledges every event up to it, so present only a cursor whose effects are committed. Without a cursor, reading starts at the oldest retained event. Core prunes events that are older than its retention window and acknowledged by every active consumer; a cursor before the pruned history returns 409 plugin_resource_cursor_expired.
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - {name: pluginId, in: path, required: true, schema: {type: string}}
        - {name: operationId, in: path, required: true, schema: {type: string, format: uuid}}
        - name: after
          in: query
          schema: {type: string, maxLength: 2048}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 100}
      responses:
        '200':
          description: Commit-ordered metadata and the next durable cursor. No definitions, notes, logs or outputs.
          content:
            application/json:
              schema:
                type: object
                required: [events, next_cursor, organization_timezone]
                properties:
                  events:
                    type: array
                    items: {$ref: '#/components/schemas/PluginResourceEvent'}
                  next_cursor: {type: string}
                  organization_timezone: {type: string}
        '400': {$ref: '#/components/responses/400BadRequest'}
        '403': {$ref: '#/components/responses/403Forbidden'}
        '404': {$ref: '#/components/responses/404NotFound'}
        '409': {$ref: '#/components/responses/409Conflict'}
  /orgs/{orgId}/plugins/{pluginId}/operations/{operationId}/inventory:
    get:
      operationId: readPluginOperationInventory
      tags: [Plugin]
      security: [{userIdHeader: []}]
      description: Read, without a user, the current inventory of exactly the frozen Modules and Environments of an operation, for example to resynchronise after plugin_resource_cursor_expired. Only the configured plugin service may call. The frozen operation must delegate inventory.read, the operator must register that service grant, and the operation's controller must still pass current scoped IAM checks. Prepared, active and suspended operations may read, matching the resource journal, and released ones for one journal retention window after their release. Contains no Module source, provider configuration or secrets.
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - {name: pluginId, in: path, required: true, schema: {type: string}}
        - {name: operationId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: One repeatable-read snapshot of the operation scope.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginInventory'}
        '403': {$ref: '#/components/responses/403Forbidden'}
        '404': {$ref: '#/components/responses/404NotFound'}
        '409': {$ref: '#/components/responses/409Conflict'}
  /orgs/{orgId}/plugins/{pluginId}/operations/{operationId}/events:
    post:
      operationId: publishPluginEvent
      tags: [Plugin]
      security: [{userIdHeader: []}]
      description: Idempotently publish an event through the Core transactional outbox. The event type is plugin.<immutable-plugin-id>.<local-name>, with one non-dotted local name such as rollout-completed, preventing impersonation of Core or nested plugin namespaces. Broker delivery uses io.platform-orchestrator.<event-type> in the existing platform stream without changing the CloudEvent type or payload. Delivery is at least once; consumers deduplicate by event_id. Never include secret values or deployment material.
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - {name: pluginId, in: path, required: true, schema: {type: string}}
        - {name: operationId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [event_id, grant_fence, type, occurred_at, data]
              properties:
                event_id: {type: string, format: uuid}
                grant_fence: {type: integer, format: int64, minimum: 1}
                type: {type: string, minLength: 1, maxLength: 200}
                occurred_at: {type: string, format: date-time}
                data: {type: object, additionalProperties: true}
      responses:
        '204': {description: 'Publication durably accepted, or the exact receipt replayed.'}
        '400': {$ref: '#/components/responses/400BadRequest'}
        '403': {$ref: '#/components/responses/403Forbidden'}
        '404': {$ref: '#/components/responses/404NotFound'}
        '409': {$ref: '#/components/responses/409Conflict'}
  /orgs/{orgId}/plugins/{pluginId}/operations/{operationId}/control:
    post:
      operationId: controlPluginOperationGrant
      summary: Suspend or release existing delegated operation authority without replaying a human request.
      description: Configured plugin service only. The existing frozen intent and operator policy must both delegate the requested action. Core derives the current controller from its grant and rechecks scoped IAM. Only suspend and release are allowed; this route never prepares, expands or reactivates authority. Exact request ID, fence, action and reason are idempotent. Safety control remains available after disablement or entitlement expiry; incompatible and unavailable installations fail closed. Releasing a grant does not remove Deployment barriers or pending Pin protection.
      tags: [Plugin]
      security: [{userIdHeader: []}]
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - {name: pluginId, in: path, required: true, schema: {type: string}}
        - {name: operationId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [grant_fence, request_id, action, reason]
              properties:
                grant_fence: {type: integer, format: int64, minimum: 1}
                request_id: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._-]+$'}
                reason: {type: string, minLength: 1, maxLength: 1000}
                action:
                  type: string
                  enum: [suspend, release]
                  x-enum-varnames: [PluginGrantControlSuspend, PluginGrantControlRelease]
      responses:
        '200':
          description: Exact resulting operation grant, with a rotated fencing generation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginOperationGrant'}
        '400': {$ref: '#/components/responses/400BadRequest'}
        '403': {$ref: '#/components/responses/403Forbidden'}
        '404': {$ref: '#/components/responses/404NotFound'}
        '409': {$ref: '#/components/responses/409Conflict'}
        '503': {$ref: '#/components/responses/503ServiceUnavailable'}
