      security:
        - userIdHeader: []
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - $ref: '#/components/parameters/ruleIdPathParam'
      responses:
        '204':
          description: Successful delete response.
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409Conflict'
  /internal/orgs/{orgId}/projects/{projectId}/envs/{envId}/module-catalogue:
    post:
      operationId: generateInternalModuleCatalogue
      tags:
        - internal
      summary: An internal API to get all of the modules, rules, and providers that match an environment as well as any declared pinned versions.
      security:
        - userIdHeader: []
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - $ref: '#/components/parameters/projectIdPathParam'
        - $ref: '#/components/parameters/envIdPathParam'
        - name: X-Stellwerk-Rollback
          in: header
          required: false
          schema: {type: boolean, default: false}
          description: Internal audited exception allowing retained Deprecated or Defective artifacts during rollback.
        - name: X-Stellwerk-Module-Operation-Id
          in: header
          required: false
          schema: {type: string, format: uuid}
          description: Exact add-on operation allowed to consume its own override-pending Pin target.
        - name: X-Stellwerk-Module-Operation-Planning
          in: header
          required: false
          schema: {type: boolean, default: false}
          description: Internal dry-run compilation for an add-on Module operation. It does not mutate or override Core Pins.
        - name: X-Stellwerk-Restricted-Version-Confirmations
          in: header
          required: false
          style: simple
          explode: false
          schema:
            type: array
            items: {type: string, format: uuid}
          description: Exact Defective Module Version UUIDs confirmed by an authorised deployment caller.
        - name: X-Stellwerk-Active-Module-Versions
          in: header
          required: false
          style: simple
          explode: false
          schema:
            type: array
            items: {type: string}
          description: Exact Module coordinates observed in the Environment's last graph. This evidence permits an archived Module to carry forward only the version already active there.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalModuleCatalogueGenerateBody'
      responses:
        '200':
          description: Successful get response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalModuleCatalogue'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409Conflict'
components:
  securitySchemes:
    userIdHeader:
      type: apiKey
      in: header
      name: From
  parameters:
    orgIdPathParam:
      name: orgId
      in: path
      description: The Organization ID
      example: 'sample-org'
      required: true
      schema:
        type: string
    installationIdPathParam:
      name: installationId
      in: path
      description: The Core-assigned plugin installation UUID
      required: true
      schema: {type: string, format: uuid}
    idempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable caller-generated key used to deduplicate command retries.
      schema: {type: string, minLength: 8, maxLength: 200}
    projectIdPathParam:
      name: projectId
      in: path
      description: The Project ID
      example: 'sample-project'
      required: true
      schema:
        type: string
    projectUuidPathParam:
      name: projectUuid
      in: path
      description: The Project UUID
      example: '01234567-89ab-cdef-0123-456789abcdef'
      required: true
      schema:
        type: string
        format: uuid
    envIdPathParam:
      name: envId
      in: path
      description: The Environment ID
      example: 'sample-env'
      required: true
      schema:
        type: string
    envUuidPathParam:
      name: envUuid
      in: path
      description: The Environment UUID
      example: '01234567-89ab-cdef-0123-456789abcdef'
      required: true
      schema:
        type: string
        format: uuid
    envTypeIdPathParam:
      name: envTypeId
      in: path
      description: The Environment Type ID
      example: 'development'
      required: true
      schema:
        type: string
    resourceTypeIdPathParam:
      name: typeId
      in: path
      description: The Resource Type
      example: 's3'
      required: true
      schema:
        type: string
    providerIdPathParam:
      name: providerId
      in: path
      description: The Module Provider ID
      example: 'my-aws-provider'
      required: true
      schema:
        type: string
    providerTypePathParam:
      name: providerType
      in: path
      description: The Module Provider Type
      example: 'aws'
      required: true
      schema:
        type: string
    moduleIdPathParam:
      name: moduleId
      in: path
      description: A Module ID
      example: 'my-s3-module'
      required: true
      schema:
        type: string
    moduleVersionIdPathParam:
      name: moduleVersionId
      in: path
      description: A Module Version ID
      example: 2.4.0
      required: true
      schema:
        type: string
    ruleIdPathParam:
      name: ruleId
      in: path
      description: A Module Rule ID
      example: 01234567-89ab-cdef-0123-456789abcdef
      required: true
      schema:
        type: string
        format: uuid
    runnerIdPathParam:
      name: runnerId
      in: path
      description: A Runner ID
      example: my-k8s-runner
      required: true
      schema:
        type: string
    perPageQueryParam:
      name: per_page
      in: query
      description: The maximum number of items to return in a page of results
      required: false
      example: 50
      schema:
        type: integer
    pageTokenQueryParam:
      name: page
      in: query
      description: The page token to request from
      required: false
      example: 'AAAAAAAAAA=='
      schema:
        type: string
    dryRunQueryParam:
      name: dry_run
      in: query
      description: If true, the request will not make any changes to the system, but will return what would have been done.
      required: false
      schema:
        type: boolean
        default: false
    resourceTypeIdQueryParam:
      name: type_id
      in: query
      description: Filter by resource type id.
      example: 's3'
      schema:
        type: string
      required: false
    includeNonDeveloperAccessibleQueryParam:
      name: include_non_developer_accessible
      in: query
      description: If true, the list will include resources that are not accessible to developers.
      required: false
      schema:
        type: boolean
        default: false
    forceQueryParam:
      name: force
      in: query
      description: If true, will perform force deletion, without destroying underlying infrastructure.
      required: false
      schema:
        type: boolean
        default: false
  responses:
    503ServiceUnavailable:
      description: The installed plugin cannot currently serve this request.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    400BadRequest:
      description: The request was invalid. More detail can be found in the error body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    401Unauthorized:
      description: The client didn't provide valid authentication credentials.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    403Forbidden:
      description: Server understands the request but refuses to authorize it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    404NotFound:
      description: The request was valid, but the target resource or relation does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    409Conflict:
      description: The request conflicts with existing state in the system.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    PluginManagerCommand:
      type: object
      additionalProperties: false
      required: [expected_revision, reason]
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 0
          description: The Plugin Manager revision the operator decided on. A write against another revision fails with 409 plugin_manager_revision_conflict; read the current state and retry.
        reason: {type: string, minLength: 1, maxLength: 1000, description: Why the change is made. Recorded in the audit event.}
    PluginPackagePush:
      type: object
      additionalProperties: false
      required: [expected_revision, reason, manifest_sha256, manifest]
      properties:
        expected_revision: {type: integer, format: int64, minimum: 0}
        reason: {type: string, minLength: 1, maxLength: 1000}
        manifest_sha256: {type: string, pattern: '^[0-9a-f]{64}$', description: SHA-256 of the package manifest the plugin runtime verifies.}
        manifest:
          type: object
          description: The registration manifest of the package (identity, migration generation, capabilities, operations, UI contribution, service grants, authorization policies, entitlement declaration). Unknown fields are rejected. migration_generation is the plugin-owned schema generation the package runs on, 0 or absent while the plugin owns no schema. Each capability is declared once and in the plugin's own namespace, as an object with id (plugin.<plugin ID>.<name> with a one-segment name of lowercase letters, digits and inner hyphens, at most 255 characters in all), display_name, description, category, level (read, write or manage) and scopes (organization, project, environment); each operation is declared once and none in Core's host namespace (core., iam.); the UI route_prefix is a slash followed by lowercase segments without a trailing slash, its only spelling.
          x-go-type: json.RawMessage
    PluginPackage:
      type: object
      required: [manifest_sha256, plugin_id, version, manifest, created_at, created_by]
      properties:
        revision: {type: integer, format: int64, description: The Plugin Manager revision this response reflects.}
        manifest_sha256: {type: string}
        plugin_id: {type: string}
        version: {type: string}
        manifest:
          type: object
          x-go-type: json.RawMessage
        created_at: {type: string, format: date-time}
        created_by: {type: string, format: uuid}
    PluginPackagePage:
      type: object
      required: [revision, items]
      properties:
        revision: {type: integer, format: int64}
        items:
          type: array
          items: {$ref: '#/components/schemas/PluginPackage'}
    PluginInstallationCreate:
      type: object
      additionalProperties: false
      required: [expected_revision, reason, package_sha256, backend_url]
      properties:
        expected_revision: {type: integer, format: int64, minimum: 0}
        reason: {type: string, minLength: 1, maxLength: 1000}
        package_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        backend_url: {type: string, description: Origin of the plugin backend. HTTPS outside explicit development mode.}
        ui_origin: {type: string, description: 'Origin of the plugin UI. Required exactly when the package contributes a UI.'}
    PluginInstallationUpgrade:
      type: object
      additionalProperties: false
      required: [expected_revision, reason, package_sha256]
      properties:
        expected_revision: {type: integer, format: int64, minimum: 0}
        reason: {type: string, minLength: 1, maxLength: 1000}
        package_sha256: {type: string, pattern: '^[0-9a-f]{64}$', description: A registered package of the same plugin.}
    PluginInstallationIdentity:
      type: object
      additionalProperties: false
      required: [expected_revision, reason, service_user_id, admission_checker_id]
      properties:
        expected_revision: {type: integer, format: int64, minimum: 0}
        reason: {type: string, minLength: 1, maxLength: 1000}
        service_user_id: {type: string, format: uuid, description: The platform principal IAM binds to the plugin workload of this installation.}
        admission_checker_id: {type: string, format: uuid, description: 'The Data Plane admission checker, a platform principal with a static token.'}
    PluginEnablementPut:
      type: object
      additionalProperties: false
      required: [expected_revision, reason, state]
      properties:
        expected_revision: {type: integer, format: int64, minimum: 0}
        reason: {type: string, minLength: 1, maxLength: 1000}
        state:
          type: string
          enum: [enabled, disabled]
          x-enum-varnames: [PluginEnablementPutStateEnabled, PluginEnablementPutStateDisabled]
        timezone: {type: string, description: IANA timezone of the organization for calendar policies. Omitted means UTC.}
        approval_policies:
          type: object
          description: Deployment approval scope (environment or project) to an authorization policy the package owns. They apply to approvals in this organization only.
          additionalProperties: {type: string}
    PluginOrganizationModePut:
      type: object
      additionalProperties: false
      required: [expected_revision, reason, mode]
      properties:
        expected_revision: {type: integer, format: int64, minimum: 0}
        reason: {type: string, minLength: 1, maxLength: 1000}
        mode: {$ref: '#/components/schemas/PluginOrganizationMode'}
        default_timezone: {type: string, description: IANA timezone of every enablement Core creates. Omitted means UTC.}
        default_approval_policies:
          type: object
          description: Deployment approval scope (environment or project) to an authorization policy the package owns, for every enablement Core creates. Omitted means none.
          additionalProperties: {type: string}
    PluginOrganizationMode:
      type: string
      description: selected while the operator enables each organization; all while Core enables every organization, existing and created later, except those whose enablement is disabled.
      enum: [selected, all]
      x-enum-varnames: [PluginOrganizationModeSelected, PluginOrganizationModeAll]
    PluginOrganizationDefaults:
      type: object
      description: The timezone and approval policies of every enablement Core creates on its own. Changing them changes no existing enablement.
      required: [timezone, approval_policies]
      properties:
        timezone: {type: string}
        approval_policies:
          type: object
          additionalProperties: {type: string}
    PluginInstallation:
      type: object
      required: [installation_id, plugin_id, package_sha256, state, availability, backend_url, organization_mode, organization_defaults, organizations, created_at, created_by, updated_at, updated_by]
      properties:
        revision: {type: integer, format: int64, description: The Plugin Manager revision this response reflects.}
        installation_id: {type: string, format: uuid}
        plugin_id: {type: string}
        package_sha256: {type: string, description: The package Core serves.}
        target_package_sha256: {type: string, description: The package of a pending upgrade. Core serves package_sha256 until an activate reads this digest from the running plugin.}
        state:
          type: string
          enum: [installed, active, disabled, uninstalled, purged]
          x-enum-varnames: [PluginInstallationStateInstalled, PluginInstallationStateActive, PluginInstallationStateDisabled, PluginInstallationStateUninstalled, PluginInstallationStatePurged]
        availability:
          description: Derived from the state, never set. available while active, not_enabled (safety-only) while disabled, unavailable while installed and not yet proven by the running plugin, not_installed once uninstalled or purged.
          allOf:
            - $ref: '#/components/schemas/PluginAvailabilityState'
        diagnostic: {$ref: '#/components/schemas/PluginInstallationDiagnostic'}
        observation: {$ref: '#/components/schemas/PluginStatusObservation'}
        backend_url: {type: string}
        ui_origin: {type: string}
        service_user_id: {type: string, format: uuid}
        admission_checker_id: {type: string, format: uuid}
        organization_mode: {$ref: '#/components/schemas/PluginOrganizationMode'}
        organization_defaults: {$ref: '#/components/schemas/PluginOrganizationDefaults'}
        organizations:
          type: array
          description: Every organization the installation is enabled for, ordered by organization ID.
          items: {$ref: '#/components/schemas/PluginEnablement'}
        entitlement: {$ref: '#/components/schemas/PluginInstallationEntitlement'}
        pending_organizations:
          type: array
          description: Only in organization mode all, absent when empty. The active organizations without an enablement, ordered by ID, which Core could not enable when they were created because the plugin host was off or the installation-wide grant's organization limit was reached. Setting mode all again enables them.
          items: {type: string}
        created_at: {type: string, format: date-time}
        created_by: {type: string, format: uuid}
        updated_at: {type: string, format: date-time}
        updated_by: {type: string, format: uuid}
    PluginInstallationDiagnostic:
      type: object
      description: Why the last status read from the running plugin does not prove the package Core is to serve (the pending upgrade's, if any). Absent while it does or before Core read it.
      required: [code, message]
      properties:
        code:
          type: string
          enum: [plugin_status_unreachable, plugin_status_invalid, plugin_installation_mismatch, plugin_package_digest_mismatch, plugin_migration_generation_mismatch]
          x-enum-varnames: [PluginDiagnosticStatusUnreachable, PluginDiagnosticStatusInvalid, PluginDiagnosticInstallationMismatch, PluginDiagnosticPackageDigestMismatch, PluginDiagnosticMigrationGenerationMismatch]
        message: {type: string}
    PluginStatusObservation:
      type: object
      description: What Core last read from the running plugin's status endpoint, on activation. Either the report or a failure with its detail.
      required: [observed_at]
      properties:
        observed_at: {type: string, format: date-time}
        failure:
          type: string
          enum: [plugin_status_unreachable, plugin_status_invalid]
          x-enum-varnames: [PluginStatusFailureUnreachable, PluginStatusFailureInvalid]
        detail: {type: string, description: The cause of a failure.}
        installation_id: {type: string, format: uuid, description: The installation UUID the plugin reported.}
        package_sha256: {type: string, description: The package digest the plugin reported.}
        migration_generation: {type: integer, format: int64, minimum: 0, description: The migration generation applied in the plugin database.}
    PluginCapabilityRegistration:
      type: object
      description: Whether IAM holds the capability declarations of the served package for the organization. Core registers them right after the organization is enabled and after every activation, and at start-up and every minute compares every enabled organization's catalogue in IAM with the served package and replaces only what drifted. Disabling or removing an enablement keeps the catalogue in IAM.
      required: [state]
      properties:
        state:
          type: string
          enum: [registered, pending, failed]
          x-enum-varnames: [PluginCapabilityRegistrationStateRegistered, PluginCapabilityRegistrationStatePending, PluginCapabilityRegistrationStateFailed]
          description: registered once Core registered or confirmed the served package's declarations; pending until Core reconciled the served package for the organization, for example right after an upgrade switched it; failed when Core's last attempt for the served package failed, which Core retries.
        package_sha256: {type: string, description: The package Core last reconciled for the organization.}
        reconciled_at: {type: string, format: date-time, description: When Core last reconciled the organization.}
        detail: {type: string, description: Why the last attempt failed.}
