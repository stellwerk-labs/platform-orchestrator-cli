            $ref: "#/components/schemas/UserMembershipRequest"

    UserMembershipRequest:
      description: A single membership request for a user
      required:
        - subject_type
        - subject
      properties:
        subject_type:
          description: The membership subject type.
          allOf:
            - $ref: "#/components/schemas/SubjectType"
        subject:
          description: The membership subject identity.
          type: string
        scope:
          description: The membership scope if applicable composed by <resource-kind>:<resource-id>. It will be empty for organization level memberships.
          type: string
          example: project:01234567-89ab-cdef-0123-456789abcdef

    InternalAuthorizeBody:
      description: An authorization request by a backend service.
      required:
        - user_id
        - checks
      properties:
        user_id:
          description: The user id we are checking against. Human or service token.
          type: string
          format: uuid
        checks:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ResourcePermissionCheck"

    ResourcePermissionCheck:
      required:
        - resource
        - permission
      properties:
        resource:
          description: The resource to check permissions on; platform for a platform-level permission.
          type: string
          pattern: ^(platform|(organization|project|env):[a-zA-Z0-9/_|\-=+]+)$
          x-pattern-error: 'resource must be platform, organization:<id>, project:<id>, or env:<id> where id matches regex pattern: ^[a-zA-Z0-9/_|\-=+]+$'
        permission:
          description: The complete permission ID, including the namespace for a registered plugin capability. Accepting an ID does not grant it; current scope and registration are checked by the authorizer.
          type: string
          maxLength: 255
          pattern: ^[a-z][a-z0-9_.-]{1,253}[a-z0-9]$
          x-pattern-error: "permission must be a lowercase permission ID of 3 to 255 characters"

    ResourcePermissionCheckResult:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ResourcePermissionCheckResultItem"

    ResourcePermissionCheckResultItem:
      required:
        - permission_check
        - allowed
      properties:
        permission_check:
          $ref: "#/components/schemas/ResourcePermissionCheck"
        allowed:
          description: True if the user owns this permission, false otherwise.
          type: boolean

    ServiceUserSummary:
