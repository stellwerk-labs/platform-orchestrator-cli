          type: string
        created_at:
          description: The time the session token was created
          type: string
          format: date-time
        expires_at:
          description: The time the session token expires
          type: string
          format: date-time
        provider:
          description: The login provider used for this session
          type: string
        client_ip:
          description: The client IP that requested the session
          type: string
        client_city:
          description: The closest city associated with the client ip that requested the session
          type: string
        client_region:
          description: The region associated with the client ip that requested the session
          type: string

    UserSessionTokenPage:
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserSessionTokenSummary"

    InvitationSummary:
      description: Summary details of an invitation for this organization.
      required:
        - id
        - created_at
        - expires_at
        - created_by
        - created_by_display_name
        - email_address
        - membership_subject_type
        - membership_subject
      properties:
        id:
          description: The invitation id.
          type: string
          format: uuid
        created_at:
          description: When the invitation was generated and sent.
          type: string
          format: date-time
        expires_at:
          description: When the invitation expires and must be sent again. By default, invitations are only valid for 7 days until they must be resent.
          type: string
          format: date-time
        created_by:
          description: The user id that created the invitation.
          type: string
          format: uuid
        created_by_display_name:
          description: The display name of the user who created the invitation.
          type: string
          example: User Name
        created_by_primary_email_address:
          description: The primary email address of the user who created the invitation.
          type: string
          example: user@example.com
        email_address:
          description: The email address this invitation was sent too.
          type: string
        membership_subject_type:
          description: The membership subject type that the invitation is valid for.
          allOf:
            - $ref: "#/components/schemas/SubjectType"
        membership_subject:
          description: The membership subject that the invitation is valid for
          type: string

    InvitationPage:
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/InvitationSummary"

    InvitationCreateBody:
      description: Details required to create an invitation.
      required:
        - email_address
        - membership_subject_type
        - membership_subject
      properties:
        email_address:
          description: The email address this invitation was sent too.
          type: string
          example: bob@email.com
          minLength: 3
          maxLength: 320
          pattern: ^[^\p{Cc}\p{Cs}\p{Cf}\p{Z}]+$
          x-pattern-error: email_address contains invalid characters
        membership_subject_type:
          description: The membership subject type that the invitation is valid for.
          allOf:
            - $ref: "#/components/schemas/SubjectType"
        membership_subject:
          description: The membership subject that the invitation is valid for
          type: string
          example: owners
        expiry_in_days:
          description: The expiry period for this invitation in days. Defaults to 7 days.
          type: integer
          minimum: 1
          example: 7

    SubjectType:
      type: string
      enum:
        - role
        - virtual-group

    DeviceLoginCreateBody:
      type: object

    BaseDeviceLoginRequest:
      required:
        - id
        - created_at
        - expires_at
      properties:
        id:
          description: The id of the device login request
          type: string
          format: uuid
        created_at:
          description: The time at which the device login request was created.
          type: string
          format: date-time
        expires_at:
          description: The time at which this device login request will expire.
          type: string
          format: date-time

    CreatedDeviceLoginRequest:
      allOf:
        - $ref: "#/components/schemas/BaseDeviceLoginRequest"
        - description: The response returned to the device that requested login
          required:
            - polling_token
            - approval_url
            - code
          properties:
            polling_token:
              description: The token that can be used to poll the pending device login until verified.
              type: string
            approval_url:
              description: The url the user should go to to approve this device login.
              type: string
            code:
              description: The short code associated with this device login
              type: string

    AcceptedDeviceLoginRequest:
      allOf:
        - $ref: "#/components/schemas/BaseDeviceLoginRequest"
        - description: The response returned to the device when the user accepts the device login
          required:
            - token
            - token_expires_at
          properties:
            token:
              description: The authorization bearer token for the device
              type: string
            token_expires_at:
              description: The time at which the bearer token with expire.
              type: string
              format: date-time

    DeviceLoginRequest:
      allOf:
        - $ref: "#/components/schemas/BaseDeviceLoginRequest"
        - description: The response returned to the user in the UI.
          required:
            - user_agent
          properties:
            user_agent:
              description: The user agent string associated with the device that requested login
              type: string
            client_ip:
              description: The client IP that requested the session
              type: string
            client_city:
              description: The closest city associated with the client ip that requested the session
              type: string
            client_region:
              description: The region associated with the client ip that requested the session
              type: string

    SsoLoginCreateBody:
      required:
        - org_id
      properties:
        org_id:
          type: string

    SsoLoginResponse:
      required:
        - redirect_url
      properties:
        redirect_url:
          type: string

    RolePage:
      description: A page of roles
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        next_page_token:
          type: string
          description: The page token to use to request the next page of items

    Role:
      description: A role within an organization that can be assigned to users or service users.
      required:
        - id
        - display_name
        - created_at
        - created_by
        - permissions
        - is_system
      properties:
        id:
          description: The role id
          type: string
          format: uuid
          example: 01234567-89ab-cdef-0123-456789abcdef
        display_name:
          description: The name of the role
          type: string
          example: Admin
        created_at:
          description: The time the role was created
          type: string
          format: date-time
        created_by:
          description: The user id that created the role.
          type: string
          format: uuid
        permissions:
          description: The list of permissions associated with this role.
          type: array
          items:
            type: string
        is_system:
          description: True for immutable built-in roles.
          type: boolean

    RoleWriteBody:
      description: The complete configurable state of an organization role. PUT replaces both the display name and the full permission list. Use GET /orgs/{orgId}/permissions to discover valid permission identifiers.
      required:
        - display_name
        - permissions
      properties:
        display_name:
          type: string
          minLength: 2
          maxLength: 100
          pattern: ^[^\p{Cc}\p{Cs}\p{Z}\n]( |[^\p{Cc}\p{Cs}\p{Z}\n])*[^\p{Cc}\p{Cs}\p{Z}\n]$
          x-pattern-error: display_name contains invalid characters
        permissions:
          description: Granular permission identifiers returned by the permission catalog. Include both read and write permissions when the role needs both capabilities.
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            maxLength: 255
            pattern: ^[a-z][a-z0-9_.-]{1,253}[a-z0-9]$

    ScimGroupMappingPage:
      description: The SCIM group-to-role mappings configured for an organization.
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ScimGroupMapping"

    ScimGroupMapping:
      description: Grants members of the named SCIM group the mapped role. The group display name is matched case-insensitively against synced SCIM groups.
      required:
        - group_display_name
        - role_id
        - created_at
      properties:
        group_display_name:
          description: The SCIM group display name, stored as configured.
          type: string
          example: Platform Engineers
        role_id:
          description: The id of the role granted to the group's members.
          type: string
          format: uuid
          example: 01234567-89ab-cdef-0123-456789abcdef
        created_at:
          description: The time the mapping was first created.
          type: string
          format: date-time

    ScimGroupMappingWriteBody:
      description: The role a SCIM group's members should hold.
      required:
        - role_id
      properties:
        role_id:
          description: The id of a role in this organization.
          type: string
          format: uuid

    PermissionDefinitionPage:
      description: The authoritative catalog of granular permissions assignable to configurable roles.
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PermissionDefinition"

    PermissionDefinition:
      description: A granular Platform Orchestrator permission.
      required:
        - id
        - display_name
        - description
        - category
        - level
        - scopes
      properties:
        id:
          description: The exact identifier to include in a role permissions array.
          type: string
          example: module_write
        display_name:
          type: string
          example: Manage modules
        description:
          type: string
          example: Create, update, and delete modules.
        category:
          description: A stable human-readable group for permission selection interfaces.
          type: string
          example: Modules
        level:
          description: The legacy access class used to preserve the behavior of built-in roles.
          type: string
          enum:
            - read
            - write
            - manage
        scopes:
          description: The role assignment scopes where this permission is effective.
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
              - organization
              - project
              - environment

    PluginCapabilityRegistrationBody:
      description: The complete human-role capability catalog for one installed plugin. An empty array unregisters every capability for the plugin.
      required:
        - capabilities
      properties:
        capabilities:
          type: array
          maxItems: 128
          uniqueItems: true
          items:
            $ref: "#/components/schemas/PluginCapabilityRegistration"

    PluginCapabilityRegistration:
      description: A plugin-owned permission definition. The name is a flat slug local to the plugin namespace; dots are forbidden so the full identifier has one unambiguous plugin/local boundary.
      required:
        - name
        - display_name
        - description
        - category
        - level
        - scopes
      properties:
        name:
          type: string
          maxLength: 128
          pattern: ^[a-z](?:[a-z0-9-]*[a-z0-9])?$
        display_name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          minLength: 1
          maxLength: 500
        category:
          type: string
          minLength: 1
          maxLength: 100
        level:
          type: string
          enum:
            - read
            - write
            - manage
          x-enum-varnames:
            - PluginCapabilityRegistrationLevelRead
            - PluginCapabilityRegistrationLevelWrite
            - PluginCapabilityRegistrationLevelManage
        scopes:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            enum:
              - organization
              - project
              - environment
            x-enum-varnames:
              - PluginCapabilityRegistrationScopesOrganization
              - PluginCapabilityRegistrationScopesProject
              - PluginCapabilityRegistrationScopesEnvironment

    PluginWorkloadTokenExchangeRequest:
      description: An RFC 8693 token exchange request. Only a Kubernetes ServiceAccount JWT is accepted as subject token.
      type: object
      additionalProperties: false
      required:
        - grant_type
        - subject_token
        - subject_token_type
      properties:
        grant_type:
          type: string
          enum:
            - urn:ietf:params:oauth:grant-type:token-exchange
          x-enum-varnames:
            - PluginWorkloadTokenExchangeGrantType
        subject_token:
          description: The projected ServiceAccount token of the plugin workload.
          type: string
          minLength: 1
          maxLength: 16384
        subject_token_type:
          type: string
          enum:
            - urn:ietf:params:oauth:token-type:jwt
          x-enum-varnames:
            - PluginWorkloadSubjectTokenTypeJWT

    PluginWorkloadTokenExchangeResponse:
      description: An RFC 8693 token exchange response carrying an opaque plugin workload token.
      type: object
      required:
        - access_token
        - issued_token_type
        - token_type
        - expires_in
      properties:
        access_token:
          description: The opaque plugin workload token. Present it as a Bearer token.
          type: string
        issued_token_type:
          type: string
          enum:
            - urn:ietf:params:oauth:token-type:access_token
          x-enum-varnames:
            - PluginWorkloadIssuedTokenTypeAccessToken
        token_type:
          type: string
          enum:
            - Bearer
          x-enum-varnames:
            - PluginWorkloadTokenTypeBearer
        expires_in:
          description: Lifetime of the issued token in seconds.
          type: integer
          minimum: 1
          maximum: 900

    PluginWorkloadBindingCreateBody:
      description: >-
        Binds one Kubernetes ServiceAccount of one cluster issuer to the platform principal of a plugin installation.
        Exactly one of platform_principal and service_user_id is required.
      type: object
      additionalProperties: false
      required:
        - issuer
        - namespace
        - service_account
        - audience
        - plugin_id
        - installation_id
      properties:
        issuer:
          description: The cluster's ServiceAccount token issuer. Must equal the issuer configured in IAM.
          type: string
          minLength: 1
          maxLength: 512
        namespace:
          type: string
          maxLength: 63
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
        service_account:
          type: string
          maxLength: 253
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
        audience:
          description: The exact and only audience the projected ServiceAccount token must carry.
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[!-~]+$
        platform_principal:
          $ref: "#/components/schemas/PluginWorkloadPrincipalCreateBody"
        service_user_id:
          description: >-
            An existing plugin workload principal without a binding, for example one whose binding was revoked. The
            plugin installation record names this principal.
          type: string
          format: uuid
        plugin_id:
          type: string
          maxLength: 200
          pattern: ^[a-z0-9](?:[a-z0-9.-]*[a-z0-9])$
        installation_id:
          type: string
          format: uuid

    PluginWorkloadPrincipalCreateBody:
      description: >-
        Creates the platform principal of the plugin workload together with the binding. It belongs to no
        organization, can hold no role and has no static token.
      type: object
      additionalProperties: false
      required:
        - display_name
      properties:
        display_name:
          description: A display name of the platform principal
          minLength: 2
          maxLength: 200
          pattern: ^[^\p{Cc}\p{Cs}\p{Z}\n]( |[^\p{Cc}\p{Cs}\p{Z}\n])*[^\p{Cc}\p{Cs}\p{Z}\n]$
          x-pattern-error: display_name contains invalid characters
          type: string
          example: progressive-rollouts

    PluginWorkloadBinding:
      description: A Kubernetes ServiceAccount bound to the service user of a plugin installation.
      type: object
      required:
        - id
        - issuer
        - namespace
        - service_account
        - audience
        - service_user_id
        - service_user_scope
        - plugin_id
        - installation_id
        - created_at
        - created_by
      properties:
        id:
          type: string
          format: uuid
        issuer:
          type: string
        namespace:
          type: string
        service_account:
          type: string
        audience:
          type: string
        service_user_id:
          type: string
          format: uuid
        service_user_scope:
          description: >-
            platform for a platform principal, which belongs to no organization and holds no role; organization for a
            service user of one organization, bound before platform principals existed.
          type: string
          enum:
            - organization
            - platform
          x-enum-varnames:
            - ServiceUserScopeOrganization
            - ServiceUserScopePlatform
        plugin_id:
          type: string
        installation_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid

    PluginWorkloadBindingList:
      description: All plugin workload bindings, oldest first.
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PluginWorkloadBinding"

    PlatformPrincipalCreateBody:
      description: Creates a platform principal that authenticates with a static token.
      type: object
      additionalProperties: false
      required:
        - display_name
        - expiry_in_days
      properties:
        display_name:
          description: A display name of the platform principal
          minLength: 2
          maxLength: 200
          pattern: ^[^\p{Cc}\p{Cs}\p{Z}\n]( |[^\p{Cc}\p{Cs}\p{Z}\n])*[^\p{Cc}\p{Cs}\p{Z}\n]$
          x-pattern-error: display_name contains invalid characters
          type: string
          example: Data Plane admission checker
        expiry_in_days:
          description: The expiry time of the token in days from the time of creation
          type: integer
          minimum: 1
          maximum: 3660
          example: 365

    PlatformPrincipal:
      description: >-
        A service user that belongs to no organization and holds no role. A static_token principal, such as the Data
        Plane admission checker, authenticates with a token from this API. A workload principal has no static token;
        it authenticates only with tokens exchanged through its plugin workload binding.
      type: object
      required:
        - id
        - display_name
        - credential
        - generated_at
        - generated_by
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        credential:
          $ref: "#/components/schemas/PlatformPrincipalCredential"
        generated_at:
          description: The time the principal was created or its static token last regenerated
          type: string
          format: date-time
        generated_by:
          description: The principal that created it or last regenerated its static token
          type: string
          format: uuid
        current_token_expires_at:
          description: The expiry of the static token; absent for a workload principal.
          type: string
          format: date-time
        workload_binding_id:
          description: The plugin workload binding of a bound workload principal.
          type: string
          format: uuid

    PlatformPrincipalCredential:
      description: How a platform principal authenticates.
      type: string
      enum:
        - static_token
        - workload
      x-enum-varnames:
        - PlatformPrincipalCredentialStaticToken
        - PlatformPrincipalCredentialWorkload

    PlatformPrincipalWithToken:
      allOf:
        - $ref: "#/components/schemas/PlatformPrincipal"
        - required:
            - token
          properties:
            token:
              description: The static bearer token. It is returned only here.
              type: string

    PlatformPrincipalList:
      description: All platform principals, oldest first.
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlatformPrincipal"

    ServiceUserRole:
      description: A role to assign to a user or service user.
      required:
        - id
      properties:
        id:
          description: The role id to assign
          type: string
          format: uuid
          example: 01234567-89ab-cdef-0123-456789abcdef
        scope:
          description: The scope to assign the role within. If not provided, the role is assigned at the organization level.
          type: string
          example: project:01234567-89ab-cdef-0123-456789abcdef

    ScopeSyncResult:
      description: The result of an authorization resource sync operation
      properties:
        projects_synced:
          description: The number of projects synced
          type: integer
        environments_synced:
          description: The number of environments synced
          type: integer
        resources_upserted:
          description: The number of authorization resources inserted or refreshed
          type: integer
      required:
        - projects_synced
        - environments_synced
        - resources_upserted

    SsoConfiguration:
      properties:
        provider_org_id:
          description: Organization's ID in the SSO Provider
          type: string
      required:
        - provider_org_id

    UserWithRolePage:
      description: A page of users or service users with permissions in a scope
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserWithRole"
        next_page_token:
          type: string
          description: The page token to use to request the next page of items

    UserWithRole:
      description: A user / service user with their role
      required:
        - id
        - type
        - subject_type
        - subject_id
      properties:
        id:
          description: The user / service user id
          type: string
          format: uuid
        type:
          description: The type of user - human user or service user
          type: string
          enum:
            - user
            - service-user
        subject_type:
          description: The membership subject type.
          allOf:
            - $ref: "#/components/schemas/SubjectType"
        subject_id:
          description: The membership subject id.
          type: string
          format: uuid
