openapi: 3.0.0
info:
  title: ""
  version: ""
paths:
  /auth/register:
    post:
      tags:
        - internal
      operationId: registerUser
      summary: Register a new user using a login provider and grant an initial session token in the cookie.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterUserBody"
      parameters:
        - $ref: "#/components/parameters/xClientRegionHeaderParam"
        - $ref: "#/components/parameters/xClientCityHeaderParam"
        - $ref: "#/components/parameters/xClientIpHeaderParam"
      responses:
        "202":
          description: Successfully registered a user.
          headers:
            Set-Cookie:
              description: A set-cookie request containing the session token granted for this user.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisteredUser"
        "400":
          $ref: "#/components/responses/400BadRequest"

  /auth/login:
    post:
      tags:
        - internal
      operationId: loginSession
      summary: Log in and create a new session token
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginUserBody"
      parameters:
        - $ref: "#/components/parameters/xClientRegionHeaderParam"
        - $ref: "#/components/parameters/xClientCityHeaderParam"
        - $ref: "#/components/parameters/xClientIpHeaderParam"
      responses:
        "200":
          description: Successfully logged in.
          headers:
            Set-Cookie:
              description: A set-cookie request containing the session token granted for this user.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"

  /auth/device:
    post:
      tags:
        - Device
      operationId: requestDeviceLogin
      summary: Begin a device login flow
      parameters:
        - name: User-Agent
          in: header
          schema:
            type: string
        - $ref: "#/components/parameters/xClientRegionHeaderParam"
        - $ref: "#/components/parameters/xClientCityHeaderParam"
        - $ref: "#/components/parameters/xClientIpHeaderParam"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceLoginCreateBody"
      responses:
        "201":
          description: Successfully created a device login request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedDeviceLoginRequest"
        "400":
          $ref: "#/components/responses/400BadRequest"

  /auth/sso/login:
    post:
      tags:
        - internal
      operationId: requestSsoLogin
      summary: Begin SSO login flow
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SsoLoginCreateBody"
      responses:
        "200":
          description: Successfully initialized SSO request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SsoLoginResponse"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "404":
          $ref: "#/components/responses/404NotFound"

  /auth/sso/callback:
    get:
      tags:
        - internal
      operationId: getSsoCallback
      summary: Callback SSO login flow
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: error_description
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/xClientRegionHeaderParam"
        - $ref: "#/components/parameters/xClientCityHeaderParam"
        - $ref: "#/components/parameters/xClientIpHeaderParam"
      responses:
        "200":
          description: Successfully logged in.
          headers:
            Set-Cookie:
              description: A set-cookie request containing the session token granted for this user.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"

  /internal/orgs/{orgId}/sso-configuration:
    put:
      tags:
        - internal
      operationId: internalUpdateSsoConfiguration
      summary: Update SSO configuration for the organization
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SsoConfiguration"
      responses:
        "200":
          description: Successfully updates organization SSO configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SsoConfiguration"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "409":
          $ref: "#/components/responses/409Conflict"
    get:
      tags:
        - internal
      operationId: internalGetSsoConfiguration
      summary: Get SSO configuration for the organization
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
      responses:
        "200":
          description: Return organization SSO configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SsoConfiguration"
        "404":
          $ref: "#/components/responses/404NotFound"

  /auth/logout:
    post:
      tags:
        - internal
      operationId: logoutSession
      summary: Log out the current session token
      security:
        - userIdHeader: []
      parameters:
        - name: X-Token-Hash
          in: header
          schema:
            type: string
          required: false
          description: An optional hash of the session token coming from the authN gateway. This allows the session to be properly invalidated.
      responses:
        "204":
          description: Success
          headers:
            Set-Cookie:
              description: A set-cookie request containing the session token granted for this user.
              schema:
                type: string

  /auth/plugin-workload-token:
    post:
      tags:
        - PluginWorkload
      operationId: exchangePluginWorkloadToken
      summary: Exchange a Kubernetes ServiceAccount token for a plugin workload token (v1alpha).
      description: >-
        RFC 8693 token exchange for plugin workloads, contract level v1alpha. The subject token must be a projected
        Kubernetes ServiceAccount token from the configured cluster issuer whose only audience is the exchange audience
        of the workload binding for that ServiceAccount, and the bound service user must be active and hold no role.
        The issued opaque token authenticates as the bound service user for at most 15 minutes and never longer than
        the subject token. Revoking the binding, disabling the service user or a role on it rejects the next
        authentication. This operation needs no prior authentication; every rejected subject token yields the same
        invalid_grant error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PluginWorkloadTokenExchangeRequest"
      responses:
        "200":
          description: Plugin workload token issued.
          headers:
            Cache-Control:
              description: Always no-store.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginWorkloadTokenExchangeResponse"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "404":
          $ref: "#/components/responses/404NotFound"
        "503":
          description: The verification keys of the configured issuer are temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/check-permissions:
    post:
      tags:
        - User
      operationId: checkPermissions
      summary: Bulkly check permissions for the current subject that is logged in. This works for both human users and service users.
      security:
        - userIdHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/ResourcePermissionCheck"
      responses:
        "200":
          description: List of permission checks with their result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourcePermissionCheckResult"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "404":
          $ref: "#/components/responses/404NotFound"

  /users/{userId}/memberships:
    get:
      tags:
        - Membership
      operationId: listUserMemberships
      summary: List all of the memberships for the given user
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/userIdPathParam"
        - $ref: "#/components/parameters/perPageQueryParam"
        - $ref: "#/components/parameters/pageTokenQueryParam"
        - name: orgId
          in: query
          description: Filter memberships by org ID.
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Successfully listed organization memberships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserMembershipPage"

  /users/{userId}/session-tokens:
    get:
      tags:
        - User
      operationId: listUserSessionTokens
      summary: List all of the active user session tokens
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/userIdPathParam"
        - $ref: "#/components/parameters/perPageQueryParam"
        - $ref: "#/components/parameters/pageTokenQueryParam"
      responses:
        "200":
          description: Successfully listed organization memberships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSessionTokenPage"

  /users/{userId}/session-tokens/{hash}:
    delete:
      tags:
        - User
      operationId: revokeUserSessionToken
      summary: Revoke the session token for this user.
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/userIdPathParam"
        - name: hash
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Successfully revoked the session
        "400":
          $ref: "#/components/responses/400BadRequest"
        "404":
          $ref: "#/components/responses/404NotFound"

  /users/{userId}/actions/dismiss-prompt:
    post:
      tags:
        - User
      operationId: dismissPrompt
      summary: Dismiss a prompt for the user
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/userIdPathParam"
        - name: id
          in: query
          required: true
          schema:
            type: string
            pattern: ^[a-z][a-z0-9-]{0,20}[a-z0-9]$
            x-pattern-error: "prompt id must be 2-22 characters long and start with a letter"
            description: The ID of the prompt to dismiss
      responses:
        "204":
          description: Successfully dismissed the prompt
        "400":
          $ref: "#/components/responses/400BadRequest"
        "404":
          $ref: "#/components/responses/404NotFound"

  /orgs/{orgId}/members:
    get:
      tags:
        - Membership
      operationId: listMembers
      summary: List the members of an org with their identity provider information
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
        - $ref: "#/components/parameters/perPageQueryParam"
        - $ref: "#/components/parameters/pageTokenQueryParam"
        - name: userId
          in: query
          description: Filter members by user ID.
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Successfully listed organization members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberPage"

  /orgs/{orgId}/memberships:
    get:
      tags:
        - Membership
      operationId: listOrgMemberships
      summary: List the memberships for an org
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
        - $ref: "#/components/parameters/perPageQueryParam"
        - $ref: "#/components/parameters/pageTokenQueryParam"
        - name: userId
          in: query
          description: Filter memberships by user ID.
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Successfully listed organization memberships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgMembershipPage"

  /orgs/{orgId}/memberships/{membershipId}:
    delete:
      tags:
        - Membership
      operationId: deleteOrgMembership
      summary: Delete an org membership for a user. Due to internal caching, this may take up to a minute for authorized sessions to be revoked.
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
        - name: membershipId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Successfully deleted the org membership
        "404":
          $ref: "#/components/responses/404NotFound"
        "409":
          $ref: "#/components/responses/409Conflict"

  /orgs/{orgId}/users/{userId}/memberships:
    put:
      tags:
        - Membership
        - internal
      operationId: replaceOrgUserMemberships
      summary: Replace all memberships for a user in an organization
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
        - $ref: "#/components/parameters/userIdPathParam"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceUserMembershipsBody"
      responses:
        "200":
          description: Successfully updated user memberships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserMembershipPage"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "404":
          $ref: "#/components/responses/404NotFound"
        "409":
          $ref: "#/components/responses/409Conflict"

  /internal/orgs/{orgId}/memberships:
    post:
      tags:
        - internal
        - Membership
      operationId: internalCreateOrgMembership
      summary: Manually create an org membership
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternalMembershipCreateBody"
      responses:
        "201":
          description: Successfully created organization membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgMembership"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "404":
          $ref: "#/components/responses/404NotFound"
        "409":
          $ref: "#/components/responses/409Conflict"

  /internal/orgs/{orgId}/actions/remove-access:
    post:
      tags:
        - internal
      operationId: internalRemoveAccessFromOrg
      summary: Removes all user and service user access from an org.
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
      responses:
        "204":
          description: Successfully removed access

  /internal/orgs/{orgId}/actions/sync-scopes:
    post:
      tags:
        - internal
      operationId: internalSyncOrgScopes
      summary: Sync authorization resources for all projects in an organization
      description: Checks that the organization exists and stores the organization, project, and environment hierarchy used for inherited role bindings.
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
      responses:
        "200":
          description: Successfully synced scoped roles for all projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopeSyncResult"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "404":
          $ref: "#/components/responses/404NotFound"

  /internal/authenticate:
    post:
      tags:
        - internal
      operationId: internalAuthenticate
      summary: Authenticate the current request and return From and Hash headers to the gateway
      parameters:
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
        - name: session-token
          in: cookie
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The request is successfully authenticated
          headers:
            From:
              schema:
                type: string
                format: uuid
            X-Token-Hash:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/401Unauthorized"

  /internal/authorize:
    post:
      tags:
        - internal
      operationId: internalAuthorize
      summary: Perform a policy enforcement check on the requested user, subjects, and permissions
      description: >-
        A check on the resource platform asks whether the user holds a platform-level permission such as
        plugin_manager_read or plugin_manager_write. Only principals configured for that permission hold it; they must
        be active and are never plugin workloads, organization roles never grant it, and the internal system identity
        never holds it through this check.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternalAuthorizeBody"
      responses:
        "204":
          description: The request is authorized to continue
        "400":
          $ref: "#/components/responses/400BadRequest"
        "403":
          $ref: "#/components/responses/403Forbidden"

  /internal/plugin-workload-bindings:
    get:
      tags:
        - internal
      operationId: internalListPluginWorkloadBindings
      summary: List the workload bindings of one plugin installation (v1alpha).
      description: >-
        Lets Core verify that a workload binding exists for exactly the plugin ID, installation UUID and service user
        it records for an installation, and that this service user is a platform principal (service_user_scope).
      parameters:
        - name: plugin_id
          in: query
          required: true
          schema:
            type: string
            maxLength: 200
            pattern: ^[a-z0-9](?:[a-z0-9.-]*[a-z0-9])$
        - name: installation_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The bindings of the installation, oldest first; empty when it has none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginWorkloadBindingList"
        "400":
          $ref: "#/components/responses/400BadRequest"

  /current-user:
    get:
      tags:
        - User
      operationId: getCurrentUser
      summary: Get details of the current user that is logged in
      security:
        - userIdHeader: []
      responses:
        "200":
          description: Successfully retrieved the current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"

  /orgs/{orgId}/service-users:
    get:
      tags:
        - ServiceUser
      operationId: listServiceUsers
      summary: List the service users in this org
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
        - $ref: "#/components/parameters/perPageQueryParam"
        - $ref: "#/components/parameters/pageTokenQueryParam"
      responses:
        "200":
          description: Successfully listed service users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceUserPage"
        "400":
          $ref: "#/components/responses/400BadRequest"
    post:
      tags:
        - ServiceUser
      operationId: createServiceUser
      summary: Create a new service user in the org
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceUserCreateBody"
      responses:
        "201":
          description: Successfully created a service user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceUserWithToken"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "409":
          $ref: "#/components/responses/409Conflict"

  /orgs/{orgId}/service-users/{serviceUserId}:
    delete:
      tags:
        - ServiceUser
      operationId: deleteServiceUser
      summary: Delete a service user from the org. Due to internal caching, this may take up to a minute for authorized sessions to be revoked.
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
        - $ref: "#/components/parameters/serviceUserIdPathParam"
      responses:
        "204":
          description: Successfully deleted the service user
        "404":
          $ref: "#/components/responses/404NotFound"
    put:
      tags:
        - ServiceUser
        - internal
      operationId: replaceServiceUserRoles
      summary: Replace all roles for a service user in an organization
      description: A service user bound to a plugin workload holds no role; assigning any returns 409.
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
        - $ref: "#/components/parameters/serviceUserIdPathParam"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceServiceUserRolesBody"
      responses:
        "200":
          description: Successfully updated service user roles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceUserSummary"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "404":
          $ref: "#/components/responses/404NotFound"
        "409":
          $ref: "#/components/responses/409Conflict"

  /orgs/{orgId}/service-users/{serviceUserId}/actions/regenerate:
    post:
      tags:
        - ServiceUser
      operationId: regenerateServiceUser
      summary: Regenerate the service user token and extend the expiry. Due to internal caching, this may take up to a minute for authorized sessions to be revoked.
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
        - $ref: "#/components/parameters/serviceUserIdPathParam"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceUserRegenerateBody"
      responses:
        "200":
          description: Successfully regenerated the service user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceUserWithToken"
        "404":
          $ref: "#/components/responses/404NotFound"
        "409":
          $ref: "#/components/responses/409Conflict"

  /orgs/{orgId}/invitations:
    post:
      tags:
        - Invitation
      operationId: createInvitation
      summary: Create and send an email invitation to a user to join this organization.
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationCreateBody"
      responses:
        "201":
          description: Successfully sent the invitation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationSummary"
        "400":
          $ref: "#/components/responses/400BadRequest"

    get:
      tags:
        - Invitation
      operationId: listInvitations
      summary: List the invitations that are pending in the organization.
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
        - $ref: "#/components/parameters/perPageQueryParam"
        - $ref: "#/components/parameters/pageTokenQueryParam"
      responses:
        "200":
          description: Successfully listed invitations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPage"

  /orgs/{orgId}/invitations/{invitationId}:
    get:
      tags:
        - Invitation
      operationId: getInvitation
      summary: Previews an invitation for membership to an org without redeeming it. The user must be authorized or present the correct redemption token.
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: redemptionToken
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Successfully retrieved the invitation preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationSummary"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "404":
          $ref: "#/components/responses/404NotFound"
    delete:
      tags:
        - Invitation
      operationId: revokeInvitation
      summary: Deletes a pending invitation and invalidates it.
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Successfully deleted the invitation
        "404":
          $ref: "#/components/responses/404NotFound"

  /orgs/{orgId}/invitations/{invitationId}/actions/redeem:
    post:
      tags:
        - Invitation
      operationId: redeemInvitation
      summary: Redeems an invitation for membership to an org.
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: redemptionToken
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successfully redeemed the invitation for membership to the org.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserMembership"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "404":
          $ref: "#/components/responses/404NotFound"
        "409":
          $ref: "#/components/responses/409Conflict"

  /orgs/{orgId}/projects/{projectId}/users:
    get:
      tags:
        - Project
        - Permissions
      operationId: listProjectUsers
      summary: List the users and service users that have access to this project.
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
        - $ref: "#/components/parameters/projectIdPathParam"
        - $ref: "#/components/parameters/userTypeQueryParam"
        - $ref: "#/components/parameters/perPageQueryParam"
        - $ref: "#/components/parameters/pageTokenQueryParam"
      responses:
        "200":
          description: Successfully listed project users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserWithRolePage"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "404":
          $ref: "#/components/responses/404NotFound"

  /orgs/{orgId}/projects/{projectId}/envs/{envId}/users:
    get:
      tags:
        - Environment
        - Permissions
      operationId: listEnvironmentUsers
      summary: List the users and service users that have access to this environment.
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
        - $ref: "#/components/parameters/projectIdPathParam"
        - $ref: "#/components/parameters/envIdPathParam"
        - $ref: "#/components/parameters/userTypeQueryParam"
        - $ref: "#/components/parameters/perPageQueryParam"
        - $ref: "#/components/parameters/pageTokenQueryParam"
      responses:
        "200":
          description: Successfully listed environment users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserWithRolePage"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "404":
          $ref: "#/components/responses/404NotFound"

  /orgs/{orgId}/permissions:
    get:
      tags:
        - Role
      operationId: listPermissions
      summary: List permissions available for configurable roles.
      description: Returns the authoritative granular permission catalog, including the scopes where each permission is effective.
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
      responses:
        "200":
          description: Successfully listed assignable permissions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionDefinitionPage"

  /orgs/{orgId}/plugins/{pluginId}/capabilities:
    put:
      tags:
        - Role
      operationId: replacePluginCapabilities
      summary: Replace an installed plugin's human-role capabilities.
      description: Replaces the complete organization-scoped capability catalog for an operator-installed plugin. Capability identifiers are always derived as plugin.{pluginId}.{localSlug}, where localSlug is a flat lowercase letter, digit and hyphen slug; callers cannot register Core permissions or service-operation grants.
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
        - name: pluginId
          in: path
          required: true
          schema:
            type: string
            maxLength: 200
            pattern: ^[a-z0-9](?:[a-z0-9.-]*[a-z0-9])$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PluginCapabilityRegistrationBody"
      responses:
        "204":
          description: Plugin capabilities replaced.
        "400":
          $ref: "#/components/responses/400BadRequest"
        "403":
          $ref: "#/components/responses/403Forbidden"

  /plugin-workload-bindings:
    get:
      tags:
        - PluginWorkload
      operationId: listPluginWorkloadBindings
      summary: List plugin workload bindings (v1alpha).
      description: Requires the platform-level permission plugin_workload_binding_write.
      security:
        - userIdHeader: []
      responses:
        "200":
          description: All plugin workload bindings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginWorkloadBindingList"
        "403":
          $ref: "#/components/responses/403Forbidden"
    post:
      tags:
        - PluginWorkload
      operationId: createPluginWorkloadBinding
      summary: Bind a Kubernetes ServiceAccount to a plugin platform principal (v1alpha).
      description: >-
        Requires the platform-level permission plugin_workload_binding_write, which organization roles cannot grant.
        The binding names a platform principal: a service user that belongs to no organization, can hold no role and
        has no static token. Either platform_principal creates a new one in the same transaction, or service_user_id
        names an existing plugin workload principal without a binding, for example after a revocation, so the
        principal and the identity Core records for the installation stay the same. An organization service user or
        a static-token platform principal cannot be bound. A ServiceAccount and a principal each have at most one
        binding. The issuer must be the configured workload token issuer.
      security:
        - userIdHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PluginWorkloadBindingCreateBody"
      responses:
        "201":
          description: Plugin workload binding created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginWorkloadBinding"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "409":
          $ref: "#/components/responses/409Conflict"

  /plugin-workload-bindings/{bindingId}:
    get:
      tags:
        - PluginWorkload
      operationId: getPluginWorkloadBinding
      summary: Get a plugin workload binding (v1alpha).
      description: Requires the platform-level permission plugin_workload_binding_write.
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/pluginWorkloadBindingIdPathParam"
      responses:
        "200":
          description: The plugin workload binding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginWorkloadBinding"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "404":
          $ref: "#/components/responses/404NotFound"
    delete:
      tags:
        - PluginWorkload
      operationId: deletePluginWorkloadBinding
      summary: Revoke a plugin workload binding (v1alpha).
      description: >-
        Requires the platform-level permission plugin_workload_binding_write. Deletes the binding and every token issued
        for it; the next authentication with such a token fails. The bound principal stays: a platform principal then
        has no credential at all, and a new binding can name it again.
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/pluginWorkloadBindingIdPathParam"
      responses:
        "204":
          description: Plugin workload binding revoked.
        "403":
          $ref: "#/components/responses/403Forbidden"
        "404":
          $ref: "#/components/responses/404NotFound"

  /platform-principals:
    get:
      tags:
        - PlatformPrincipal
      operationId: listPlatformPrincipals
      summary: List platform principals (v1alpha).
      description: >-
        Requires the platform-level permission plugin_workload_binding_write. Platform principals belong to no
        organization, hold no role and never appear in an organization's service users.
      security:
        - userIdHeader: []
      responses:
        "200":
          description: All platform principals, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformPrincipalList"
        "403":
          $ref: "#/components/responses/403Forbidden"
    post:
      tags:
        - PlatformPrincipal
      operationId: createPlatformPrincipal
      summary: Create a static-token platform principal, such as the Data Plane admission checker (v1alpha).
      description: >-
        Requires the platform-level permission plugin_workload_binding_write, held by a user or IAM's internal system
        identity; a service user cannot issue static platform tokens. The principal belongs to no organization, can
        hold no role and cannot be bound to a plugin workload. The token is returned only once.
      security:
        - userIdHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformPrincipalCreateBody"
      responses:
        "201":
          description: Platform principal created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformPrincipalWithToken"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "403":
          $ref: "#/components/responses/403Forbidden"

  /platform-principals/{principalId}:
    get:
      tags:
        - PlatformPrincipal
      operationId: getPlatformPrincipal
      summary: Get a platform principal (v1alpha).
      description: Requires the platform-level permission plugin_workload_binding_write.
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/platformPrincipalIdPathParam"
      responses:
        "200":
          description: The platform principal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformPrincipal"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "404":
          $ref: "#/components/responses/404NotFound"
    delete:
      tags:
        - PlatformPrincipal
      operationId: deletePlatformPrincipal
      summary: Delete a platform principal (v1alpha).
      description: >-
        Requires the platform-level permission plugin_workload_binding_write. Deletes the principal together with its
        workload binding and every token issued for it. Due to internal caching, a static token may keep
        authenticating for up to a minute.
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/platformPrincipalIdPathParam"
      responses:
        "204":
          description: Platform principal deleted.
        "403":
          $ref: "#/components/responses/403Forbidden"
        "404":
          $ref: "#/components/responses/404NotFound"

  /platform-principals/{principalId}/actions/regenerate:
    post:
      tags:
        - PlatformPrincipal
      operationId: regeneratePlatformPrincipal
      summary: Replace the static token of a platform principal (v1alpha).
      description: >-
        Requires the platform-level permission plugin_workload_binding_write, held by a user or IAM's internal system
        identity. The previous token stops authenticating; due to internal caching this may take up to a minute. A
        plugin workload principal has no static token and returns 409.
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/platformPrincipalIdPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceUserRegenerateBody"
      responses:
        "200":
          description: Static token replaced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformPrincipalWithToken"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "404":
          $ref: "#/components/responses/404NotFound"
        "409":
          $ref: "#/components/responses/409Conflict"

  /orgs/{orgId}/roles:
    get:
      tags:
        - Role
      operationId: listRoles
      summary: List the roles in this Organization.
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
        - $ref: "#/components/parameters/perPageQueryParam"
        - $ref: "#/components/parameters/pageTokenQueryParam"
      responses:
        "200":
          description: Successfully listed roles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolePage"
    post:
      tags:
        - Role
      operationId: createRole
      summary: Create a configurable role in this organization.
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleWriteBody"
            example:
              display_name: Module Maintainer
              permissions:
                - module_read
                - module_write
      responses:
        "201":
          description: Successfully created the role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "409":
          $ref: "#/components/responses/409Conflict"

  /orgs/{orgId}/roles/{roleId}:
    get:
      tags:
        - Role
      operationId: getRole
      summary: Obtain details of a Role in an Organization.
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
        - name: roleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Successfully retrieved the role details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "404":
          $ref: "#/components/responses/404NotFound"
    put:
      tags:
        - Role
      operationId: updateRole
      summary: Replace the name and permissions of a configurable role.
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
        - name: roleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleWriteBody"
            example:
              display_name: Deployment Operator
              permissions:
                - deployment_read
                - deployment_write
      responses:
        "200":
          description: Successfully updated the role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "404":
          $ref: "#/components/responses/404NotFound"
        "409":
          $ref: "#/components/responses/409Conflict"
    delete:
      tags:
        - Role
      operationId: deleteRole
      summary: Delete an unassigned configurable role.
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
        - name: roleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Successfully deleted the role.
        "404":
          $ref: "#/components/responses/404NotFound"
        "409":
          $ref: "#/components/responses/409Conflict"

  /orgs/{orgId}/scim/group-mappings:
    get:
      tags:
        - Provisioning
      operationId: listScimGroupMappings
      summary: List the SCIM group-to-role mappings in this organization.
      description: Each mapping grants members of the named SCIM group the mapped role. Group names are matched case-insensitively. Renaming a group in the IDP breaks its mapping.
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
      responses:
        "200":
          description: Successfully listed SCIM group mappings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScimGroupMappingPage"

  /orgs/{orgId}/scim/group-mappings/{groupDisplayName}:
    put:
      tags:
        - Provisioning
      operationId: upsertScimGroupMapping
      summary: Create or replace the role mapping for a SCIM group display name.
      description: Members of the SCIM group with this display name (compared case-insensitively) are granted the mapped role on their next provisioning sync or group membership change. Requires membership management permission, not provisioning or role permission.
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
        - $ref: "#/components/parameters/scimGroupDisplayNamePathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScimGroupMappingWriteBody"
            example:
              role_id: 01234567-89ab-cdef-0123-456789abcdef
      responses:
        "200":
          description: Successfully created or replaced the mapping.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScimGroupMapping"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "404":
          $ref: "#/components/responses/404NotFound"
    delete:
      tags:
        - Provisioning
      operationId: deleteScimGroupMapping
      summary: Delete the role mapping for a SCIM group display name.
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
        - $ref: "#/components/parameters/scimGroupDisplayNamePathParam"
      responses:
        "204":
          description: Successfully deleted the mapping.
        "404":
          $ref: "#/components/responses/404NotFound"

  /devicelogins/{requestId}/actions/poll:
    post:
      tags:
        - Device
      operationId: pollDeviceLoginRequest
      summary: Poll the device login request and attempt to redeem for a session token
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: pollingToken
          in: query
          required: true
          schema:
            type: string
      responses:
        "202":
          description: The device login has not been accepted or rejected yet
        "200":
          description: The device login was accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedDeviceLoginRequest"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "404":
          $ref: "#/components/responses/404NotFound"

  /devicelogins/{code}:
    get:
      tags:
        - Device
      operationId: getDeviceLoginRequest
      summary: View the attributes of a device login request
      security:
        - userIdHeader: []
      parameters:
        - name: code
          in: path
          description: The short code associated with the device login request.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successfully retrieved the device login request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceLoginRequest"
        "404":
          $ref: "#/components/responses/404NotFound"

  /devicelogins/{requestId}/actions/accept:
    post:
      tags:
        - Device
      operationId: acceptDeviceLoginRequest
      summary: Accept the device login request and allocate it a session token.
      security:
        - userIdHeader: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Successfully accepted the device login request.
        "404":
          $ref: "#/components/responses/404NotFound"

  /devicelogins/{requestId}/actions/reject:
    post:
      tags:
        - Device
      operationId: rejectDeviceLoginRequest
      summary: Reject the device login request
      security:
        - userIdHeader: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Successfully rejected the device login request.
        "404":
          $ref: "#/components/responses/404NotFound"

components:
  securitySchemes:
    userIdHeader:
      type: apiKey
      in: header
      name: From

  parameters:
    orgIdPathParam:
      name: orgId
      in: path
      description: The Organization ID
      example: "sample-org"
      required: true
      schema:
        type: string
    scimGroupDisplayNamePathParam:
      name: groupDisplayName
      in: path
      description: The SCIM group display name the mapping applies to (matched case-insensitively).
      example: "Platform Engineers"
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
    projectIdPathParam:
      name: projectId
      in: path
      description: The Project ID
      example: "sample-project"
      required: true
      schema:
        type: string
    envIdPathParam:
      name: envId
      in: path
      description: The Environment ID
      example: "sample-env"
      required: true
      schema:
        type: string
    userIdPathParam:
      name: userId
      in: path
      description: The User ID
      example: 01234567-89ab-cdef-0123-456789abcdef
      required: true
      schema:
        type: string
        format: uuid
    pluginWorkloadBindingIdPathParam:
      name: bindingId
      in: path
      description: The plugin workload binding ID
      example: 01234567-89ab-cdef-0123-456789abcdef
      required: true
      schema:
        type: string
        format: uuid
    platformPrincipalIdPathParam:
      name: principalId
      in: path
      description: The platform principal ID
      example: 01234567-89ab-cdef-0123-456789abcdef
      required: true
      schema:
        type: string
        format: uuid
    serviceUserIdPathParam:
      name: serviceUserId
      in: path
      description: The Service User ID
      example: 01234567-89ab-cdef-0123-456789abcdef
      required: true
      schema:
        type: string
        format: uuid
    userTypeQueryParam:
      name: type
      in: query
      description: Type of Subject. Either User or Group
      required: false
      schema:
        type: string
        enum:
          - user
          - service-user
    perPageQueryParam:
      name: per_page
      in: query
      description: The maximum number of items to return in a page of results
      required: false
      example: 50
      schema:
        type: integer
    pageTokenQueryParam:
      name: page
      in: query
      description: The page token to request from
      required: false
      example: "AAAAAAAAAA=="
      schema:
        type: string
    xClientRegionHeaderParam:
      name: X-Client-Region
      in: header
      description: IP address region injected by the load balancer.
      required: false
      allowEmptyValue: true
      schema:
        type: string
      x-internal: true
    xClientCityHeaderParam:
      name: X-Client-City
      in: header
      description: IP address city injected by the load balancer.
      required: false
      allowEmptyValue: true
      schema:
        type: string
      x-internal: true
    xClientIpHeaderParam:
      name: X-Client-IP
      in: header
      description: IP address injected by the load balancer.
      required: false
      allowEmptyValue: true
      schema:
        type: string
      x-internal: true

  responses:
    400BadRequest:
      description: The request was invalid. More detail can be found in the error body.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    401Unauthorized:
      description: The client didn't provide valid authentication credentials.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    403Forbidden:
      description: Server understands the request but refuses to authorize it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    404NotFound:
      description: The request was valid, but the target resource or relation does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    409Conflict:
      description: The request conflicts with related or concurrent state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      description: A standard error response
      properties:
        error:
          description: |
            A short code representing the class of error. This code can be used for tracking and observability or to
            find appropriate troubleshooting documentation.
          type: string
          example: API-000
        message:
          description: A human-readable explanation of the error.
          type: string
          example: "Something happened!"
        details:
          description: An optional payload of metadata associated with the error.
          additionalProperties: true
          type: object
      required:
        - error
        - message
      type: object

    TemporaryLoginBody:
      description: A payload needed to login to Orchestrator (temporary).
      required:
        - org_id
        - token
      properties:
        org_id:
          description: The Organization ID
          type: string
          example: my-org
        token:
          description: The token for the Organization to login.
          type: string
      additionalProperties: false

    RegisterUserBody:
      description: A payload needed to register a user against an identity provider.
      required:
        - provider
        - provider_token
      properties:
        provider:
          description: The login provider type.
          type: string
          example: google
        provider_token:
          description: An id token that allows us to look up the real user identifiers.
          type: string

    LoginUserBody:
      description: A payload needed to login a user against an identity provider.
      required:
        - provider
        - provider_token
      properties:
        provider:
          description: The login provider type.
          type: string
          example: google
        provider_token:
          description: An id token that allows us to look up the real user identifiers.
          type: string

    User:
      description: The details of a users account
      required:
        - id
        - display_name
        - created_at
        - login_providers
      properties:
        id:
          description: The user id
          type: string
          format: uuid
          example: 01234567-89ab-cdef-0123-456789abcdef
        display_name:
          description: A display name for the user
          type: string
          example: Some User
        created_at:
          description: The time the user account was registered
          type: string
          format: date-time
        last_logged_in_at:
          description: The approximate time the user last logged in
          type: string
          format: date-time
        login_providers:
          description: The list of login providers that can be used to login to this user.
          type: array
          items:
            type: string
        primary_email_address:
          description: The primary email address if known for the current user.
          type: string
          example: user@example.com

    RegisteredUser:
      allOf:
        - $ref: "#/components/schemas/User"
        - required:
