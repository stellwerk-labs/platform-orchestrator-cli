          example: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
        project_id:
          type: string
          description: The Project id of the environment of this node.
          example: "my-project"
        env_id:
          type: string
          description: The environment id.
          example: "my-env"
        resource_type:
          type: string
          example: "postgres"
        resource_class:
          type: string
          example: "default"
        resource_id:
          type: string
          example: "shared.pg"
        deployment_id:
          type: string
          format: uuid
          example: 01234567-89ab-cdef-0123-456789abcdef
        module_id:
          type: string
          example: "my-module"
        module_version:
          type: string
          example: 01234567-89ab-cdef-0123-456789abcdef
        edges:
          type: object
          additionalProperties:
            type: string
          example:
            some-alias: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        metadata:
          type: object
          additionalProperties: true
          example:
            namespace: test-k8s-namespace
            gcp_project: test-gcp-project

    ListActiveResourceNodesPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          description: The list of active resource nodes.
          items:
            $ref: "#/components/schemas/ActiveResourceNode"

    ResourceNodesPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          description: The list of resource nodes for this deployment.
          items:
            $ref: "#/components/schemas/ActiveResourceNode"

    OpenidConfiguration:
      description: OpenID discovery configuration.
      properties:
        issuer:
          type: string
        jwks_uri:
          type: string
        subject_types_supported:
          type: array
          items:
            type: string
        response_types_supported:
          type: array
          items:
            type: string
        claims_supported:
          type: array
          items:
            type: string
        id_token_signing_alg_values_supported:
          type: array
          items:
            type: string
        scopes_supported:
          type: array
          items:
            type: string
      required:
        - issuer
        - jwks_uri
        - subject_types_supported
        - response_types_supported
        - claims_supported
        - id_token_signing_alg_values_supported
        - scopes_supported
      type: object

    Jwks:
      description: JSON Web Keys Set (JWKS).
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/Jwk"
      required:
        - keys
      type: object

    Jwk:
      description: JSON Web Key
      type: object
      properties:
        alg:
          type: string
        kty:
          type: string
        use:
          type: string
        x5c:
          type: array
          items:
            type: string
        n:
          type: string
        e:
          type: string
        kid:
          type: string
        x5t:
          type: string
      required:
        - alg
        - kty
        - use
        - n
        - e
        - kid

    InternalModuleUsage:
      type: object
      required:
        - env_ids_by_project_id
        - items
        - observed_at
      properties:
        env_ids_by_project_id:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/InternalModuleUsageItem'
        observed_at:
          type: string
          format: date-time

    InternalModuleUsageItem:
      type: object
      required: [project_id, env_id, environment_uuid, module_version, deployment_id, observed_at]
      properties:
        project_id: {type: string}
        env_id: {type: string}
        environment_uuid: {type: string, format: uuid}
        module_version: {type: string}
        deployment_id: {type: string, format: uuid}
        observed_at: {type: string, format: date-time}
