openapi: 3.0.0
info:
  title: Stellwerk Data Plane API
  version: unreleased
paths:
  /orgs/{orgId}/plugins/{pluginId}/external-deployments:
    post:
      operationId: admitExternalDeployment
      tags: [not-implemented]
      summary: Admit one Core-authorized immutable plan or rollback through the normal Deployment path.
      security: [{pluginContext: []}]
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
        - $ref: "#/components/parameters/pluginIdPathParam"
        - $ref: "#/components/parameters/idempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExternalDeploymentAdmissionBody"}
      responses:
        "200":
          description: An exact previously authorized dispatch was replayed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExternalDeploymentAdmissionResponse"}
        "201":
          description: An ordinary Deployment and durable dispatch receipt were created atomically.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExternalDeploymentAdmissionResponse"}
        "400": {$ref: "#/components/responses/400BadRequest"}
        "401": {$ref: "#/components/responses/401Unauthorized"}
        "403": {$ref: "#/components/responses/403Forbidden"}
        "409": {$ref: "#/components/responses/409Conflict"}
        "503": {$ref: "#/components/responses/503Unavailable"}

  /orgs/{orgId}/plugins/{pluginId}/external-deployment-readiness:
    post:
      operationId: getExternalDeploymentReadiness
      tags: [not-implemented]
      summary: Read immutable deployment readiness and active module inventory for exact Environment references.
      security: [{pluginContext: []}]
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
        - $ref: "#/components/parameters/pluginIdPathParam"
        - $ref: "#/components/parameters/idempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExternalDeploymentReadinessBody"}
      responses:
        "200":
          description: Ordered readiness for every requested Environment.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExternalDeploymentReadinessResponse"}
        "400": {$ref: "#/components/responses/400BadRequest"}

  /orgs/{orgId}/plugins/{pluginId}/external-deployment-plans:
    post:
      operationId: planExternalDeployment
      tags: [not-implemented]
      summary: Plan exact module versions through the normal deployment planner without exposing parameter values.
      security: [{pluginContext: []}]
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
        - $ref: "#/components/parameters/pluginIdPathParam"
        - $ref: "#/components/parameters/idempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExternalDeploymentPlanBody"}
      responses:
        "200":
          description: Immutable base and value-free structural plan.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExternalDeploymentPlanResponse"}
        "400": {$ref: "#/components/responses/400BadRequest"}
        "409": {$ref: "#/components/responses/409Conflict"}

  /orgs/{orgId}/plugins/{pluginId}/projects/{projectUUID}/envs/{environmentUUID}/external-deployments/{deploymentId}:
    get:
      operationId: getExternalDeployment
      tags: [not-implemented]
      summary: Get an ordinary Deployment only within its exact authorized Environment.
      security: [{pluginContext: []}]
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
        - $ref: "#/components/parameters/pluginIdPathParam"
        - {name: projectUUID, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: environmentUUID, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/deploymentIdPathParam"
      responses:
        "200":
          description: Exact-environment plugin Deployment status and immutable operation identity.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExternalDeploymentStatusResponse"}
        "404": {$ref: "#/components/responses/404NotFound"}

  /orgs/{orgId}/plugins/{pluginId}/projects/{projectUUID}/envs/{environmentUUID}/external-deployments/{deploymentId}/logs:
    get:
      operationId: getExternalDeploymentLogs
      tags: [not-implemented]
      summary: Retrieve bounded decrypted logs for an exact plugin-owned Deployment after fresh Core user authorization.
      security: [{pluginContext: []}]
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
        - $ref: "#/components/parameters/pluginIdPathParam"
        - {name: projectUUID, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: environmentUUID, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/deploymentIdPathParam"
      responses:
        "200":
          description: Decrypted logs, limited to 16 MiB. Core proxies this response directly to the authorized user; plugins must not persist it.
          content:
            text/plain: {schema: {type: string}}
        "401": {$ref: "#/components/responses/401Unauthorized"}
        "404": {$ref: "#/components/responses/404NotFound"}
        "409": {$ref: "#/components/responses/409Conflict"}
        "413": {$ref: "#/components/responses/413TooLarge"}
        "503": {$ref: "#/components/responses/503Unavailable"}

  /orgs/{orgId}/plugins/{pluginId}/projects/{projectUUID}/envs/{environmentUUID}/external-deployments/{deploymentId}/outputs:
    get:
      operationId: getExternalDeploymentOutputs
      tags: [not-implemented]
      summary: Retrieve bounded decrypted outputs for an exact plugin-owned Deployment after fresh Core user authorization.
      security: [{pluginContext: []}]
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
        - $ref: "#/components/parameters/pluginIdPathParam"
        - {name: projectUUID, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: environmentUUID, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/deploymentIdPathParam"
      responses:
        "200":
          description: Decrypted outputs in their original JSON representation, limited to 16 MiB. Core proxies this response directly to the authorized user; plugins must not persist it.
          content:
            text/plain: {schema: {type: string}}
        "401": {$ref: "#/components/responses/401Unauthorized"}
        "404": {$ref: "#/components/responses/404NotFound"}
        "409": {$ref: "#/components/responses/409Conflict"}
        "413": {$ref: "#/components/responses/413TooLarge"}
        "503": {$ref: "#/components/responses/503Unavailable"}

  /orgs/{orgId}/plugins/{pluginId}/projects/{projectUUID}/envs/{environmentUUID}/external-deployment-dispatches/{dispatchId}:
    get:
      operationId: getExternalDeploymentDispatch
      tags: [not-implemented]
      summary: Recover immutable Deployment receipt status after a lost admission response.
      security: [{pluginContext: []}]
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
        - $ref: "#/components/parameters/pluginIdPathParam"
        - {name: projectUUID, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: environmentUUID, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: dispatchId, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
      responses:
        "200":
          description: Immutable receipt and current ordinary Deployment status.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExternalDeploymentStatusResponse"}
        "404": {$ref: "#/components/responses/404NotFound"}

  /orgs/{orgId}/deployments:
    get:
      operationId: listDeployments
      tags:
        - Deployment
      summary: List deployments in the organization
      security:
        - userIdHeader: []
      parameters:
        # path
        - $ref: "#/components/parameters/orgIdPathParam"
        - $ref: "#/components/parameters/projectIdQueryParam"
        - $ref: "#/components/parameters/envIdQueryParam"
        # pagination
        - $ref: "#/components/parameters/perPageQueryParam"
        - $ref: "#/components/parameters/pageTokenQueryParam"
        # filter params
        - $ref: "#/components/parameters/byModeQueryParam"
        - $ref: "#/components/parameters/byStatusQueryParam"
      responses:
        "200":
          description: Successful list response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentPage"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "404":
          $ref: "#/components/responses/404NotFound"
    post:
      operationId: createDeployment
      tags:
        - Deployment
      summary: Create a new deployment in the target project and environment.
      description: |
        Deploy and rollback requests mutate the Environment and run one at a time. A request that finds the Environment
        busy waits in the Environment's deployment queue and the response is 202 with the queue item, unless it sets
        `when_busy` to `reject`: then it fails with 409 and the error code `environment_busy`. Requests authorized by an
        organization token cannot wait and always get that 409. Queued requests are promoted strictly in order and
        resolved against the Environment state at promotion.

        Plan-only requests and dry runs are never queued and ignore `when_busy`, `queue_ttl_seconds` and
        `halt_on_failure`. A dry run is answered while Deployments run or wait. A plan-only request starts while
        requests wait in the queue, but not while a deploy, rollback, destroy or another plan runs, because their Runners
        would contend for the Environment's state lock; it then fails with 409 `environment_busy`. Either response
        carries `pending_changes` when Deployments that run or wait will change the Environment first, so the plan or
        diff may still change.

        Conflicts carry a stable error code: `environment_busy`, `deployment_queue_full`, `outcome_unreconciled` (a failed
        plugin-dispatched Deployment awaits acknowledgement of its outcome), `environment_deleting` and
        `deployment_base_changed`. Other conflicts keep the code `HTTP-409`.
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
          description: |
            Ensures that the deployment request is only accepted once per idempotency key per 24 hours. A uuid or similar is recommended.
            When the key matches the key in last deployment and the environment and manifest is the same, this will return the last deployment.
            When the key matches a queued request, this returns its queue item until it is dispatched, and its Deployment afterwards.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeploymentCreateBody"
      responses:
        "200":
          description: Successful dry run create response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentDryRun"
        "201":
          description: Successful create response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "202":
          description: The Environment is busy and the request waits in its deployment queue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentQueueItem"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "409":
          $ref: "#/components/responses/409Conflict"
  /orgs/{orgId}/module-test-deployments:
    post:
      operationId: createModuleTestDeployment
      tags:
        - Deployment
      summary: Create a new deployment in the target project and environment.
      description: |
        Deploy and rollback requests mutate the Environment and run one at a time. A request that finds the Environment
        busy waits in the Environment's deployment queue and the response is 202 with the queue item, unless it sets
        `when_busy` to `reject`: then it fails with 409 and the error code `environment_busy`. Requests authorized by an
        organization token cannot wait and always get that 409. Queued requests are promoted strictly in order and
        resolved against the Environment state at promotion.

        Plan-only requests and dry runs are never queued and ignore `when_busy`, `queue_ttl_seconds` and
        `halt_on_failure`. A dry run is answered while Deployments run or wait. A plan-only request starts while
        requests wait in the queue, but not while a deploy, rollback, destroy or another plan runs, because their Runners
        would contend for the Environment's state lock; it then fails with 409 `environment_busy`. Either response
        carries `pending_changes` when Deployments that run or wait will change the Environment first, so the plan or
        diff may still change.

        Conflicts carry a stable error code: `environment_busy`, `deployment_queue_full`, `outcome_unreconciled` (a failed
        plugin-dispatched Deployment awaits acknowledgement of its outcome), `environment_deleting` and
        `deployment_base_changed`. Other conflicts keep the code `HTTP-409`.
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
          description: |
            Ensures that the deployment request is only accepted once per idempotency key per 24 hours. A uuid or similar is recommended.
            When the key matches the key in last deployment and the environment and manifest is the same, this will return the last deployment.
            When the key matches a queued request, this returns its queue item until it is dispatched, and its Deployment afterwards.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModuleTestDeploymentCreateBody"
      responses:
        "200":
          description: Successful dry run create response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentDryRun"
        "201":
          description: Successful create response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "202":
          description: The Environment is busy and the request waits in its deployment queue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentQueueItem"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "409":
          $ref: "#/components/responses/409Conflict"
  /orgs/{orgId}/deployment-queue:
    get:
      operationId: listDeploymentQueueItems
      tags:
        - Deployment
      summary: List deployment queue items in the organization in queue order.
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
        - $ref: "#/components/parameters/projectIdQueryParam"
        - $ref: "#/components/parameters/envIdQueryParam"
        - $ref: "#/components/parameters/perPageQueryParam"
        - $ref: "#/components/parameters/pageTokenQueryParam"
        - name: state
          in: query
          description: Only return items in this state.
          required: false
          schema:
            $ref: "#/components/schemas/DeploymentQueueItemState"
      responses:
        "200":
          description: Successful list response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentQueueItemPage"
        "400":
          $ref: "#/components/responses/400BadRequest"
  /orgs/{orgId}/deployment-queue/{queueItemId}:
    get:
      operationId: getDeploymentQueueItem
      tags:
        - Deployment
      summary: Get a deployment queue item, including the manifest it requested.
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
        - $ref: "#/components/parameters/queueItemIdPathParam"
      responses:
        "200":
          description: The queue item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentQueueItem"
        "404":
          $ref: "#/components/responses/404NotFound"
  /orgs/{orgId}/deployment-queue/{queueItemId}/actions/cancel:
    post:
      operationId: cancelDeploymentQueueItem
      tags:
        - Deployment
      summary: Cancel a queued deployment request.
      description: |
        Cancels a request that is still waiting. Requires the `deployment_write` permission on its Environment. Repeating the
        identical cancellation returns the cancelled item. A request that is being promoted at this moment answers 409 with the
        error code `queue_item_dispatching`; read the item again to see whether it was dispatched.
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
        - $ref: "#/components/parameters/queueItemIdPathParam"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeploymentQueueCancelBody"
      responses:
        "200":
          description: The cancelled queue item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentQueueItem"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "404":
          $ref: "#/components/responses/404NotFound"
        "409":
          $ref: "#/components/responses/409Conflict"
  /orgs/{orgId}/last-deployments:
    get:
      operationId: listLastDeployments
      tags:
        - Deployment
      summary: List the last deployment for each project_id and env_id combination
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
        - $ref: "#/components/parameters/projectIdQueryParam"
        - $ref: "#/components/parameters/envIdQueryParam"
        - $ref: "#/components/parameters/perPageQueryParam"
        - $ref: "#/components/parameters/pageTokenQueryParam"
        - name: state_change_only
          in: query
          description: Whether to return the last state change (apply or destroy) deployment for the target environment.
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Successful list response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentPage"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "404":
          $ref: "#/components/responses/404NotFound"
  /orgs/{orgId}/deployments/{deploymentId}:
    get:
      operationId: getDeployment
      tags:
        - Deployment
      summary: Get a deployment by id in the org
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
        - $ref: "#/components/parameters/deploymentIdPathParam"
      responses:
        "200":
          description: Successful get response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "404":
          $ref: "#/components/responses/404NotFound"
  /orgs/{orgId}/deployments/{deploymentId}/actions/wait-for-complete:
    get:
      operationId: waitForDeploymentComplete
      tags:
        - Deployment
      summary: Long-poll wait for the deployment to be completed. Either a 200 OK is returned indicating that the deployment is complete, or a 408 will indicate that the client must continue waiting.
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
        - $ref: "#/components/parameters/deploymentIdPathParam"
        - name: timeout_in_seconds
          description: Sets a maximum timeout before the HTTP-408 response is returned.
          in: query
          required: false
          schema:
            type: integer
            minimum: 2
      responses:
        "200":
          description: Completed deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "404":
          $ref: "#/components/responses/404NotFound"
        "408":
          description: Request timeout.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orgs/{orgId}/deployments/{deploymentId}/actions/diff:
    post:
      operationId: calculateDeploymentDiff
      tags:
        - Deployment
      summary: Calculate the diff from another deployment to this one.
      description: |
        Returns the diff from another deployment to this one. The deployments must both be in the same environment.
        The diff details the nodes that have been added, removed, or changed.
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
        - $ref: "#/components/parameters/deploymentIdPathParam"
        - name: fromDeploymentId
          in: query
          schema:
            type: string
            format: uuid
          description: |
            The id of the previous deployment in the same environment. If this is not specified, the diff
            will be calculated from the previous stateful deployment.
      responses:
        "200":
          description: Successful diff response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentDiff"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "404":
          $ref: "#/components/responses/404NotFound"
  /orgs/{orgId}/deployments/{deploymentId}/actions/get-logs:
    get:
      operationId: getDeploymentLogs
      tags:
        - Deployment
      summary: Get the logs produced by the runner execution during the deployment.
      description: |
        These logs are only stored and available for 30 days and they are returned encrypted or decrypted according to the existence or not of the
        decryption key query parameter.
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
        - $ref: "#/components/parameters/deploymentIdPathParam"
        - name: DecryptKey
          description: The private key needed to decrypt the logs. It should be an 'age' private key (see https://age-encryption.org).
          in: header
          required: false
          schema:
            type: string
            example: "AGE-SECRET-KEY-1SGKT64UHNGURNZUQSAJ9J0C65R2F2PXDCZQVVGRUPN98L33G2HFSUC24EJ"
            pattern: ^AGE-SECRET-KEY-[A-Z0-9]+$
      responses:
        "200":
          description: The logs produced by the runner execution.
          content:
            text/plain:
              schema:
                type: string
          headers:
            Content-Disposition:
              description: Suggests the filename for the downloaded file.
              schema:
                type: string
                example: 'attachment; filename="depId.log"'
        "400":
          $ref: "#/components/responses/400BadRequest"
        "404":
          $ref: "#/components/responses/404NotFound"

  /orgs/{orgId}/deployments/{deploymentId}/encrypted-outputs:
    get:
      operationId: getDeploymentEncryptedOutputs
      tags:
        - Deployment
      summary: Get the encrypted outputs produced by the deployment.
      description: |
        These outputs are only stored and available for a short time after the deployment completes and are returned encrypted by the private key
        that was given when the deployment was created. If no private key was provided, no outputs are available.
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
        - $ref: "#/components/parameters/deploymentIdPathParam"
      responses:
        "200":
          description: Successful get response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentEncryptedOutputs"
        "404":
          $ref: "#/components/responses/404NotFound"

  /orgs/{orgId}/deployments/{deploymentId}/bundle:
    get:
      operationId: getDeploymentBundle
      tags:
        - Deployment
      summary: Get a bundle archive for a deployment. This API is called by the runner during execution and is not intended for public consumption.
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
        - $ref: "#/components/parameters/deploymentIdPathParam"
        - name: X-Deployment-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful get response.
          content:
            application/x-gzip:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/400BadRequest"
        "404":
          $ref: "#/components/responses/404NotFound"

  /orgs/{orgId}/deployments/{deploymentId}/results:
    post:
      summary: Return the runner outcome for a specific deployment.
      description: |
        This receives the runner outcome for a specific deployment, eventually along with encrypted outputs and logs.
      operationId: updateDeploymentResults
      tags:
        - Deployment
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
        - $ref: "#/components/parameters/deploymentIdPathParam"
        - name: X-Deployment-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeploymentResultsUpdateBody"
      responses:
        "204":
          description: Results successfully received.
        "400":
          $ref: "#/components/responses/400BadRequest"
        "404":
          $ref: "#/components/responses/404NotFound"
        "409":
          $ref: "#/components/responses/409Conflict"

  /orgs/{orgId}/deployments/{deploymentId}/tf:
    get:
      summary: Returns the compiled TF file associated with a deployment.
      description: |
        This returns the compiled TF file associated with a deployment. This is intended for debugging purposes.
        This does not return the contents of any inline modules.
      operationId: getDeploymentTf
      tags:
        - Deployment
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
        - $ref: "#/components/parameters/deploymentIdPathParam"
      responses:
        "200":
          description: Successful get response.
          content:
            text/plain:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/404NotFound"

  /internal/orgs/{orgId}/deployments/{deploymentId}/actions/force-failure:
    post:
      operationId: internalForceFailDeployment
      tags:
        - internal
        - Deployment
      summary: Emergency API for force failing a deployment.
      description: |
        This should only be used once you have confirmed that the underlying runner job has stopped, failed, or will
        never execute.
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
        - $ref: "#/components/parameters/deploymentIdPathParam"
      responses:
        "200":
          description: Force failed deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentSummary"
        "404":
          $ref: "#/components/responses/404NotFound"
        "409":
          $ref: "#/components/responses/409Conflict"

  /internal/orgs/{orgId}/deployments/{deploymentId}/actions/acknowledge-outcome:
    post:
      operationId: internalAcknowledgeDeploymentOutcome
      tags:
        - internal
        - Deployment
      summary: Acknowledge the unknown Runner outcome of a failed plugin-dispatched Deployment.
      description: |
        Records, exactly once and with the acting user, that an operator has confirmed the Runner attempt of this
        failed plugin-dispatched Deployment can no longer change its Environment. Only the current Environment head
        without Runner stop evidence is accepted, after its Runner dispatch window closed. The acknowledgement lets
        the next Deployment of that Environment proceed. It does not change the Deployment's status or history.
        Requires the `deployment.outcome.acknowledge` permission for the Environment; the system user and organization
        tokens are rejected. Repeating the identical request returns the stored acknowledgement.
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
        - $ref: "#/components/parameters/deploymentIdPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeploymentOutcomeAcknowledgementBody"
      responses:
        "200":
          description: The identical acknowledgement was already recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentOutcomeAcknowledgement"
        "201":
          description: The acknowledgement was recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentOutcomeAcknowledgement"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "404":
          $ref: "#/components/responses/404NotFound"
        "409":
          $ref: "#/components/responses/409Conflict"

  /orgs/{orgId}/deployments/{deploymentId}/resources:
    get:
      operationId: listDeploymentResourceNodes
      tags:
        - Deployment
      summary: List resource nodes for a deployment
      description: |
        Returns the resource graph calculated for this deployment. Works for all
        deployment types including plan-only and historical deployments. Unlike
        active-resources, this endpoint returns graph nodes without runtime metadata.
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
        - $ref: "#/components/parameters/deploymentIdPathParam"
      responses:
        200:
          description: Resource nodes retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceNodesPage"
        404:
          $ref: "#/components/responses/404NotFound"

  /orgs/{orgId}/active-resources:
    get:
      operationId: listActiveResourceNodes
      tags:
        - ActiveResource
      summary: List active resource nodes
      description: |
        List active resource nodes matching the query. At the moment, project_id and env_id are required.
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
        - $ref: "#/components/parameters/projectIdQueryParam"
        - $ref: "#/components/parameters/envIdQueryParam"
      responses:
        200:
          description: Active resources retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListActiveResourceNodesPage"
        400:
          $ref: "#/components/responses/400BadRequest"
        404:
          $ref: "#/components/responses/404NotFound"

  /internal/orgs/{orgId}/modules/{moduleId}/actions/check-usage:
    post:
      summary: Check whether a given module is in use in a resource graph.
      description: |
        This is a simple and efficient API. It returns only the project environments which are using this module.
        A more complex public api should be created to list each individual resource node usage.
      operationId: internalCheckModuleUsage
      tags:
        - internal
        - Modules
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
        - name: moduleId
          in: path
          schema:
            type: string
          required: true
        - name: module_version
          in: query
          schema:
            type: string
          required: false
      responses:
        200:
          description: The module usage report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalModuleUsage"
        404:
          $ref: "#/components/responses/404NotFound"

  /orgs/{orgId}/metadata-keys:
    get:
      summary: List metadata keys for an organization
      description: |
        Returns a list of metadata keys for the specified organization. Each key is represented as a JSON object
        containing the key name, type, and other attributes.
      operationId: listMetadataKeys
      tags:
        - MetadataKey
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
        - $ref: "#/components/parameters/perPageQueryParam"
        - $ref: "#/components/parameters/pageTokenQueryParam"
      responses:
        200:
          description: Metadata keys retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataKeyPage"
        404:
          $ref: "#/components/responses/404NotFound"
    post:
      summary: Create a new metadata key for an organization
      description: |
        Creates a new metadata key for the specified organization. The request body should contain the key name,
        type, and other attributes.
      operationId: createMetadataKey
      tags:
        - MetadataKey
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetadataKeyCreateBody"
      responses:
        201:
          description: Metadata key created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataKey"
        400:
          $ref: "#/components/responses/400BadRequest"
        409:
          $ref: "#/components/responses/409Conflict"
        404:
          $ref: "#/components/responses/404NotFound"
  /orgs/{orgId}/metadata-keys/{metadataKeyName}:
    get:
      summary: Get a metadata key for an organization
      description: |
        Returns the details of a specific metadata key for the specified organization. The response includes
        the key name, type, and other attributes.
      operationId: getMetadataKey
      tags:
        - MetadataKey
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
        - $ref: "#/components/parameters/metadataKeyNamePathParam"
      responses:
        200:
          description: Metadata key retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataKey"
        404:
          $ref: "#/components/responses/404NotFound"
    delete:
      summary: Delete a metadata key for an organization
      description: |
        Deletes a specific metadata key for the specified organization. The request body should contain the key name.
      operationId: deleteMetadataKey
      tags:
        - MetadataKey
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
        - $ref: "#/components/parameters/metadataKeyNamePathParam"
      responses:
        204:
          description: Metadata key deleted successfully.
        404:
          $ref: "#/components/responses/404NotFound"
    patch:
      summary: Update a metadata key for an organization
      description: |
        Updates a specific metadata key for the specified organization. The request body should contain the updated
        attributes of the metadata key.
      operationId: updateMetadataKey
      tags:
        - MetadataKey
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
        - $ref: "#/components/parameters/metadataKeyNamePathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetadataKeyUpdateBody"
      responses:
        200:
          description: Metadata key updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataKey"
        400:
          $ref: "#/components/responses/400BadRequest"
        404:
          $ref: "#/components/responses/404NotFound"

  /internal/orgs/{orgId}/deployments:
    delete:
      operationId: internalDeleteDeployments
      tags:
        - internal
        - Deployment
      summary: Delete all the deployments for an project_id, env_id combination. The last deployment must be a successful destroy.
      security:
        - userIdHeader: []
      parameters:
        - $ref: "#/components/parameters/orgIdPathParam"
        - $ref: "#/components/parameters/projectIdQueryParam"
        - $ref: "#/components/parameters/envIdQueryParam"
        - name: force
          description: Whether to ignore the requirement for the last deployment to be a successful destroy. This should only be used in exceptional circumstances.
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "204":
          description: Successful delete response.
        "400":
          $ref: "#/components/responses/400BadRequest"
        "404":
          $ref: "#/components/responses/404NotFound"
        "409":
          $ref: "#/components/responses/409Conflict"

  "/.well-known/openid-configuration":
    get:
      operationId: getOpenidConfiguration
      tags:
        - WellKnown
      summary: Show OIDC discovery configuration.
      responses:
        "200":
          description: OIDC discovery configuration.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OpenidConfiguration"
        "404":
          $ref: "#/components/responses/404NotFound"
  "/.well-known/jwks":
    get:
      operationId: getJwks
      tags:
        - WellKnown
      summary: Show JSON Web Keys Set (JWKS).
      responses:
        "200":
          description: JSON Web Keys Set (JWKS).
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Jwks"
        "404":
          $ref: "#/components/responses/404NotFound"

components:
  securitySchemes:
    userIdHeader:
      type: apiKey
      in: header
      name: From
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    pluginContext:
      type: apiKey
      in: header
      name: X-Stellwerk-Plugin-Context

  responses:
    400BadRequest:
      description: The request was invalid. More detail can be found in the error body.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    401Unauthorized:
      description: The request-bound plugin context is absent or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    403Forbidden:
      description: Core no longer authorizes the exact operation, fence, dispatch, actor, scope and request digest.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    404NotFound:
      description: Either the resource or a related resource could not be found. More detail can be found in the error body.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    409Conflict:
      description: The request conflicts with existing state in the system.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    413TooLarge:
      description: Decrypted deployment material exceeds the 16 MiB response limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    503Unavailable:
      description: Authoritative Core authorization or DP-owned encryption material is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  parameters:
    orgIdPathParam:
      name: orgId
      in: path
      description: The Organization ID
      example: "sample-org"
      required: true
      schema:
        type: string
    pluginIdPathParam:
      name: pluginId
      in: path
      required: true
      schema: {type: string}
    idempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
    projectIdQueryParam:
      name: project_id
      in: query
      description: The Project ID
      example: "sample-project"
      required: false
      schema:
        type: string
    envIdQueryParam:
      name: env_id
      in: query
      description: The Environment ID
      example: "sample-env"
      required: false
      schema:
        type: string
    deploymentIdPathParam:
      name: deploymentId
      in: path
      description: A Deployment ID
      example: 01234567-89ab-cdef-0123-456789abcdef
      required: true
      schema:
        type: string
        format: uuid
    queueItemIdPathParam:
      name: queueItemId
      in: path
      description: A deployment queue item ID
      example: 01234567-89ab-cdef-0123-456789abcdef
      required: true
      schema:
        type: string
        format: uuid
    metadataKeyNamePathParam:
      name: metadataKeyName
      in: path
      description: The Metadata Key ID.
      required: true
      schema:
        type: string
    runnerIdPathParam:
      name: runnerId
      in: path
      description: The Runner ID
      example: "sample-runner"
      required: true
      schema:
        type: string
    perPageQueryParam:
      name: per_page
      in: query
      description: The maximum number of items to return in a page of results
      required: false
      example: 50
      schema:
        type: integer
    pageTokenQueryParam:
      name: page
      in: query
      description: The page token to request from
      required: false
      example: "AAAAAAAAAA=="
      schema:
        type: string
    byModeQueryParam:
      name: by_mode
      in: query
      description: Filter deployments by mode
      required: false
      schema:
        type: array
        items:
          # todo: make this enum reusable?
          type: string
          enum:
            - plan_only
            - deploy
            - rollback
            - rollback_plan
            - destroy
    byStatusQueryParam:
      name: by_status
      in: query
      description: Filter deployments by status
      required: false
      schema:
        type: array
        items:
          # todo: make this enum reusable?
          type: string
          enum:
            - executing
            - failed
            - succeeded

  schemas:
    ExternalEnvironmentRef:
      type: object
      additionalProperties: false
      required: [project_id, env_id, project_uuid, environment_uuid]
      properties:
        project_id: {type: string}
        env_id: {type: string}
        project_uuid: {type: string, format: uuid}
        environment_uuid: {type: string, format: uuid}

    ExternalModuleInventory:
      type: object
      additionalProperties: false
      required: [module_id, version]
      properties:
        module_id: {type: string}
        module_uuid: {type: string, format: uuid}
        version: {type: string}
        version_uuid: {type: string, format: uuid}
        semantic_version: {type: string}
        artifact_digest: {type: string}

    ExternalDeploymentReadinessBody:
      type: object
      additionalProperties: false
      required: [environments]
      properties:
        environments:
          type: array
          minItems: 1
          maxItems: 1000
          items: {$ref: "#/components/schemas/ExternalEnvironmentRef"}

    ExternalEnvironmentReadiness:
      type: object
      additionalProperties: false
      required: [project_id, env_id, project_uuid, environment_uuid, state, active_modules]
      properties:
        project_id: {type: string}
        env_id: {type: string}
        project_uuid: {type: string, format: uuid}
        environment_uuid: {type: string, format: uuid}
        state:
          type: string
          enum: [ready, busy, unreconciled]
          x-enum-varnames: [ExternalEnvironmentReadinessStateReady, ExternalEnvironmentReadinessStateBusy, ExternalEnvironmentReadinessStateUnreconciled]
        latest_deployment_id: {type: string, format: uuid}
        latest_status:
          type: string
          enum: [executing, failed, succeeded]
          x-enum-varnames: [ExternalEnvironmentReadinessLatestStatusExecuting, ExternalEnvironmentReadinessLatestStatusFailed, ExternalEnvironmentReadinessLatestStatusSucceeded]
        latest_mode:
          type: string
          enum: [deploy, destroy, rollback]
          x-enum-varnames: [ExternalEnvironmentReadinessLatestModeDeploy, ExternalEnvironmentReadinessLatestModeDestroy, ExternalEnvironmentReadinessLatestModeRollback]
        active_lease_until: {type: string, format: date-time}
        effective_base_deployment_id: {type: string, format: uuid}
        active_modules:
          type: array
          items: {$ref: "#/components/schemas/ExternalModuleInventory"}

    ExternalDeploymentReadinessResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/ExternalEnvironmentReadiness"}

    ExternalModuleSelection:
      type: object
      additionalProperties: false
      required: [module_uuid, version, version_uuid, semantic_version, artifact_digest]
      properties:
        module_uuid: {type: string, format: uuid}
        version: {type: string}
        version_uuid: {type: string, format: uuid}
        semantic_version: {type: string}
        artifact_digest: {type: string}

    ExternalDeploymentPlanBody:
      type: object
      additionalProperties: false
      required: [project_id, env_id, project_uuid, environment_uuid, module_versions]
      properties:
        project_id: {type: string}
        env_id: {type: string}
        project_uuid: {type: string, format: uuid}
        environment_uuid: {type: string, format: uuid}
        module_versions:
          type: object
          minProperties: 1
          additionalProperties: {$ref: "#/components/schemas/ExternalModuleSelection"}

    ExternalManifestResourceStructure:
      type: object
      additionalProperties: false
      required: [type, param_keys]
      properties:
        type: {type: string}
        class: {type: string}
        id: {type: string}
        param_keys: {type: array, items: {type: string}}

    ExternalManifestWorkloadStructure:
      type: object
      additionalProperties: false
      required: [output_keys, resources]
      properties:
        output_keys: {type: array, items: {type: string}}
        resources:
          type: object
          additionalProperties: {$ref: "#/components/schemas/ExternalManifestResourceStructure"}

    ExternalManifestStructure:
      type: object
      additionalProperties: false
      required: [shared, workloads]
      properties:
        shared:
          type: object
          additionalProperties: {$ref: "#/components/schemas/ExternalManifestResourceStructure"}
        workloads:
          type: object
          additionalProperties: {$ref: "#/components/schemas/ExternalManifestWorkloadStructure"}

    ExternalGraphNodeStructure:
      type: object
      additionalProperties: false
      required: [param_keys]
      properties:
        module_id: {type: string}
        version: {type: string}
        deleted: {type: boolean}
        param_keys: {type: array, items: {type: string}}
        drift: {type: string}

    ExternalGraphStructure:
      type: object
      additionalProperties: false
      required: [nodes, edges, workloads, shared_resources, leaf_resources]
      properties:
        nodes:
          type: object
          additionalProperties: {$ref: "#/components/schemas/ExternalGraphNodeStructure"}
        edges:
          type: object
          additionalProperties:
            type: object
            additionalProperties: {type: string}
        workloads:
          type: object
          additionalProperties: {type: string}
        shared_resources:
          type: object
          additionalProperties: {type: string}
        leaf_resources:
          type: array
          items: {type: string}

    ExternalDeploymentPlanResponse:
      type: object
      additionalProperties: false
      required: [snapshot_id, environment_uuid, effective_base_deployment_id, fingerprint, manifest, graph, diff, module_versions]
      properties:
        snapshot_id: {type: string, format: uuid}
        environment_uuid: {type: string, format: uuid}
        effective_base_deployment_id: {type: string, format: uuid}
        fingerprint: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        manifest: {$ref: "#/components/schemas/ExternalManifestStructure"}
        graph: {$ref: "#/components/schemas/ExternalGraphStructure"}
        diff: {$ref: "#/components/schemas/DeploymentDiff"}
        module_versions:
          type: array
          items: {$ref: "#/components/schemas/ExternalModuleInventory"}

    ExternalDeploymentAdmissionPlan:
      type: object
      additionalProperties: false
      required: [snapshot_id, fingerprint, expected_module_versions]
      properties:
        snapshot_id: {type: string, format: uuid}
        fingerprint: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        expected_module_versions:
          type: object
          minProperties: 1
          maxProperties: 1000
          additionalProperties: {type: string, format: uuid}

    ExternalDeploymentAdmissionRollback:
      type: object
      additionalProperties: false
      required: [forward_deployment_id]
      properties:
        forward_deployment_id: {type: string, format: uuid}
        retry_of_rollback_deployment_id: {type: string, format: uuid}

    ExternalDeploymentAdmissionBody:
      type: object
      additionalProperties: false
      required: [operation_ref, fence, project_id, env_id, project_uuid, environment_uuid, mode]
      properties:
        operation_ref: {type: string, format: uuid}
        first_forward_deployment_id: {type: string, format: uuid}
        fence: {type: integer, format: int64, minimum: 1}
        project_id: {type: string, minLength: 1}
        env_id: {type: string, minLength: 1}
        project_uuid: {type: string, format: uuid}
        environment_uuid: {type: string, format: uuid}
        mode: {type: string, enum: [deploy, rollback]}
        plan: {$ref: "#/components/schemas/ExternalDeploymentAdmissionPlan"}
        rollback: {$ref: "#/components/schemas/ExternalDeploymentAdmissionRollback"}
        runner_log_level: {type: string, enum: [debug, info, warn, error]}

    ExternalDeploymentAdmissionResponse:
      type: object
      additionalProperties: false
      required: [deployment_id, replayed]
      properties:
        deployment_id: {type: string, format: uuid}
        replayed: {type: boolean}

    ExternalDeploymentStatusResponse:
      type: object
      additionalProperties: false
      required: [deployment_id, dispatch_id, operation_ref, fence, request_digest, project_id, env_id, project_uuid, environment_uuid, mode, status, status_message, module_versions, rollback_module_versions, created_at, receipt_created_at]
      properties:
        deployment_id: {type: string, format: uuid}
        first_forward_deployment_id: {type: string, format: uuid}
        rollback_base_deployment_id: {type: string, format: uuid}
        admission_base_deployment_id: {type: string, format: uuid}
        forward_deployment_id: {type: string, format: uuid}
        retry_of_rollback_deployment_id: {type: string, format: uuid}
        rollback_retry_provenance_recorded:
          type: boolean
          description: Present on rollback status. True only when the retained receipt records validated predecessor provenance. False for read-only legacy lineage projection; terminal outcome and current-head eligibility remain separate admission checks.
        dispatch_id: {type: string}
        operation_ref: {type: string, format: uuid}
        fence: {type: integer, format: int64, minimum: 1}
        request_digest: {type: string, pattern: '^[a-f0-9]{64}$'}
        project_id: {type: string}
        env_id: {type: string}
        project_uuid: {type: string, format: uuid}
        environment_uuid: {type: string, format: uuid}
        mode:
          type: string
          enum: [deploy, rollback, destroy]
          x-enum-varnames: [ExternalDeploymentStatusModeDeploy, ExternalDeploymentStatusModeRollback, ExternalDeploymentStatusModeDestroy]
        status:
          type: string
          enum: [executing, failed, succeeded]
          x-enum-varnames: [ExternalDeploymentStatusExecuting, ExternalDeploymentStatusFailed, ExternalDeploymentStatusSucceeded]
        status_message: {type: string}
        module_versions:
          type: object
          maxProperties: 1000
          additionalProperties: {type: string, format: uuid}
        rollback_module_versions:
          type: object
          maxProperties: 1000
          additionalProperties: {type: string, format: uuid}
        rollback_modules:
          type: array
          maxItems: 1000
          description: Immutable metadata projected from the retained effective-base Deployment.
          items: {$ref: "#/components/schemas/ExternalModuleInventory"}
        created_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
        receipt_created_at: {type: string, format: date-time}

    Error:
      description: A standard error response
      properties:
        error:
          description: |
            A short code representing the class of error. This code can be used for tracking and observability or to
            find appropriate troubleshooting documentation.
          type: string
          example: API-000
        message:
          description: A human-readable explanation of the error.
          type: string
          example: "Something happened!"
        details:
          description: An optional payload of metadata associated with the error.
          additionalProperties: true
          type: object
      required:
        - error
        - message
      type: object

    OrganizationId:
      description: The Organization ID
      type: string
      minLength: 2
      example: my-org

    DeploymentId:
      description: The unique deployment id
      type: string
      format: uuid
      example: 01234567-89ab-cdef-0123-4566789abcdef

    ResourceClass:
      description: A resource class requested by the resource graph. 'default' is the default value.
      type: string
      minLength: 1
      maxLength: 63
      pattern: ^[A-Za-z0-9][A-Za-z0-9-]{0,61}[A-Za-z0-9]$
      x-pattern-error: resource class must be a valid identifier of alphanumerics and hyphens
      example: classic

    ResourceId:
      description: A specific resource id requested by the resource graph
      type: string
      example: standard.common-postgres
      minLength: 1
      maxLength: 63
      pattern: ^[a-z0-9]+(?:-+[a-z0-9]+)*(?:\.[a-z0-9]+(?:-+[a-z0-9]+)*)*$
      x-pattern-error: resource id must be a valid resource id with one or more dot-separated parts of lowercase alphanumerics and hyphens

    DeploymentResultsUpdateBody:
      description: The outcome of the runner execution.
      type: object
      properties:
        outputs:
          type: string
          format: base64
          description: The encrypted outputs produced by the runner.
        status:
          type: string
          enum:
            - success
            - failure
          description: The overall status of the runner execution.
        error:
          $ref: "#/components/schemas/Error"
        tf_resource_counts:
