        deployment_id:
          description: The failed plugin-dispatched Deployment that fences the Environment.
          type: string
          format: uuid
          example: "01234567-89ab-cdef-0123-456789abcdef"
        since:
          description: When the fencing Deployment failed.
          type: string
          format: date-time
          example: "2025-01-02T03:04:05Z"
        remedy:
          description: |
            The operator action that lifts the fence:
            `POST /internal/orgs/{orgId}/deployments/{deployment_id}/actions/acknowledge-outcome`.
          type: string
          enum:
            - acknowledge-outcome
          example: acknowledge-outcome
        remedy_available_at:
          description: |
