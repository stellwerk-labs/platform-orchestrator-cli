components:
    parameters:
        pageTokenQueryParam:
            description: Opaque token from the previous page's next_page_token.
            in: query
            name: page
            required: false
            schema:
                type: string
        perPageQueryParam:
            description: The maximum number of items to return in a page of results.
            example: 50
            in: query
            name: per_page
            required: false
            schema:
                default: 50
                maximum: 200
                minimum: 1
                type: integer
        planRevisionPathParam:
            description: Immutable numbered plan revision.
            in: path
            name: planRevision
            required: true
            schema:
                minimum: 1
                type: integer
        planRevisionQueryParam:
            description: Immutable numbered plan revision.
            in: query
            name: plan_revision
            required: true
            schema:
                minimum: 1
                type: integer
        rolloutIdPathParam:
            description: Progressive Rollout UUID.
            in: path
            name: rolloutId
            required: true
            schema:
                format: uuid
                type: string
    responses:
        ProgressiveRolloutError:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ProgressiveRolloutError'
            description: The plugin rejected or could not complete the operation. The original HTTP status is preserved.
    schemas:
        ModuleVersionPinStatus:
            description: Core Module Version Pin status, mirrored from the Core API. Core's definition is authoritative.
            enum:
                - active
                - override_pending
                - overridden
                - removed
            type: string
            x-stellwerk-core-schema: ModuleVersionPinStatus
        ModuleVersionSemanticStatus:
            description: Core Module Version semantic status, mirrored from the Core API. Core's definition is authoritative.
            enum:
                - proposed
                - default
                - deprecated
                - defective
            type: string
            x-enum-varnames:
                - ModuleVersionSemanticStatusProposed
                - ModuleVersionSemanticStatusDefault
                - ModuleVersionSemanticStatusDeprecated
                - ModuleVersionSemanticStatusDefective
            x-stellwerk-core-schema: ModuleVersionSemanticStatus
        ProgressiveRollout:
            properties:
                archived_at:
                    format: date-time
                    type: string
                created_at:
                    format: date-time
                    type: string
                created_by:
                    format: uuid
                    type: string
                current_plan_revision:
                    minimum: 1
                    type: integer
                execution_started:
                    type: boolean
                id:
                    format: uuid
                    type: string
                org_id:
                    type: string
                resource_version:
                    format: int64
                    minimum: 1
                    type: integer
                spec:
                    $ref: '#/components/schemas/ProgressiveRolloutSpec'
                state:
                    $ref: '#/components/schemas/ProgressiveRolloutState'
                status:
                    $ref: '#/components/schemas/ProgressiveRolloutStatus'
                updated_at:
                    format: date-time
                    type: string
            required:
                - id
                - org_id
                - spec
                - state
                - status
                - resource_version
                - execution_started
                - created_by
                - created_at
                - updated_at
            type: object
        ProgressiveRolloutApproval:
            properties:
                actor:
                    format: uuid
                    type: string
                coverages:
                    items:
                        $ref: '#/components/schemas/ProgressiveRolloutApprovalCoverage'
                    type: array
                granted_at:
                    format: date-time
                    type: string
                id:
                    format: uuid
                    type: string
                intent_fingerprint:
                    type: string
                plan_revision:
                    type: integer
                reason:
                    type: string
                revoked_at:
                    format: date-time
                    type: string
                rollout_id:
                    format: uuid
                    type: string
                scope_id:
                    format: uuid
                    type: string
                scope_type:
                    enum:
                        - environment
                        - project
                    type: string
            required:
                - id
                - rollout_id
                - plan_revision
                - scope_type
                - scope_id
                - reason
                - intent_fingerprint
                - coverages
                - actor
                - granted_at
            type: object
        ProgressiveRolloutApprovalBody:
            properties:
                plan_revision:
                    minimum: 1
                    type: integer
                reason:
                    description: Mandatory human-readable reason retained with the immutable approval grant.
                    maxLength: 500
                    minLength: 1
                    type: string
                scope_id:
                    format: uuid
                    type: string
                scope_type:
                    enum:
                        - environment
                        - project
                    type: string
            required:
                - plan_revision
                - scope_type
                - scope_id
                - reason
            type: object
        ProgressiveRolloutApprovalCoverage:
            properties:
                consumed_at:
                    format: date-time
                    type: string
                environment_id:
                    format: uuid
                    type: string
                invalidated_at:
                    format: date-time
                    type: string
                invalidation_reason:
                    type: string
                pin_activation_boundaries:
                    additionalProperties:
                        type: string
                    description: Target Module ID to exact latest Pin activation event UUID, or an empty value when none existed.
                    type: object
                revoked_at:
                    format: date-time
                    type: string
            required:
                - environment_id
                - pin_activation_boundaries
            type: object
        ProgressiveRolloutClassification:
            enum:
                - Pending
                - Pinned
                - AlreadyCompliant
                - NotApplicable
                - Conflict
            type: string
        ProgressiveRolloutCommandBody:
            properties:
                confirm_defective_versions:
                    default: false
                    description: Explicit confirmation that an authorised Rollback may restore a Defective starting version.
                    type: boolean
                environment_id:
                    format: uuid
                    type: string
                environment_ids:
                    description: Optional explicit subset for deferred Pin actions; omission selects every eligible Environment.
                    items:
                        format: uuid
                        type: string
                    type: array
                expected_resource_version:
                    format: int64
                    minimum: 1
                    type: integer
                reason:
                    description: Mandatory human reason for audited commands such as bypass-bake.
                    maxLength: 500
                    minLength: 1
                    type: string
                wave_id:
                    type: string
            required:
                - expected_resource_version
            type: object
        ProgressiveRolloutConcurrency:
            properties:
                absolute:
                    minimum: 1
                    type: integer
                percentage:
                    exclusiveMinimum: true
                    format: double
                    maximum: 100
                    minimum: 0
                    type: number
            type: object
        ProgressiveRolloutConflict:
            properties:
                actual:
                    additionalProperties: true
                    type: object
                created_at:
                    format: date-time
                    type: string
                environment_id:
                    format: uuid
                    type: string
                expected:
                    additionalProperties: true
                    type: object
                id:
                    format: uuid
                    type: string
                kind:
                    type: string
                module_id:
                    type: string
                observed_fingerprint:
                    type: string
                plan_revision:
                    type: integer
                resolution:
                    type: string
                resolved_at:
                    format: date-time
                    type: string
                resolved_by:
                    format: uuid
                    type: string
                rollout_id:
                    format: uuid
                    type: string
                status:
                    enum:
                        - open
                        - approved
                        - resolved
                        - aborted
                    type: string
            required:
                - id
                - rollout_id
                - plan_revision
                - environment_id
                - kind
                - expected
                - actual
                - observed_fingerprint
                - status
                - created_at
            type: object
        ProgressiveRolloutConflictResolutionBody:
            additionalProperties: false
            properties:
                expected_resource_version:
                    format: int64
                    minimum: 1
                    type: integer
                observed_fingerprint:
                    minLength: 1
                    type: string
                plan_revision:
                    minimum: 1
                    type: integer
            required:
                - plan_revision
                - observed_fingerprint
                - expected_resource_version
            type: object
        ProgressiveRolloutDetail:
            properties:
                approvals:
                    items:
                        $ref: '#/components/schemas/ProgressiveRolloutApproval'
                    type: array
                conflicts:
                    items:
                        $ref: '#/components/schemas/ProgressiveRolloutConflict'
                    type: array
                events:
                    items:
                        $ref: '#/components/schemas/ProgressiveRolloutEvent'
                    type: array
                executions:
                    description: Environment executions for the Rollout's current Plan revision, or an empty array when no current Plan exists. Historical Plans and audit events remain available through their dedicated endpoints and retained storage export.
                    items:
                        $ref: '#/components/schemas/ProgressiveRolloutEnvironmentExecution'
                    type: array
                metrics:
                    $ref: '#/components/schemas/ProgressiveRolloutMetrics'
                plan:
                    $ref: '#/components/schemas/ProgressiveRolloutPlan'
                rollout:
                    $ref: '#/components/schemas/ProgressiveRollout'
            required:
                - rollout
                - executions
                - approvals
                - conflicts
                - events
                - metrics
            type: object
        ProgressiveRolloutDraftUpdate:
            properties:
                expected_resource_version:
                    format: int64
                    minimum: 1
                    type: integer
                spec:
                    $ref: '#/components/schemas/ProgressiveRolloutSpec'
            required:
                - spec
                - expected_resource_version
            type: object
        ProgressiveRolloutEntitlementSuspension:
            description: Present only while the Rollout is Paused because Core stopped allowing forward work, which distinguishes it from a pause by a person. Renewal never resumes the Rollout; resume_available says that an explicit Resume by someone with rollout control is licensed again. Any command that moves the Rollout out of Paused ends the suspension.
            properties:
                resume_available:
                    type: boolean
                resume_available_at:
                    format: date-time
                    type: string
                state:
                    description: Core licence state that denied forward work, for example expired, revoked, untrusted, not_entitled or unavailable.
                    type: string
                suspended_at:
                    format: date-time
                    type: string
            required:
                - state
                - suspended_at
                - resume_available
            type: object
        ProgressiveRolloutEntitlementWarning:
            description: Present only while the Rollout is Running and Core reports the signed licence in its grace period. Forward work continues until grace_until; after it the Rollout is suspended for the licence.
            properties:
                grace_until:
                    format: date-time
                    type: string
                state:
                    enum:
                        - grace
                    type: string
                    x-enum-varnames:
                        - ProgressiveRolloutEntitlementWarningStateGrace
            required:
                - state
                - grace_until
            type: object
        ProgressiveRolloutEnvironmentExecution:
            properties:
                actual_versions:
                    additionalProperties:
                        type: string
                    type: object
                admission_base_deployment_id:
                    description: Latest admitted attempt's actual predecessor. Forward retry planning may use a later base without changing the rollback base.
                    format: uuid
                    type: string
                attempts:
                    minimum: 0
                    type: integer
                changed:
                    type: boolean
                completed_at:
                    format: date-time
                    type: string
                deployment_id:
                    format: uuid
                    type: string
                effective_base_deployment_id:
                    description: Immutable first successful state-changing Deployment captured before this Rollout's first forward admission. This is the rollback base, not a later forward retry's admission base.
                    format: uuid
                    type: string
                environment_id:
                    format: uuid
                    type: string
                execution_diff:
                    additionalProperties: true
                    type: object
                execution_fingerprint:
                    pattern: ^sha256:[a-f0-9]{64}$
                    type: string
                execution_graph:
                    additionalProperties: true
                    type: object
                execution_manifest:
                    additionalProperties: true
                    type: object
                first_forward_deployment_id:
                    description: Data Plane-owned first forward Deployment identity for this operation and Environment.
                    format: uuid
                    type: string
                last_error:
                    type: string
                pipeline_progress:
                    $ref: '#/components/schemas/ProgressiveRolloutPipelineProgress'
                pre_deployment_attempts:
                    minimum: 0
                    type: integer
                project_id:
                    type: string
                removal:
                    $ref: '#/components/schemas/ProgressiveRolloutEnvironmentRemoval'
                resource_version:
                    format: int64
                    minimum: 1
                    type: integer
                retry_at:
                    format: date-time
                    type: string
                retry_started_at:
                    format: date-time
                    type: string
                rollback_available:
                    description: Factual current-state eligibility to roll back this Environment to the Rollout's captured base. Authorization and authoritative Data Plane admission are still required.
                    type: boolean
                rollback_deployment_id:
                    format: uuid
                    type: string
                rollback_retry_available:
                    description: Factual current-state eligibility for an explicit retry of the latest failed rollback. Authorization and authoritative Data Plane admission are still required.
                    type: boolean
                rollback_retry_pending:
                    description: An explicit rollback retry command is durably recorded but its new Deployment has not been admitted.
                    type: boolean
                started_at:
                    format: date-time
                    type: string
                state:
                    $ref: '#/components/schemas/ProgressiveRolloutEnvironmentState'
                wave_id:
                    type: string
            required:
                - environment_id
                - project_id
                - wave_id
                - state
                - attempts
                - pre_deployment_attempts
                - changed
                - actual_versions
                - resource_version
            type: object
        ProgressiveRolloutEnvironmentRemoval:
            properties:
                actor:
                    format: uuid
                    type: string
                deleted_at:
                    format: date-time
                    type: string
                operation_id:
                    format: uuid
                    type: string
                reason:
                    type: string
            required:
                - actor
                - reason
                - operation_id
                - deleted_at
            type: object
        ProgressiveRolloutEnvironmentState:
            enum:
                - Pending
                - Pinned
                - UnpinnedPending
                - EnvironmentRemoved
                - AlreadyCompliant
                - NotApplicable
                - Busy
                - Unreconciled
                - AwaitingApproval
                - Blocked
                - Conflict
                - Running
                - Succeeded
                - Failed
                - RollingBack
                - RolledBack
            type: string
        ProgressiveRolloutEnvironmentTombstone:
            properties:
                deleted_at:
                    format: date-time
                    type: string
                deleted_by:
                    format: uuid
                    type: string
                deletion_operation_id:
                    format: uuid
                    type: string
                deletion_reason:
                    type: string
                environment_display_name:
                    type: string
                environment_id:
                    format: uuid
                    type: string
                environment_slug:
                    type: string
                project_id:
                    type: string
                project_uuid:
                    format: uuid
                    type: string
                wave_id:
                    type: string
            required:
                - environment_id
                - environment_slug
                - project_id
                - project_uuid
                - wave_id
            type: object
        ProgressiveRolloutError:
            properties:
                code:
                    description: Machine-readable error code, for example invalid_request, forbidden, not_found, conflict, plugin_not_entitled or plugin_unavailable.
                    type: string
                message:
                    description: Human-readable detail when available.
                    type: string
            required:
                - code
            type: object
        ProgressiveRolloutEvent:
            properties:
                actor:
                    format: uuid
                    type: string
                created_at:
                    format: date-time
                    type: string
                payload:
                    additionalProperties: true
                    type: object
                plan_revision:
                    type: integer
                rollout_id:
                    format: uuid
                    type: string
                sequence:
                    format: int64
                    type: integer
                type:
                    type: string
            required:
                - sequence
                - rollout_id
                - type
                - payload
                - created_at
            type: object
        ProgressiveRolloutMetrics:
            properties:
                approval_wait_seconds:
                    format: int64
                    minimum: 0
                    type: integer
                bake_bypass_count:
                    minimum: 0
                    type: integer
                bake_duration_seconds:
                    format: int64
                    minimum: 0
                    type: integer
                blocked_environments:
                    minimum: 0
                    type: integer
                continue_unpinned_count:
                    minimum: 0
                    type: integer
                duration_seconds:
                    format: int64
                    minimum: 0
                    type: integer
                environment_removed_count:
                    minimum: 0
                    type: integer
                failure_rate:
                    format: double
                    maximum: 1
                    minimum: 0
                    type: number
                pin_override_count:
                    minimum: 0
                    type: integer
                pinned_environments:
                    minimum: 0
                    type: integer
                rollback_count:
                    minimum: 0
                    type: integer
                success_rate:
                    format: double
                    maximum: 1
                    minimum: 0
                    type: number
                superseded_count:
                    maximum: 1
                    minimum: 0
                    type: integer
                unpinned_pending_environments:
                    minimum: 0
                    type: integer
                waves:
                    items:
                        $ref: '#/components/schemas/ProgressiveRolloutWaveMetrics'
                    type: array
            required:
                - duration_seconds
                - success_rate
                - failure_rate
                - blocked_environments
                - pinned_environments
                - unpinned_pending_environments
                - environment_removed_count
                - approval_wait_seconds
                - bake_duration_seconds
                - bake_bypass_count
                - pin_override_count
                - continue_unpinned_count
                - superseded_count
                - rollback_count
                - waves
            type: object
        ProgressiveRolloutModuleChange:
            properties:
                from:
                    minLength: 1
                    type: string
                module_id:
                    minLength: 1
                    type: string
                target_digest:
                    description: Exact immutable external artifact digest. Empty for inline source.
                    type: string
                target_status:
                    $ref: '#/components/schemas/ModuleVersionSemanticStatus'
                target_version:
                    minLength: 5
                    type: string
            required:
                - module_id
                - from
                - target_version
                - target_digest
                - target_status
            type: object
        ProgressiveRolloutModuleSnapshot:
            properties:
                digest:
                    type: string
                status:
                    $ref: '#/components/schemas/ModuleVersionSemanticStatus'
                version:
                    type: string
            required:
                - version
                - digest
            type: object
        ProgressiveRolloutPage:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/ProgressiveRollout'
                    type: array
                next_page_token:
                    type: string
                view_counts:
                    $ref: '#/components/schemas/ProgressiveRolloutViewCounts'
            required:
                - items
            type: object
        ProgressiveRolloutPinNoteSnapshot:
            properties:
                actor:
                    format: uuid
                    type: string
                actor_type:
                    type: string
                created_at:
                    format: date-time
                    type: string
                id:
                    format: uuid
                    type: string
                note:
                    type: string
            required:
                - id
                - actor
                - actor_type
                - note
                - created_at
            type: object
        ProgressiveRolloutPinSnapshot:
            properties:
                activation_event_id:
                    format: uuid
                    type: string
                created_at:
                    format: date-time
                    type: string
                created_by:
                    format: uuid
                    type: string
                created_by_type:
                    type: string
                creation_reason:
                    type: string
                id:
                    format: uuid
                    type: string
                module_id:
                    type: string
                notes:
                    items:
                        $ref: '#/components/schemas/ProgressiveRolloutPinNoteSnapshot'
                    type: array
                override_actor:
                    format: uuid
                    type: string
                override_deployment_id:
                    format: uuid
                    type: string
                override_operation_id:
                    format: uuid
                    type: string
                override_reason:
                    type: string
                scope_id:
                    format: uuid
                    type: string
                scope_type:
                    enum:
                        - environment
                    type: string
                status:
                    $ref: '#/components/schemas/ModuleVersionPinStatus'
                version:
                    type: string
            required:
                - id
                - module_id
                - version
                - activation_event_id
                - created_at
            type: object
        ProgressiveRolloutPipelineBindings:
            additionalProperties: false
            properties:
                forward:
                    $ref: '#/components/schemas/ProgressiveRolloutPipelineReference'
                forward_only:
                    type: boolean
                rollback:
                    $ref: '#/components/schemas/ProgressiveRolloutPipelineReference'
            required:
                - forward
                - forward_only
            type: object
        ProgressiveRolloutPipelineChoice:
            properties:
                deploy:
                    $ref: '#/components/schemas/ProgressiveRolloutPipelineCompatibility'
                name:
                    maxLength: 120
                    type: string
                pipeline_id:
                    format: uuid
                    type: string
                reference:
                    $ref: '#/components/schemas/ProgressiveRolloutPipelineReference'
                rollback:
                    $ref: '#/components/schemas/ProgressiveRolloutPipelineCompatibility'
                version:
                    minimum: 1
                    type: integer
            required:
                - reference
                - version
                - name
                - deploy
                - rollback
            type: object
        ProgressiveRolloutPipelineChoices:
            properties:
                default_source:
                    enum:
                        - environment
                        - project
                        - none
                    type: string
                effective_default:
                    $ref: '#/components/schemas/ProgressiveRolloutPipelineReference'
                effective_rollback_default:
                    $ref: '#/components/schemas/ProgressiveRolloutPipelineReference'
                rollback_default_source:
                    enum:
                        - environment
                        - project
                        - none
                    type: string
                versions:
                    items:
                        $ref: '#/components/schemas/ProgressiveRolloutPipelineChoice'
                    maxItems: 1000
                    type: array
            required:
                - versions
                - default_source
            type: object
        ProgressiveRolloutPipelineCompatibility:
            properties:
                compatible:
                    type: boolean
                reason:
                    type: string
            required:
                - compatible
            type: object
        ProgressiveRolloutPipelineIssue:
            additionalProperties: false
            properties:
                code:
                    enum:
                        - pipeline_unavailable
                        - pipeline_incompatible
                        - rollback_pipeline_required
                    type: string
            required:
                - code
            type: object
        ProgressiveRolloutPipelineOverride:
            additionalProperties: false
            properties:
                environment_uuid:
                    format: uuid
                    type: string
                forward:
                    $ref: '#/components/schemas/ProgressiveRolloutPipelineReference'
                rollback:
                    $ref: '#/components/schemas/ProgressiveRolloutPipelineReference'
            required:
                - environment_uuid
            type: object
        ProgressiveRolloutPipelineProgress:
            additionalProperties: false
            properties:
                admission_closed:
                    type: boolean
                attention_reason:
                    maxLength: 256
                    type: string
                infrastructure_applied:
                    type: boolean
                phase:
                    maxLength: 64
                    type: string
                plan_subject:
                    maxLength: 128
                    type: string
                reference:
                    $ref: '#/components/schemas/ProgressiveRolloutPipelineReference'
            required:
                - reference
                - phase
                - infrastructure_applied
                - admission_closed
            type: object
        ProgressiveRolloutPipelineReference:
            additionalProperties: false
            description: Exactly one published version_id or the policy-off builtin default, with its immutable recipe digest.
            maxProperties: 2
            minProperties: 2
            properties:
                builtin:
                    enum:
                        - default
                    type: string
                digest:
                    pattern: ^[a-f0-9]{64}$
                    type: string
                version_id:
                    format: uuid
                    type: string
            required:
                - digest
            type: object
        ProgressiveRolloutPipelineSelection:
            additionalProperties: false
            description: Explicitly opt in to directional Core defaults; absent on retained legacy drafts. Omitted on update preserves the stored selection for older writers.
            properties:
                mode:
                    enum:
                        - defaults
                        - custom
                    type: string
                overrides:
                    items:
                        $ref: '#/components/schemas/ProgressiveRolloutPipelineOverride'
                    maxItems: 1000
                    type: array
            required:
                - mode
            type: object
        ProgressiveRolloutPlan:
            properties:
                changes:
                    items:
                        $ref: '#/components/schemas/ProgressiveRolloutPlanModuleChange'
                    type: array
                created_at:
                    format: date-time
                    type: string
                default_promotion:
                    enum:
                        - none
                        - atStart
                        - onSuccess
                    type: string
                environments:
                    items:
                        $ref: '#/components/schemas/ProgressiveRolloutPlannedEnvironment'
                    type: array
                fingerprint:
                    type: string
                forward_only:
                    description: Explicit reviewed rollback opt-out; absent only on retained legacy plans.
                    type: boolean
                promotions:
                    items:
                        $ref: '#/components/schemas/ProgressiveRolloutPromotion'
                    type: array
                revision:
                    minimum: 0
                    type: integer
                waves:
                    items:
                        $ref: '#/components/schemas/ProgressiveRolloutPlannedWave'
                    type: array
            required:
                - revision
                - fingerprint
                - created_at
                - changes
                - waves
                - environments
                - default_promotion
                - promotions
            type: object
        ProgressiveRolloutPlanModuleChange:
            properties:
                from:
                    type: string
                module_id:
                    type: string
                target_digest:
                    type: string
                target_status:
                    $ref: '#/components/schemas/ModuleVersionSemanticStatus'
                target_version:
                    type: string
                target_version_uuid:
                    description: Exact immutable Core Module Version identity frozen by the Plan.
                    format: uuid
                    type: string
            required:
                - module_id
                - from
                - target_version
                - target_digest
                - target_status
            type: object
        ProgressiveRolloutPlannedChange:
            properties:
                classification:
                    $ref: '#/components/schemas/ProgressiveRolloutClassification'
                module_id:
                    type: string
                observed_fingerprint:
                    type: string
                reason:
                    type: string
                starting_digest:
                    type: string
                starting_version:
                    type: string
                target_digest:
                    type: string
                target_version:
                    type: string
            required:
                - module_id
                - target_version
                - target_digest
                - classification
            type: object
        ProgressiveRolloutPlannedEnvironment:
            properties:
                changes:
                    items:
