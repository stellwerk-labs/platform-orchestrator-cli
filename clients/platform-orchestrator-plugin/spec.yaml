openapi: 3.0.0
info:
  title: Stellwerk native plugin user transport
  version: experimental-2026-09-28
paths:
  /orgs/{orgId}/plugins:
    get:
      operationId: listPluginContributions
      parameters:
        - $ref: '#/components/parameters/orgId'
      responses:
        '200':
          description: Discoverable plugin contributions.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginContributionPage'}
        default: {$ref: '#/components/responses/Error'}
  /orgs/{orgId}/plugins/{pluginId}/invoke:
    post:
      operationId: invokePluginOperation
      parameters:
        - $ref: '#/components/parameters/orgId'
        - $ref: '#/components/parameters/pluginId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PluginInvocation'}
      responses:
        '200':
          description: The plugin's bounded response.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginInvocationResult'}
        default: {$ref: '#/components/responses/Error'}
  /orgs/{orgId}/plugins/{pluginId}/projects/{projectUuid}/envs/{environmentUuid}/deployments/{deploymentId}/{materialKind}:
    get:
      operationId: getPluginDeploymentMaterial
      parameters:
        - $ref: '#/components/parameters/orgId'
        - $ref: '#/components/parameters/pluginId'
        - {name: projectUuid, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: environmentUuid, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: deploymentId, in: path, required: true, schema: {type: string, format: uuid}}
        - name: materialKind
          in: path
          required: true
          schema: {type: string, enum: [logs, outputs]}
      responses:
        '200':
          description: Original protected material bytes.
          content:
            text/plain:
              schema: {type: string}
        default: {$ref: '#/components/responses/Error'}
components:
  parameters:
    orgId: {name: orgId, in: path, required: true, schema: {type: string}}
    pluginId: {name: pluginId, in: path, required: true, schema: {type: string}}
  responses:
    Error:
      description: Request failed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error: {type: string}
        message: {type: string}
    PluginAvailabilityState:
      type: string
      enum: [available, not_installed, not_enabled, not_entitled, incompatible, unavailable]
    PluginOperation:
      type: object
      additionalProperties: false
      required: [id, method, mutating]
      properties:
        id: {type: string}
        method: {type: string}
        mutating: {type: boolean}
    PluginContribution:
      type: object
      required: [id, display_name, state, mode, operations]
      properties:
        id: {type: string}
        display_name: {type: string}
        version: {type: string}
        state: {$ref: '#/components/schemas/PluginAvailabilityState'}
        mode: {type: string, enum: [full, read_only, safety_only, hidden]}
        operations:
          type: array
          items: {$ref: '#/components/schemas/PluginOperation'}
    PluginContributionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/PluginContribution'}
    PluginInvocation:
      type: object
      additionalProperties: false
      required: [operation_id]
      properties:
        operation_id: {type: string}
        path_parameters: {type: object, additionalProperties: {type: string}}
        query: {type: object, additionalProperties: {type: array, items: {type: string}}}
        body:
          x-go-type: json.RawMessage
        idempotency_key: {type: string, maxLength: 128}
    PluginInvocationResult:
      type: object
      required: [status, body]
      properties:
        status: {type: integer}
        body:
          x-go-type: json.RawMessage
