name: CI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable or vX.Y.Z-rc.N candidate tag to publish
        required: true
        type: string
      candidate_sha:
        description: Approved full 40-character commit SHA (required for RC publication)
        required: false
        type: string
  push:
    branches:
      - main
    tags:
      - 'v**'
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: go1.26.10
  GOWORK: 'off'
  GOENV: 'off'
  GOFLAGS: ''
  GOEXPERIMENT: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publication-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && contains(inputs.release_tag, '-rc.') && inputs.candidate_sha || github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          persist-credentials: false

      - name: Checkout the exact semantic-release action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: stellwerk-labs/semantic-release-action
          ref: b1269e93b486873118eef1646bfcd46a9d23d3a3
          path: .release-tools
          persist-credentials: false

      - name: Test version assignment without credentials or network
        run: |
          set -euo pipefail
          docker build -t cli-semantic-release-contract .release-tools
          docker run --rm --network none \
            --mount "type=bind,source=$PWD,target=/checkout,readonly" \
            --entrypoint sh cli-semantic-release-contract \
            /checkout/scripts/test-release-versioning.sh

  candidate-preflight:
    if: github.repository == 'stellwerk-labs/platform-orchestrator-cli' && github.event_name == 'workflow_dispatch' && contains(inputs.release_tag, '-rc.')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout approved candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require immutable candidate and pre-provisioned reviewer approval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_TAG: ${{ inputs.release_tag }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/environments/public-release-candidate" > "$RUNNER_TEMP/candidate-environment.json"
          python3 scripts/candidate-release.py "$CANDIDATE_TAG" "$CANDIDATE_SHA" \
            --environment-json "$RUNNER_TEMP/candidate-environment.json"

  candidate-release:
    if: github.repository == 'stellwerk-labs/platform-orchestrator-cli' && github.event_name == 'workflow_dispatch' && contains(inputs.release_tag, '-rc.')
    needs:
      - candidate-preflight
      - publication-contract
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: public-release-candidate
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Checkout tested immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate candidate and refuse an existing image tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_TAG: ${{ inputs.release_tag }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/environments/public-release-candidate" > "$RUNNER_TEMP/candidate-environment.json"
          python3 scripts/candidate-release.py "$CANDIDATE_TAG" "$CANDIDATE_SHA" \
            --environment-json "$RUNNER_TEMP/candidate-environment.json" \
            --check-image-absent stellwerk-labs/octl

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'

      - name: Install Cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: 'v2.6.1'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.0.0
        with:
          version: v0.38.0
          driver-opts: |
            image=moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
            provenance-add-gha=false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Install verified release-content tools
        run: |
          ./scripts/install-release-tools.sh "$RUNNER_TEMP/release-tools"
          ./scripts/install-oras.sh "$RUNNER_TEMP/release-tools"
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/scripts" >> "$GITHUB_PATH"
          source scripts/release-tools.sh
          docker pull "$syft_image"

      - name: Publish signed candidate without stable package-manager updates
        # The OSS SBOM pipe qualifies every archive and the local OCI layout
        # before GoReleaser signs or uploads any release artifact.
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: 'v2.18.1'
          args: release --clean --skip=publish --release-notes=docs/releases/${{ inputs.release_tag }}.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ inputs.release_tag }}
          GH_PAT: ${{ github.token }}

      - name: Reserve candidate draft after local build and signing
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ inputs.release_tag }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          python3 scripts/candidate-release-metadata.py snapshot-assets "$CANDIDATE_TAG" dist \
            "$RUNNER_TEMP/candidate-local-assets.json"
          python3 scripts/candidate-release-metadata.py reserve "$CANDIDATE_TAG" "$CANDIDATE_SHA" \
            "docs/releases/$CANDIDATE_TAG.md" "$RUNNER_TEMP/candidate-reservation.json"

      - name: Upload and bind the exact signed candidate assets
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ inputs.release_tag }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          python3 scripts/candidate-release-metadata.py upload "$CANDIDATE_TAG" "$CANDIDATE_SHA" \
            "docs/releases/$CANDIDATE_TAG.md" "$RUNNER_TEMP/candidate-reservation.json" dist \
            "$RUNNER_TEMP/candidate-local-assets.json" \
            "$RUNNER_TEMP/candidate-assets.json"

      - name: Publish only the qualified candidate image bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-qualified-image.py dist

      - name: Verify candidate image index and native CLI smoke
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          image_tag="${RELEASE_TAG#v}"
          docker buildx imagetools inspect "ghcr.io/stellwerk-labs/octl:${image_tag}"
          docker run --rm "ghcr.io/stellwerk-labs/octl:${image_tag}" --version | grep -F "$image_tag"

      - name: Revalidate and publish the same fully qualified candidate release
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ inputs.release_tag }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          python3 scripts/candidate-release-metadata.py publish "$CANDIDATE_TAG" "$CANDIDATE_SHA" \
            "docs/releases/$CANDIDATE_TAG.md" "$RUNNER_TEMP/candidate-reservation.json" \
            dist "$RUNNER_TEMP/candidate-assets.json"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && contains(inputs.release_tag, '-rc.') && inputs.candidate_sha || github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Install pinned Cosign for offline producer contract
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: 'v2.6.1'

      - name: Acquire pinned Cosign offline runtime
        run: docker pull ghcr.io/sigstore/cosign/cosign@sha256:9e5c2f2edc34351160407ca3416c61855bdf9403c3c5936e0f0be7fc261611b8

      - name: Test candidate publication contract
        run: |
          python3 scripts/candidate-release_test.py
          python3 scripts/stable-release-preflight_test.py
          python3 scripts/cosign-offline-attestation_test.py

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'

      - name: Generate
        run: make generate

      - name: Install checksum-verified content scanner
        run: |
          ./scripts/install-release-tools.sh "$RUNNER_TEMP/release-tools"
          ./scripts/install-oras.sh "$RUNNER_TEMP/release-tools"
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/scripts" >> "$GITHUB_PATH"
          source scripts/release-tools.sh
          docker pull "$syft_image"

      - name: Verify release notice collection and fail-closed boundaries
        run: go test -count=1 -v ./scripts/licensecollector

      - name: Test release content and qualification boundaries
        run: |
          python3 scripts/release_content_test.py
          python3 scripts/qualify_release_test.py
          python3 scripts/client_oci_test.py

      - name: Check vendored API specifications
        run: make check-api-specs

      - name: Check known Go vulnerabilities
        run: sh scripts/check-go-security.sh

      - name: Test
        run: go tool gotestsum --format github-actions

      - name: Build
        run: go build -o ${{ runner.temp }}/octl ./

      - name: Verify CLI starts
        run: ${{ runner.temp }}/octl --version

      - name: Lint
        uses: golangci/golangci-lint-action@db9de0fc1a667e1a49d2291a1a042dff081d78f6 # v9
        with:
          version: v2.11.4

      - name: Tidy modules
        run: go mod tidy

      - name: Check generated and module files
        run: git diff --exit-code

      - name: Validate GoReleaser release configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: 'v2.18.1'
          args: check

      - name: Run GoReleaser snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: 'v2.18.1'
          args: build --snapshot

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.0.0
        with:
          context: .
          push: false

  release:
    if: github.repository == 'stellwerk-labs/platform-orchestrator-cli' && !contains(inputs.release_tag, '-rc.') && !contains(github.ref_name, '-rc.') && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))))
    needs: [test, publication-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      id-token: write
      packages: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Create semantic release
        id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: stellwerk-labs/semantic-release-action@b1269e93b486873118eef1646bfcd46a9d23d3a3
        with:
          token: ${{ github.token }}

      - name: Resolve release version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          GIT_REF_NAME: ${{ github.ref_name }}
          MANUAL_TAG: ${{ inputs.release_tag }}
          SEMANTIC_TAG: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME:$GIT_REF" in
            push:refs/heads/main) release_tag="$SEMANTIC_TAG" ;;
            push:refs/tags/v*) release_tag="$GIT_REF_NAME" ;;
            workflow_dispatch:*) release_tag="$MANUAL_TAG" ;;
            *) release_tag="" ;;
          esac

          if [ -z "$release_tag" ]; then
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "image_tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin "refs/tags/${release_tag}:refs/tags/${release_tag}"
          test "$(git rev-list -n 1 "$release_tag")" = "$(git rev-parse HEAD)"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "image_tag=${release_tag#v}" >> "$GITHUB_OUTPUT"

      - name: Verify fresh publication and distribution access
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PAT: ${{ secrets.GH_PAT }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: python3 scripts/stable-release-preflight.py "$RELEASE_TAG" "$(git rev-parse HEAD)"

      - name: Reserve stable draft for GoReleaser
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --latest=false \
            --title "$RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"

      - name: Install Cosign
        if: steps.version.outputs.tag != ''
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: 'v2.6.1'

      - name: Set up QEMU
        if: steps.version.outputs.tag != ''
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.0.0

      - name: Set up Docker Buildx
        if: steps.version.outputs.tag != ''
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.0.0
        with:
          version: v0.38.0
          driver-opts: |
            image=moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
            provenance-add-gha=false

      - name: Login to GitHub Container Registry
        if: steps.version.outputs.tag != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Install verified release-content tools
        if: steps.version.outputs.tag != ''
        run: |
          ./scripts/install-release-tools.sh "$RUNNER_TEMP/release-tools"
          ./scripts/install-oras.sh "$RUNNER_TEMP/release-tools"
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/scripts" >> "$GITHUB_PATH"
          source scripts/release-tools.sh
          docker pull "$syft_image"

      - name: Publish release
        if: steps.version.outputs.tag != ''
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: 'v2.18.1'
          args: release --clean --release-notes=docs/releases/${{ steps.version.outputs.tag }}.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: Publish only the qualified stable image bytes
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-qualified-image.py dist

      - name: Verify release artifacts
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          IMAGE_TAG: ${{ steps.version.outputs.image_tag }}
        run: |
          set -euo pipefail
          asset_count=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')
          test "$asset_count" -ge 18
          docker buildx imagetools inspect "ghcr.io/stellwerk-labs/octl:${IMAGE_TAG}"
          docker run --rm "ghcr.io/stellwerk-labs/octl:${IMAGE_TAG}" --version | grep -F "$IMAGE_TAG"
