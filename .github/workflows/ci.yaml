name: CI
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing semantic version tag to publish
        required: true
        type: string
  push:
    branches:
      - main
    tags:
      - 'v**'
  pull_request:
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      - name: setup-go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: generate
        run: make generate
      - name: check vendored API specifications
        run: make check-api-specs
      - name: test
        run: go tool gotestsum --format github-actions
      - name: build
        run: go build -o ${{ runner.temp }}/octl ./
      - name: cli-should-run
        run: ${{ runner.temp }}/octl --version
      - name: lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
      - name: tidy
        run: go mod tidy
      - name: diff
        run: git diff --exit-code
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: build --snapshot
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false

  release:
    needs:
      - test
    permissions:
      contents: write
      issues: write
      id-token: write
      packages: write
      pull-requests: write
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      - name: Validate manual release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git describe --tags --exact-match)" = "$RELEASE_TAG"
      - id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: stellwerk-labs/semantic-release-action@main
        with:
          token: ${{ github.token }}
      - name: Install Cosign
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: sigstore/cosign-installer@v3
      - name: Set up QEMU
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Run GoReleaser
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_PAT: ${{ secrets.GH_PAT }}
